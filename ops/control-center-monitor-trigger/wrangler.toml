# Cloudflare Worker for the Control Center monitor clock. Deploying it and
# setting its secret need the Owner's approval (new infrastructure + secret).
name = "idogs-control-center-monitor-trigger"
main = "worker.mjs"
compatibility_date = "2026-11-01"
workers_dev = false

[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
