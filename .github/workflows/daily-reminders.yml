name: Daily Reminders

on:
  schedule:
    - cron: '0 22 * * *'  # 8am AEST (UTC+10) = 10pm UTC
  workflow_dispatch:
    inputs:
      verify_sms_readiness:
        description: Read-only SMS runtime check; skips reminder sending
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  send-reminders:
    if: ${{ !inputs.verify_sms_readiness }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminders API
        run: |
          curl -X POST https://idogs.com.au/api/send-reminders \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --fail \
            --silent \
            --show-error

  verify-sms-readiness:
    if: ${{ inputs.verify_sms_readiness }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify deployed SMS runtime without sending
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          assert.ok(process.env.CRON_SECRET)
          const response=await fetch('https://idogs.com.au/api/sms-readiness',{
            method:'GET',headers:{'x-cron-secret':process.env.CRON_SECRET},
            signal:AbortSignal.timeout(20000),
          })
          const result=await response.json()
          console.log(JSON.stringify(result))
          assert.equal(response.status,200)
          assert.equal(result.sourceSha,process.env.EXPECTED_SHA)
          assert.equal(result.project,'idogs-app')
          for(const key of ['sendingEnabled','providerAuthenticated','expectedAccount','readOnly'])assert.equal(result[key],true,key)
          assert.equal(result.reason,'READY')
          NODE
