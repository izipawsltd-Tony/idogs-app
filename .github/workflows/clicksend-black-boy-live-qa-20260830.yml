name: Guarded ClickSend Black Boy Preview QA 20260830

on:
  push:
    branches:
      - feature/clicksend-sms-provider-20260830

permissions:
  contents: read

jobs:
  clicksend-preview-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact ClickSend QA SHA
        uses: actions/checkout@v4
        with:
          ref: 12090c8a325e030cf35dc753697677f544f77368
          fetch-depth: 0

      - name: Fail closed on exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "12090c8a325e030cf35dc753697677f544f77368"
          test -z "$(git status --porcelain)"
          node --check api/_lib/sms-provider.js
          node --check api/qa-sms-black-boy.js
          grep -Fq "failedDeliveryRetryable" api/qa-sms-black-boy.js
          grep -Fq "rest.clicksend.com/v3/sms/send" api/_lib/sms-provider.js

      - name: Install dependencies
        run: npm ci

      - name: Regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-sms-provider.mjs
          node scripts/test-sms-addon-v1.mjs
          node scripts/test-reminders-batch-regression.mjs
          node scripts/test-cron-auth.mjs
          node scripts/test-webhook-handler.mjs

      - name: Build
        run: npm run build

      - name: Link idogs-app project for Preview only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"projectId":"prj_UsnGhC1BWtYnmF5rKMYBR9KWkbIo","orgId":"team_oZF1Z0BUEceb9fAXdmFV1Saz","projectName":"idogs-app"}
          JSON

      - name: Pull Preview settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects

      - name: Reverify exact clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "12090c8a325e030cf35dc753697677f544f77368"
          mapfile -t changed < <(git diff --name-only)
          if (( ${#changed[@]} == 1 )) && [[ "${changed[0]}" == "package-lock.json" ]]; then
            git restore --source=HEAD -- package-lock.json
          elif (( ${#changed[@]} != 0 )); then
            printf 'Unexpected tracked drift:\n%s\n' "${changed[@]}"
            exit 1
          fi
          test -z "$(git status --porcelain)"

      - name: Deploy exact source to Preview only
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          PREVIEW_URL=$(npx --yes vercel@latest deploy --yes --archive=tgz --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects 2>&1 | tee /tmp/vercel-deploy.log | grep -Eo 'https://[^ ]+\.vercel\.app' | tail -1)
          test -n "$PREVIEW_URL"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"

      - name: Gate B dry-run must PASS before send
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          OUT=$(npx --yes vercel@latest curl /api/qa-sms-black-boy --deployment "$PREVIEW_URL")
          printf '%s\n' "$OUT" > /tmp/gate-b.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/gate-b.json'))
          assert d.get('safeToSend') is True, d
          checks=d.get('checks',{})
          required=['previewEnvironment','firebaseProjectExact','userExists','dogExists','dogNameExact','dogOwnedByExactUid','activeWormingExists','wormingDueExact','smsAddonActive','smsCreditsLimit20','smsBillingPeriodValid','validAustralianMobile','oneSmsSegment','smsProviderIsClickSend','smsProviderConfigPresent']
          assert all(checks.get(k) is True for k in required), d
          sms=d.get('sms',{})
          assert sms.get('creditsUsed') == 0 and sms.get('creditsLimit') == 20, d
          assert sms.get('deliveryStatus') in (None,'failed'), d
          print('GATE_B_PASS', json.dumps({
            'safeToSend': d.get('safeToSend'),
            'failedDeliveryRetryable': d.get('failedDeliveryRetryable'),
            'creditsUsed': sms.get('creditsUsed'),
            'creditsLimit': sms.get('creditsLimit'),
            'deliveryStatus': sms.get('deliveryStatus'),
            'providerClickSend': checks.get('smsProviderIsClickSend'),
            'providerConfigPresent': checks.get('smsProviderConfigPresent'),
          }))
          PY

      - name: Send exactly one Black Boy SMS
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          OUT=$(npx --yes vercel@latest curl /api/qa-sms-black-boy --deployment "$PREVIEW_URL" -- --request POST)
          printf '%s\n' "$OUT" > /tmp/send.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/send.json'))
          assert d.get('sent') is True, d
          assert d.get('creditsBefore') == 0, d
          assert d.get('creditsAfter') == 1, d
          assert d.get('deliveryStatusAfter') == 'sent', d
          assert d.get('providerMessageIdPresent') is True, d
          print('SEND_PASS', json.dumps({k:d.get(k) for k in ['sent','reason','acceptedUnconfirmed','creditsBefore','creditsAfter','deliveryStatusAfter','providerMessageIdPresent']}))
          PY

      - name: Verify post-send state
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          OUT=$(npx --yes vercel@latest curl /api/qa-sms-black-boy --deployment "$PREVIEW_URL")
          printf '%s\n' "$OUT" > /tmp/after.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/after.json'))
          sms=d.get('sms',{})
          assert d.get('safeToSend') is False, d
          assert sms.get('creditsUsed') == 1, d
          assert sms.get('creditsLimit') == 20, d
          assert sms.get('deliveryStatus') == 'sent', d
          assert sms.get('providerMessageIdPresent') is True, d
          print('AFTER_PASS', json.dumps({'creditsUsed':sms.get('creditsUsed'),'creditsLimit':sms.get('creditsLimit'),'deliveryStatus':sms.get('deliveryStatus'),'providerMessageIdPresent':sms.get('providerMessageIdPresent')}))
          PY

      - name: Same idempotency POST must be duplicate-blocked
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          OUT=$(npx --yes vercel@latest curl /api/qa-sms-black-boy --deployment "$PREVIEW_URL" -- --request POST)
          printf '%s\n' "$OUT" > /tmp/duplicate.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/duplicate.json'))
          assert d.get('sent') is False, d
          assert d.get('reason') == 'DUPLICATE', d
          assert d.get('duplicateProtected') is True, d
          assert d.get('creditsBefore') == 1 and d.get('creditsAfter') == 1, d
          assert d.get('deliveryStatusAfter') == 'sent', d
          assert d.get('providerMessageIdPresent') is True, d
          print('DUPLICATE_PASS', json.dumps({k:d.get(k) for k in ['sent','reason','creditsBefore','creditsAfter','deliveryStatusAfter','providerMessageIdPresent','duplicateProtected']}))
          PY
