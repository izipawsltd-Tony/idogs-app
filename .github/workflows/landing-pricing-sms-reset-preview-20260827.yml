name: Update SMS pricing copy Preview

on:
  push:
    branches:
      - feature/landing-pricing-20260827
    paths:
      - .github/workflows/landing-pricing-sms-reset-preview-20260827.yml

permissions:
  contents: write

jobs:
  update-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/landing-pricing-20260827
          fetch-depth: 0

      - name: Fail closed on exact product baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE='21d2275243ff846337036e5fbf7ece393f43f1b1'
          WF='.github/workflows/landing-pricing-sms-reset-preview-20260827.yml'
          test "$(git rev-parse HEAD^)" = "$BASE"
          mapfile -t changed < <(git diff --name-only "$BASE"..HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$WF"

      - name: Update SMS credit copy
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/pages/LandingPage.tsx')
          s = p.read_text()
          old = '<div className="sms-credit"><strong>20 SMS credits</strong><span>included each month</span></div>'
          new = '<div className="sms-credit"><strong>20 SMS credits / month</strong><span>Resets each billing month.</span></div>'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly 1 SMS pricing copy match, got {count}')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/landing-pricing-sms-reset-preview-20260827.yml
          grep -q '20 SMS credits / month' src/pages/LandingPage.tsx
          grep -q 'Resets each billing month.' src/pages/LandingPage.tsx

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit exact product change
        id: product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'izipawsltd-Tony'
          git config user.email 'izipawsltd@gmail.com'
          git add -A
          git commit -m 'copy(landing): clarify monthly SMS credit reset'
          PRODUCT_SHA="$(git rev-parse HEAD)"
          echo "sha=$PRODUCT_SHA" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain)"
          git push origin HEAD:feature/landing-pricing-20260827
          echo "Exact product SHA: $PRODUCT_SHA"

      - name: Link exact staging project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"projectId":"prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o","orgId":"team_oZF1Z0BUEceb9fAXdmFV1Saz","projectName":"idogs-app-staging"}
          JSON

      - name: Deploy Preview only
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          EXPECTED='${{ steps.product.outputs.sha }}'
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain --untracked-files=no)"
          npx --yes vercel@latest deploy --yes --archive=tgz --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects | tee /tmp/vercel-preview.log
          echo 'Preview only: no --prod and no stable alias promotion.'
