name: Production Billing SMS Live Deploy 20260903

on:
  push:
    branches:
      - automation/production-billing-sms-live-20260903

permissions:
  contents: read

env:
  CURRENT_PROD_SHA: 28cf50ec05ee683f60c088d404a6def1cfdf2216
  STABLE_SHA: 5b5f43205f4d0fd2f082270bea3b4eb062c4485c
  CANDIDATE_SHA: 70c696b768f08942d9885abdfea90ee9aaad5fea
  CANDIDATE_TREE: 87aee038e1b9109ec381ffb91dd3136fb3f0ae6c
  PROD_PROJECT_ID: prj_UsnGhC1BWtYnmF5rKMYBR9KWkbIo
  PROD_TEAM_ID: team_oZF1Z0BUEceb9fAXdmFV1Saz
  VERCEL_SCOPE: izipawsltd-tonys-projects

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact approved release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Re-verify exact release lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git rev-parse HEAD^1)" = "$CURRENT_PROD_SHA"
          test "$(git rev-parse HEAD^2)" = "$STABLE_SHA"
          git diff --quiet "$STABLE_SHA" "$CANDIDATE_SHA"
          test ! -e api/qa-billing-account.js
          test ! -e api/qa-repair-petowner-billing.js
          test -z "$(git status --porcelain)"
          echo LIVE_RELEASE_LINEAGE=PASS
          echo LIVE_SOURCE_TREE_IDENTICAL_TO_MANUAL_QA=PASS

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Final release regression and build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/test-billing-p0-security.mjs
          node scripts/test-billing-payments-phase1.mjs
          node scripts/test-stripe-mode-routing.mjs
          node scripts/test-litter-pricing-policy.mjs
          node scripts/test-litter-quota.mjs
          node scripts/test-extra-litter-checkout.mjs
          node scripts/test-extra-litter-webhook.mjs
          node scripts/test-pricing-integration-checks.mjs
          node scripts/test-sms-provider.mjs
          node scripts/test-reminders-batch-regression.mjs
          node scripts/test-cron-auth.mjs
          node scripts/test-webhook-handler.mjs
          npm run build
          echo FINAL_PRODUCTION_REGRESSION_AND_BUILD=PASS

      - name: Hard-lock production Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '%s\n' '{"projectId":"prj_UsnGhC1BWtYnmF5rKMYBR9KWkbIo","orgId":"team_oZF1Z0BUEceb9fAXdmFV1Saz","projectName":"idogs-app"}' > .vercel/project.json
          node -e "const d=require('./.vercel/project.json'); if(d.projectId!==process.env.PROD_PROJECT_ID||d.orgId!==process.env.PROD_TEAM_ID||d.projectName!=='idogs-app') process.exit(1)"
          echo LIVE_PROJECT_LOCK=PASS

      - name: Fail-closed production environment gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" >/tmp/vercel-pull-prod.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          vals={}
          for p in Path('.vercel').glob('.env.*.local'):
              for raw in p.read_text(errors='replace').splitlines():
                  line=raw.strip()
                  if not line or line.startswith('#') or '=' not in line: continue
                  k,v=line.split('=',1)
                  v=v.strip()
                  if len(v)>=2 and v[0]==v[-1] and v[0] in ('"', "'"): v=v[1:-1]
                  vals[k.strip()]=v.replace('\\n','').replace('\\r','').strip()
          if vals.get('FIREBASE_PROJECT_ID') == 'idogs-app-staging':
              raise SystemExit('PROD_FIREBASE_POINTS_TO_STAGING')
          if not vals.get('FIREBASE_PROJECT_ID'):
              raise SystemExit('PROD_FIREBASE_MISSING')
          if not vals.get('STRIPE_SECRET_KEY','').startswith('sk_live_'):
              raise SystemExit('PROD_STRIPE_NOT_LIVE')
          if vals.get('APP_URL') != 'https://idogs.com.au':
              raise SystemExit('PROD_APP_URL_MISMATCH')
          if vals.get('EXTRA_LITTER_CHECKOUT_ENABLED','').lower() == 'true':
              raise SystemExit('PROD_EXTRA_LITTER_REAL_CHECKOUT_MUST_STAY_OFF')
          sms_price=vals.get('STRIPE_SMS_ADDON_PRICE_ID','')
          if not sms_price.startswith('price_'):
              raise SystemExit('PROD_SMS_PRICE_NOT_CONFIGURED')
          print('PRODUCTION_ENV_CLASSIFICATION=PASS')
          print('PRODUCTION_STRIPE_MODE=LIVE')
          print('PRODUCTION_APP_URL=IDOGS_COM_AU')
          print('PRODUCTION_SMS_PRICE_CONFIGURED=PASS')
          print('PRODUCTION_EXTRA_LITTER_REAL_CHECKOUT=OFF')
          PY
          rm -f .vercel/.env.*.local

      - name: Deploy exact approved release to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"
          npx --yes vercel@latest deploy --prod --archive=tgz --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" --no-color > /tmp/vercel-prod.stdout 2> /tmp/vercel-prod.stderr
          PROD_URL=$(cat /tmp/vercel-prod.stdout /tmp/vercel-prod.stderr | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | grep -E '/?idogs-' | tail -1 || true)
          if [ -z "$PROD_URL" ]; then
            PROD_URL=$(cat /tmp/vercel-prod.stdout /tmp/vercel-prod.stderr | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -1 || true)
          fi
          test -n "$PROD_URL"
          case "$PROD_URL" in
            *idogs-app-staging*) echo WRONG_PROJECT_PRODUCTION; exit 1 ;;
          esac
          echo "PROD_URL=$PROD_URL" >> "$GITHUB_ENV"
          echo "PRODUCTION_DEPLOYMENT_URL=$PROD_URL"
          echo EXACT_PRODUCTION_DEPLOY=PASS

      - name: Safe production smoke probes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --location --output /tmp/root.html --write-out '%{http_code}' https://idogs.com.au/)
          echo "LIVE_ROOT_HTTP=$code"
          test "$code" = "200"

          code=$(curl --silent --show-error --output /tmp/billing.json --write-out '%{http_code}' https://idogs.com.au/api/billing-summary)
          echo "LIVE_BILLING_UNAUTH_HTTP=$code"
          test "$code" = "401"
          node -e "const b=require('/tmp/billing.json'); if(b.error!=='Missing Authorization header') process.exit(1)"

          code=$(curl --silent --show-error --request POST --header 'Content-Type: application/json' --data '{"plan":"plus_monthly"}' --output /tmp/checkout.json --write-out '%{http_code}' https://idogs.com.au/api/create-checkout)
          echo "LIVE_CHECKOUT_UNAUTH_HTTP=$code"
          test "$code" = "401"

          code=$(curl --silent --show-error --output /tmp/litter.json --write-out '%{http_code}' https://idogs.com.au/api/litter-quota-summary)
          echo "LIVE_LITTER_QUOTA_UNAUTH_HTTP=$code"
          test "$code" = "401"

          echo LIVE_SAFE_SMOKE=PASS
          echo STRIPE_SESSION_NOT_CREATED=PASS
          echo FIRESTORE_MUTATION_NOT_PERFORMED=PASS

      - name: Terminal production assertion
        shell: bash
        run: |
          set -euo pipefail
          echo PRODUCTION_DEPLOY=PERFORMED_APPROVED
          echo EXTRA_LITTER_REAL_CHECKOUT=OFF
          echo PRODUCTION_RELEASE_AUTOMATION=PASS
