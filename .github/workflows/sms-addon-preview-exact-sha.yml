name: SMS Add-on exact-SHA staging Preview

on:
  workflow_dispatch:
  push:
    branches:
      - ops/sms-addon-preview-517b80a9

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_oZF1Z0BUEceb9fAXdmFV1Saz
      VERCEL_PROJECT_ID: prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o
      VERCEL_SCOPE: izipawsltd-tonys-projects
      EXACT_SHA: 517b80a9c4f1b23bdc71580b892c3e332950f702
    steps:
      - name: Checkout exact approved feature SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact SHA and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          test -z "$(git status --porcelain)"
          echo "EXACT_SHA=$EXACT_SHA"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: SMS Add-on V1 tests
        run: node scripts/test-sms-addon-v1.mjs

      - name: Build
        run: npm run build

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@54.13.0

      - name: Link CLI explicitly to staging project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel
          vercel link \
            --yes \
            --project idogs-app-staging \
            --scope "$VERCEL_SCOPE" \
            --token="${{ secrets.VERCEL_TOKEN }}"
          cat .vercel/project.json

      - name: Re-verify project binding
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const p = JSON.parse(fs.readFileSync('.vercel/project.json','utf8'))
          if (p.projectId !== process.env.VERCEL_PROJECT_ID) throw new Error('STOP wrong Vercel projectId')
          if (p.orgId !== process.env.VERCEL_ORG_ID) throw new Error('STOP wrong Vercel orgId')
          if (p.projectName !== 'idogs-app-staging') throw new Error('STOP wrong Vercel projectName')
          console.log('PASS project binding', p.projectName, p.projectId)
          NODE

      - name: Deploy Preview only
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url=$(vercel deploy \
            --yes \
            --archive=tgz \
            --scope "$VERCEL_SCOPE" \
            --meta "approvedExactSha=$EXACT_SHA" \
            --meta "sourceBranch=feature/sms-addon-v1" \
            --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "PREVIEW_URL=$url"

      - name: Inspect deployed metadata
        shell: bash
        run: |
          set -euo pipefail
          vercel inspect \
            "${{ steps.deploy.outputs.url }}" \
            --scope "$VERCEL_SCOPE" \
            --token="${{ secrets.VERCEL_TOKEN }}"
          echo "EXPECTED_SHA=$EXACT_SHA"
