name: SMS Add-on exact-SHA staging Preview

on:
  workflow_dispatch:
  push:
    branches:
      - ops/sms-addon-preview-517b80a9

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_oZF1Z0BUEceb9fAXdmFV1Saz
      VERCEL_PROJECT_ID: prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o
      EXACT_SHA: b276a5f02c33cbcd64c5f7a28bdc7fb76328b519
      GITHUB_REPO_ID: '1270695712'
    steps:
      - name: Checkout exact approved feature SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact SHA and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          test -z "$(git status --porcelain)"
          echo "EXACT_SHA=$EXACT_SHA"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: SMS Add-on V1 tests
        run: node scripts/test-sms-addon-v1.mjs

      - name: Build
        run: npm run build

      - name: Create exact-SHA staging Preview via Vercel REST API
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          node - <<'NODE' > /tmp/deploy-body.json
          const body = {
            name: 'idogs-app-staging',
            gitSource: {
              type: 'github',
              ref: 'feature/sms-addon-v1',
              repoId: Number(process.env.GITHUB_REPO_ID),
              sha: process.env.EXACT_SHA,
            },
            gitMetadata: {
              remoteUrl: 'https://github.com/izipawsltd-Tony/idogs-app.git',
              commitRef: 'feature/sms-addon-v1',
              commitSha: process.env.EXACT_SHA,
              dirty: false,
              ci: true,
              ciType: 'github-actions',
              ciGitProviderUsername: 'izipawsltd-Tony',
              ciGitRepoVisibility: 'public',
              rootDirectory: '',
            },
            meta: {
              approvedExactSha: process.env.EXACT_SHA,
              sourceBranch: 'feature/sms-addon-v1',
              validationWorkflow: 'sms-addon-preview-exact-sha',
            },
          }
          process.stdout.write(JSON.stringify(body))
          NODE

          http=$(curl --silent --show-error \
            --output /tmp/deploy-response.json \
            --write-out '%{http_code}' \
            --request POST \
            "https://api.vercel.com/v13/deployments?teamId=${VERCEL_ORG_ID}" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/deploy-body.json)

          echo "CREATE_HTTP=$http"
          if [ "$http" -lt 200 ] || [ "$http" -ge 300 ]; then
            code=$(jq -r '.error.code // "UNKNOWN"' /tmp/deploy-response.json)
            message=$(jq -r '.error.message // "No message"' /tmp/deploy-response.json)
            echo "Vercel create deployment failed: $code $message" >&2
            exit 1
          fi

          deployment_id=$(jq -r '.id // empty' /tmp/deploy-response.json)
          deployment_url=$(jq -r '.url // empty' /tmp/deploy-response.json)
          test -n "$deployment_id"
          test -n "$deployment_url"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "url=https://$deployment_url" >> "$GITHUB_OUTPUT"
          echo "DEPLOYMENT_ID=$deployment_id"
          echo "PREVIEW_URL=https://$deployment_url"

      - name: Verify Preview deployment metadata and wait for READY
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            http=$(curl --silent --show-error \
              --output /tmp/deployment.json \
              --write-out '%{http_code}' \
              "https://api.vercel.com/v13/deployments/${DEPLOYMENT_ID}?teamId=${VERCEL_ORG_ID}" \
              --header "Authorization: Bearer ${VERCEL_TOKEN}")
            test "$http" = "200"

            project_id=$(jq -r '.projectId // .project.id // empty' /tmp/deployment.json)
            target=$(jq -r 'if .target == null then "preview/null" else .target end' /tmp/deployment.json)
            sha=$(jq -r '.meta.githubCommitSha // .meta.approvedExactSha // .gitSource.sha // .gitMetadata.commitSha // empty' /tmp/deployment.json)
            ref=$(jq -r '.meta.githubCommitRef // .meta.sourceBranch // .gitSource.ref // .gitMetadata.commitRef // empty' /tmp/deployment.json)
            state=$(jq -r '.readyState // .status // empty' /tmp/deployment.json)

            if [ -n "$project_id" ] && [ "$project_id" != "$VERCEL_PROJECT_ID" ]; then echo "STOP wrong project $project_id"; exit 1; fi
            if [ -n "$sha" ] && [ "$sha" != "$EXACT_SHA" ]; then echo "STOP wrong SHA $sha"; exit 1; fi
            if [ -n "$ref" ] && [ "$ref" != "feature/sms-addon-v1" ]; then echo "STOP wrong ref $ref"; exit 1; fi
            if [ "$target" = "production" ]; then echo "STOP deployment targeted production"; exit 1; fi

            echo "VERIFY project=${project_id:-name-bound} target=$target sha=${sha:-$EXACT_SHA} ref=${ref:-feature/sms-addon-v1} state=$state"
            case "$state" in
              READY)
                echo "PASS READY exact-SHA staging Preview"
                echo "PREVIEW_URL=${{ steps.deploy.outputs.url }}"
                exit 0
                ;;
              ERROR|CANCELED|BLOCKED)
                echo "STOP deployment state=$state"
                exit 1
                ;;
            esac
            sleep 5
          done
          echo 'STOP deployment did not reach READY in time'
          exit 1
