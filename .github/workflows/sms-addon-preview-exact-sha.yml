name: SMS Add-on exact-SHA staging Preview

on:
  workflow_dispatch:
  push:
    branches:
      - ops/sms-addon-preview-517b80a9

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_oZF1Z0BUEceb9fAXdmFV1Saz
      VERCEL_PROJECT_ID: prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o
      EXACT_SHA: 517b80a9c4f1b23bdc71580b892c3e332950f702
      GITHUB_REPO_ID: '1270695712'
    steps:
      - name: Checkout exact approved feature SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact SHA and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          test -z "$(git status --porcelain)"
          echo "EXACT_SHA=$EXACT_SHA"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: SMS Add-on V1 tests
        run: node scripts/test-sms-addon-v1.mjs

      - name: Build
        run: npm run build

      - name: Create exact-SHA staging Preview via Vercel REST API
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          node - <<'NODE' > /tmp/deploy-body.json
          const body = {
            name: 'idogs-app-staging',
            gitSource: {
              type: 'github',
              ref: 'feature/sms-addon-v1',
              repoId: Number(process.env.GITHUB_REPO_ID),
              sha: process.env.EXACT_SHA,
            },
            gitMetadata: {
              remoteUrl: 'https://github.com/izipawsltd-Tony/idogs-app.git',
              commitRef: 'feature/sms-addon-v1',
              commitSha: process.env.EXACT_SHA,
              dirty: false,
              ci: true,
              ciType: 'github-actions',
              ciGitProviderUsername: 'izipawsltd-Tony',
              ciGitRepoVisibility: 'public',
              rootDirectory: '',
            },
            meta: {
              approvedExactSha: process.env.EXACT_SHA,
              sourceBranch: 'feature/sms-addon-v1',
              validationWorkflow: 'sms-addon-preview-exact-sha',
            },
          }
          process.stdout.write(JSON.stringify(body))
          NODE

          http=$(curl --silent --show-error \
            --output /tmp/deploy-response.json \
            --write-out '%{http_code}' \
            --request POST \
            "https://api.vercel.com/v13/deployments?teamId=${VERCEL_ORG_ID}" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/deploy-body.json)

          echo "CREATE_HTTP=$http"
          if [ "$http" -lt 200 ] || [ "$http" -ge 300 ]; then
            node - <<'NODE'
            const fs=require('fs')
            const x=JSON.parse(fs.readFileSync('/tmp/deploy-response.json','utf8'))
            console.error('Vercel create deployment failed:', x?.error?.code || 'UNKNOWN', x?.error?.message || 'No message')
            NODE
            exit 1
          fi

          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('fs')
          const x=JSON.parse(fs.readFileSync('/tmp/deploy-response.json','utf8'))
          if (!x.id || !x.url) throw new Error('STOP deployment response missing id/url')
          console.log(`deployment_id=${x.id}`)
          console.log(`url=https://${x.url}`)
          NODE

      - name: Verify Preview deployment metadata and wait for READY
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            http=$(curl --silent --show-error \
              --output /tmp/deployment.json \
              --write-out '%{http_code}' \
              "https://api.vercel.com/v13/deployments/${DEPLOYMENT_ID}?teamId=${VERCEL_ORG_ID}" \
              --header "Authorization: Bearer ${VERCEL_TOKEN}")
            if [ "$http" != "200" ]; then
              echo "STOP deployment inspect HTTP=$http"
              exit 1
            fi

            state=$(node - <<'NODE'
            const fs=require('fs')
            const x=JSON.parse(fs.readFileSync('/tmp/deployment.json','utf8'))
            const sha=x?.meta?.githubCommitSha || x?.meta?.approvedExactSha || x?.gitSource?.sha || x?.gitMetadata?.commitSha || ''
            const ref=x?.meta?.githubCommitRef || x?.meta?.sourceBranch || x?.gitSource?.ref || x?.gitMetadata?.commitRef || ''
            const projectId=x?.projectId || x?.project?.id || ''
            const target=x?.target ?? null
            if (projectId && projectId !== process.env.VERCEL_PROJECT_ID) throw new Error(`STOP wrong project ${projectId}`)
            if (sha && sha !== process.env.EXACT_SHA) throw new Error(`STOP wrong SHA ${sha}`)
            if (ref && ref !== 'feature/sms-addon-v1') throw new Error(`STOP wrong ref ${ref}`)
            if (target === 'production') throw new Error('STOP deployment targeted production')
            console.error(`VERIFY project=${projectId || 'name-bound'} target=${target ?? 'preview/null'} sha=${sha || process.env.EXACT_SHA} ref=${ref || 'feature/sms-addon-v1'} state=${x.readyState || x.status}`)
            process.stdout.write(x.readyState || x.status || '')
            NODE
            )

            case "$state" in
              READY)
                echo "PASS READY exact-SHA staging Preview"
                echo "PREVIEW_URL=${{ steps.deploy.outputs.url }}"
                exit 0
                ;;
              ERROR|CANCELED|BLOCKED)
                echo "STOP deployment state=$state"
                exit 1
                ;;
            esac
            sleep 5
          done
          echo 'STOP deployment did not reach READY in time'
          exit 1
