name: Meta Purchase Cleanup + Production Prep 20260903

on:
  push:
    branches:
      - automation/meta-purchase-cleanup-prod-prep-20260903
    paths:
      - .github/workflows/meta-purchase-cleanup-prod-prep-20260903.yml

permissions:
  contents: read

env:
  PURCHASE_QA_BASE_SHA: b34eae1a5561b82d9de6a18a14d6df926e1114ee
  CANDIDATE_SHA: 5f8dde2113c74811d2fdd1a2e51c535e662f7a5a
  PIXEL_ID: "1648101183992434"
  OLD_PIXEL_ID: "2647777915638218"
  STAGING_PROJECT_ID: prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o
  PROD_PROJECT_ID: prj_UsnGhC1BWtYnmF5rKMYBR9KWkbIo
  TEAM_ID: team_oZF1Z0BUEceb9fAXdmFV1Saz
  VERCEL_SCOPE: izipawsltd-tonys-projects

jobs:
  cleanup-and-prep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact clean candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Exact tree and no-QA-code gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          test -z "$(git diff --name-only "$PURCHASE_QA_BASE_SHA"..HEAD)"
          grep -q "META_DATASET_ID = '$PIXEL_ID'" api/_lib/meta-capi.js
          ! grep -R -q "$OLD_PIXEL_ID" api index.html src
          ! grep -R -q 'stagingQaReplayConfig\|sendStagingQaReplay\|META_CAPI_QA_REPLAY_STRIPE_EVENT_ID\|TEST21451' api src index.html
          grep -q "billing_reason === 'subscription_create'" api/_lib/meta-capi.js
          grep -q "Number(invoice.amount_paid) <= 0" api/_lib/meta-capi.js
          grep -q "verifiedEvent.type === 'invoice.payment_succeeded'" api/stripe-webhook.js
          ! grep -R -q "fbq('track', 'Purchase'" src
          echo META_PURCHASE_CLEAN_SOURCE=PASS

      - name: Regression and build gate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/test-billing-p0-security.mjs
          npm run build
          echo META_PURCHASE_CLEAN_REGRESSION_BUILD=PASS

      - name: Hard-lock staging project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '%s\n' '{"projectId":"prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o","orgId":"team_oZF1Z0BUEceb9fAXdmFV1Saz","projectName":"idogs-app-staging"}' > .vercel/project.json
          node -e "const d=require('./.vercel/project.json'); if(d.projectId!==process.env.STAGING_PROJECT_ID||d.orgId!==process.env.TEAM_ID||d.projectName!=='idogs-app-staging') process.exit(1)"
          echo STAGING_PROJECT_LOCK=PASS

      - name: Verify staging project has no persistent QA env
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest env ls production --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" --no-color > /tmp/staging-env.txt 2>&1
          ! grep -q 'META_CAPI_TEST_EVENT_CODE' /tmp/staging-env.txt
          ! grep -q 'META_CAPI_QA_REPLAY_STRIPE_EVENT_ID' /tmp/staging-env.txt
          echo STAGING_PERSISTENT_QA_ENV=ABSENT

      - name: Redeploy clean candidate to stable staging
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          npx --yes vercel@latest deploy --prod --yes --archive=tgz --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" --no-color > /tmp/vercel-clean.stdout 2> /tmp/vercel-clean.stderr
          CLEAN_URL=$(cat /tmp/vercel-clean.stdout /tmp/vercel-clean.stderr | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -1 || true)
          test -n "$CLEAN_URL"
          echo "CLEAN_STAGING_URL=$CLEAN_URL" >> "$GITHUB_ENV"
          echo "META_PURCHASE_CLEAN_STAGING_URL=$CLEAN_URL"
          echo META_PURCHASE_TEST_EVENT_CODE_INJECTED=NO
          echo META_PURCHASE_QA_REPLAY_ENV_INJECTED=NO
          echo META_PURCHASE_CLEAN_STAGING_DEPLOY=PASS

      - name: Production source safety preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          grep -q "plus_monthly: 'price_1UAInbGHgBd6ZgJE0NAikQgm'" api/_lib/checkout-handler.js
          grep -q "plus_annual: 'price_1UAIngGHgBd6ZgJEh3njs6hZ'" api/_lib/checkout-handler.js
          grep -q "event_source_url: previewSource || 'https://idogs.com.au/'" api/_lib/meta-capi.js
          grep -q "META_DATASET_ID = '$PIXEL_ID'" api/_lib/meta-capi.js
          ! grep -R -q 'META_CAPI_QA_REPLAY_STRIPE_EVENT_ID\|TEST21451' api src index.html
          echo PROD_SOURCE_PREFLIGHT=PASS

      - name: Read-only production Meta env preflight
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"projectId":"prj_UsnGhC1BWtYnmF5rKMYBR9KWkbIo","orgId":"team_oZF1Z0BUEceb9fAXdmFV1Saz","projectName":"idogs-app"}' > .vercel/project.json
          node -e "const d=require('./.vercel/project.json'); if(d.projectId!==process.env.PROD_PROJECT_ID||d.orgId!==process.env.TEAM_ID||d.projectName!=='idogs-app') process.exit(1)"
          npx --yes vercel@latest env ls production --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" --no-color > /tmp/prod-env.txt 2>&1
          if grep -q 'META_CAPI_ACCESS_TOKEN' /tmp/prod-env.txt; then
            echo PROD_META_CAPI_ACCESS_TOKEN=READY
            echo "PROD_META_TOKEN_READY=true" >> "$GITHUB_ENV"
          else
            echo PROD_META_CAPI_ACCESS_TOKEN=MISSING
            echo "PROD_META_TOKEN_READY=false" >> "$GITHUB_ENV"
          fi
          if grep -q 'META_CAPI_TEST_EVENT_CODE' /tmp/prod-env.txt; then
            echo PROD_META_CAPI_TEST_EVENT_CODE=UNSAFE_PRESENT
            echo "PROD_TEST_CODE_CLEAN=false" >> "$GITHUB_ENV"
          else
            echo PROD_META_CAPI_TEST_EVENT_CODE=ABSENT
            echo "PROD_TEST_CODE_CLEAN=true" >> "$GITHUB_ENV"
          fi
          if grep -q 'META_CAPI_QA_REPLAY_STRIPE_EVENT_ID' /tmp/prod-env.txt; then
            echo PROD_META_CAPI_QA_REPLAY_ENV=UNSAFE_PRESENT
            echo "PROD_QA_REPLAY_CLEAN=false" >> "$GITHUB_ENV"
          else
            echo PROD_META_CAPI_QA_REPLAY_ENV=ABSENT
            echo "PROD_QA_REPLAY_CLEAN=true" >> "$GITHUB_ENV"
          fi
          if grep -q 'META_DATASET_ID' /tmp/prod-env.txt; then
            echo PROD_META_DATASET_ID_OVERRIDE=PRESENT_REVIEW_REQUIRED
            echo "PROD_DATASET_OVERRIDE_CLEAN=false" >> "$GITHUB_ENV"
          else
            echo PROD_META_DATASET_ID_OVERRIDE=ABSENT_USING_CODE_CONSTANT
            echo "PROD_DATASET_OVERRIDE_CLEAN=true" >> "$GITHUB_ENV"
          fi

      - name: Production readiness summary - no deploy
        shell: bash
        run: |
          set -euo pipefail
          echo PRODUCTION_IDOGS_DEPLOY=NOT_PERFORMED
          echo PRODUCTION_PROJECT_ENV_MUTATION=NOT_PERFORMED
          echo STABLE_STAGING_CLEANUP=PERFORMED_APPROVED
          if [ "${PROD_META_TOKEN_READY:-false}" = true ] && [ "${PROD_TEST_CODE_CLEAN:-false}" = true ] && [ "${PROD_QA_REPLAY_CLEAN:-false}" = true ] && [ "${PROD_DATASET_OVERRIDE_CLEAN:-false}" = true ]; then
            echo META_PURCHASE_PRODUCTION_READINESS=READY_FOR_EXPLICIT_APPROVAL
          else
            echo META_PURCHASE_PRODUCTION_READINESS=HOLD_ENV_REVIEW_REQUIRED
          fi
