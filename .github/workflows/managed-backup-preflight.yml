name: Approved managed backup QA preflight (read only)
on:
  push:
    branches: [release/ios-app-store-20261025]
    paths: ['scripts/qa/managed-backup-preflight.mjs', 'scripts/test-managed-backup-preflight.mjs', '.github/workflows/managed-backup-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: idogs-managed-backup-qa
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/test-managed-backup-preflight.mjs
      - name: Verify existing permissions and billing without creating resources
        env:
          IDOGS_MANAGED_BACKUP_APPROVAL: 2026-10-28-two-databases-one-backup
          IDOGS_STAGING_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.IDOGS_STAGING_FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/qa/managed-backup-preflight.mjs
