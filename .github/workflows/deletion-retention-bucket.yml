name: Provision approved seven-day retention QA bucket
on:
  push:
    branches: [release/ios-app-store-20261025]
    paths: ['scripts/qa/provision-retention-bucket.mjs', 'scripts/test-provision-retention-bucket.mjs', '.github/workflows/deletion-retention-bucket.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: idogs-approved-deletion-qa-provisioning
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/test-provision-retention-bucket.mjs
      - name: Create only the owner-approved private seven-day QA bucket
        env:
          IDOGS_RETENTION_QA_APPROVAL: 2026-10-26-new-seven-day-qa-bucket
          IDOGS_STAGING_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.IDOGS_STAGING_FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/qa/provision-retention-bucket.mjs
