name: SMS Preview Gate A diagnostic 20260830

on:
  push:
    branches:
      - fix/sms-single-user-qa-pref-separation-20260830

permissions:
  contents: read

jobs:
  gate-a:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fail closed on exact clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = 'fix/sms-single-user-qa-pref-separation-20260830'
          test -z "$(git status --porcelain)"
          node --check api/qa-sms-single-user.js
          node --check api/qa-sms-black-boy.js
          grep -Fq "idogsbreeder@gmail.com" api/qa-sms-single-user.js
          grep -Fq "MN9UKyfFqDQk9fbV1tqdvbiCr5C3" api/qa-sms-black-boy.js
          grep -Fq "CiafPl5XQQQ8gq1fNhd4" api/qa-sms-black-boy.js
          grep -Fq "2026-08-31" api/qa-sms-black-boy.js

      - name: Gate A and guarded one-SMS Black Boy QA
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREVIEW_URL: https://idogs-8wf3gk1kx-izipawsltd-tonys-projects.vercel.app
        run: |
          set -euo pipefail

          vcurl() {
            npx --yes vercel@latest --yes --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects curl "$@"
          }

          vcurl "$PREVIEW_URL/api/qa-sms-single-user" > /tmp/gate-a.json
          node - <<'NODE'
          const fs = require('fs')
          const d = JSON.parse(fs.readFileSync('/tmp/gate-a.json', 'utf8'))
          const summary = {safeToProceed:d.safeToProceed,serverProjectId:d.firebase?.serverProjectId,uid:d.qa?.uid,blackBoyId:d.qa?.blackBoy?.id,blackBoyTenantId:d.qa?.blackBoy?.tenantId,blackBoyCurrentOwnerId:d.qa?.blackBoy?.currentOwnerId,wormingRecordId:d.qa?.activeWorming?.id,wormingDue:d.qa?.activeWorming?.nextDue,smsAddonStatus:d.qa?.smsEntitlement?.status,creditsUsed:d.qa?.smsEntitlement?.creditsUsed,creditsIncluded:d.qa?.smsEntitlement?.creditsIncluded,checks:d.checks}
          console.log('GATE_A_RESULT=' + JSON.stringify(summary))
          if (!d.safeToProceed) process.exit(1)
          NODE

          vcurl "$PREVIEW_URL/api/qa-sms-black-boy" > /tmp/gate-b-before.json
          node - <<'NODE'
          const fs = require('fs')
          const d = JSON.parse(fs.readFileSync('/tmp/gate-b-before.json', 'utf8'))
          console.log('GATE_B_BEFORE=' + JSON.stringify({safeToSend:d.safeToSend,target:d.target,sms:d.sms,checks:d.checks}))
          if (!d.safeToSend) process.exit(1)
          if (d.sms?.creditsUsed !== 0 || d.sms?.creditsLimit !== 20 || d.sms?.deliveryStatus !== null) process.exit(1)
          NODE

          vcurl "$PREVIEW_URL/api/qa-sms-black-boy" -- --request POST > /tmp/send-one.json
          node - <<'NODE'
          const fs = require('fs')
          const d = JSON.parse(fs.readFileSync('/tmp/send-one.json', 'utf8'))
          console.log('SEND_ONE_RESULT=' + JSON.stringify(d))
          if (d.sent !== true) process.exit(1)
          if (d.creditsBefore !== 0 || d.creditsAfter !== 1) process.exit(1)
          if (d.deliveryStatusAfter !== 'sent' && d.acceptedUnconfirmed !== true) process.exit(1)
          NODE

          vcurl "$PREVIEW_URL/api/qa-sms-black-boy" > /tmp/gate-b-after.json
          node - <<'NODE'
          const fs = require('fs')
          const d = JSON.parse(fs.readFileSync('/tmp/gate-b-after.json', 'utf8'))
          console.log('GATE_B_AFTER=' + JSON.stringify({safeToSend:d.safeToSend,target:d.target,sms:d.sms,checks:d.checks}))
          if (d.sms?.creditsUsed !== 1) process.exit(1)
          if (!['sent','reserved'].includes(d.sms?.deliveryStatus)) process.exit(1)
          NODE

          vcurl "$PREVIEW_URL/api/qa-sms-black-boy" -- --request POST > /tmp/send-duplicate.json
          node - <<'NODE'
          const fs = require('fs')
          const d = JSON.parse(fs.readFileSync('/tmp/send-duplicate.json', 'utf8'))
          console.log('DUPLICATE_RESULT=' + JSON.stringify(d))
          if (d.sent !== false || d.reason !== 'DUPLICATE' || d.duplicateProtected !== true) process.exit(1)
          if (d.creditsBefore !== 1 || d.creditsAfter !== 1) process.exit(1)
          NODE
