name: SMS Preview Gate A diagnostic 20260830

on:
  push:
    branches:
      - fix/sms-single-user-qa-pref-separation-20260830

permissions:
  contents: read

jobs:
  gate-a:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fail closed on exact clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = 'fix/sms-single-user-qa-pref-separation-20260830'
          test -z "$(git status --porcelain)"
          node --check api/qa-sms-single-user.js
          grep -Fq "Preview-only QA diagnostic" api/qa-sms-single-user.js
          grep -Fq "idogsbreeder@gmail.com" api/qa-sms-single-user.js
          grep -Fq "Black Boy" api/qa-sms-single-user.js
          grep -Fq "2026-08-31" api/qa-sms-single-user.js

      - name: Link production Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"projectId":"prj_UsnGhC1BWtYnmF5rKMYBR9KWkbIo","orgId":"team_oZF1Z0BUEceb9fAXdmFV1Saz","projectName":"idogs-app"}
          JSON

      - name: Gate A read-only Firebase UID ownership quota verification
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PREVIEW_URL: https://idogs-jt9ie3x3z-izipawsltd-tonys-projects.vercel.app
        run: |
          set -euo pipefail
          DIAG="$(npx --yes vercel@latest curl /api/qa-sms-single-user --deployment "$PREVIEW_URL" -- -sS -X POST -H "x-cron-secret: $CRON_SECRET")"
          printf '%s' "$DIAG" > /tmp/qa-diagnostic.json
          node - <<'NODE'
          const fs = require('fs')
          const d = JSON.parse(fs.readFileSync('/tmp/qa-diagnostic.json', 'utf8'))
          const summary = {
            safeToProceed: d.safeToProceed,
            serverProjectId: d.firebase?.serverProjectId,
            clientProjectId: d.firebase?.clientProjectId,
            uid: d.qa?.uid,
            ownedDogCount: d.qa?.ownedDogCount,
            blackBoyId: d.qa?.blackBoy?.id,
            blackBoyTenantId: d.qa?.blackBoy?.tenantId,
            blackBoyCurrentOwnerId: d.qa?.blackBoy?.currentOwnerId,
            wormingDue: d.qa?.activeWorming?.nextDue,
            lastReminderSentAt: d.qa?.activeWorming?.lastReminderSentAt,
            creditsUsed: d.qa?.smsEntitlement?.creditsUsed,
            creditsIncluded: d.qa?.smsEntitlement?.creditsIncluded,
            emailReminders: d.qa?.emailReminders,
            checks: d.checks,
          }
          console.log('GATE_A_RESULT=' + JSON.stringify(summary))
          if (!d.safeToProceed) process.exit(1)
          NODE
