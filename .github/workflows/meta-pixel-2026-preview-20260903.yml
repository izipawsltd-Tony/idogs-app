name: Deploy Meta Pixel 2026 staging Preview

on:
  push:
    branches:
      - automation/meta-pixel-2026-preview-20260903
    paths:
      - .github/workflows/meta-pixel-2026-preview-20260903.yml

permissions:
  contents: read

env:
  BASE_SHA: 70c696b768f08942d9885abdfea90ee9aaad5fea
  CANDIDATE_SHA: 5c8831e89ec2b8faff776260c4472b82d2a3b994
  PIXEL_ID: 1648101183992434
  STAGING_PROJECT_ID: prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o
  TEAM_ID: team_oZF1Z0BUEceb9fAXdmFV1Saz
  VERCEL_SCOPE: izipawsltd-tonys-projects

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Exact source and Pixel scope gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          test "$(git diff --name-only "$BASE_SHA"..HEAD)" = 'index.html'
          grep -q "fbq('init', '$PIXEL_ID');" index.html
          grep -q "fbq('track', 'PageView');" index.html
          grep -q 'https://connect.facebook.net/en_US/fbevents.js' index.html
          grep -q "tr?id=$PIXEL_ID&ev=PageView&noscript=1" index.html
          ! grep -q '2647777915638218' index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert s.count("fbq('init', '1648101183992434');") == 1
          assert s.count('1648101183992434') == 2
          assert s.index('<!-- Meta Pixel Code -->') < s.index('</head>')
          ns=s.index('<noscript><img')
          assert s.index('<body>') < ns < s.index('</body>')
          print('META_PIXEL_HTML_PLACEMENT=PASS')
          PY
          echo META_PIXEL_SCOPE=PASS

      - name: Install dependencies and build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          echo META_PIXEL_BUILD=PASS

      - name: Hard-lock staging Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '%s\n' '{"projectId":"prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o","orgId":"team_oZF1Z0BUEceb9fAXdmFV1Saz","projectName":"idogs-app-staging"}' > .vercel/project.json
          node -e "const d=require('./.vercel/project.json'); if(d.projectId!==process.env.STAGING_PROJECT_ID||d.orgId!==process.env.TEAM_ID||d.projectName!=='idogs-app-staging') process.exit(1)"
          echo STAGING_PROJECT_LOCK=PASS

      - name: Deploy exact candidate to Preview only
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          npx --yes vercel@latest deploy --yes --archive=tgz --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" --no-color > /tmp/vercel.stdout 2> /tmp/vercel.stderr
          PREVIEW_URL=$(cat /tmp/vercel.stdout /tmp/vercel.stderr | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -1 || true)
          test -n "$PREVIEW_URL"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "META_PIXEL_PREVIEW_URL=$PREVIEW_URL"
          echo META_PIXEL_PREVIEW_DEPLOY=PASS

      - name: Terminal safety assertion
        shell: bash
        run: |
          echo STABLE_STAGING_PROMOTION=NOT_PERFORMED
          echo PRODUCTION_DEPLOY=NOT_PERFORMED
          echo META_PIXEL_PAGEVIEW_AUTOMATION=PASS
