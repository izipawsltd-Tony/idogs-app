name: Preview E2E (staging) — secret-free notice

# Automatic Preview runs are SECRET-FREE. This workflow runs on every successful Vercel
# deployment_status event, which can be any branch push. It must never reference repository
# secrets. Authenticated staging E2E is not run here; it belongs to a separate, reviewer-gated
# job under the protected GitHub Environment `qa-staging-e2e` (master-only), and is not
# enabled on this branch.

on:
  deployment_status:

permissions:
  contents: read

jobs:
  notice:
    name: Preview E2E notice (no secrets)
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record secret-free preview event
        run: |
          echo "Preview deployment succeeded for ${{ github.event.deployment.sha }}."
          echo "Authenticated E2E is not run automatically. Use the reviewer-gated workflow."
