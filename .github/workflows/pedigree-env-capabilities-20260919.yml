name: Pedigree staging env capabilities
on:
  push:
    branches: [automation/pedigree-staging-e2e-20260919]
    paths: ['.github/workflows/pedigree-env-capabilities-20260919.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Classify main Preview env without exposing values
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf .vercel
          mkdir -p .vercel /tmp/pedigree-env-report
          printf '%s\n' '{"projectId":"prj_UsnGhC1BWtYnmF5rKMYBR9KWkbIo","orgId":"team_oZF1Z0BUEceb9fAXdmFV1Saz","projectName":"idogs-app"}' > .vercel/project.json
          npx --yes vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects >/tmp/preview-pull.log 2>&1
          F=.vercel/.env.preview.local
          test -f "$F"
          export ENV_FILE="$F"
          node <<'NODE' > /tmp/pedigree-env-report/classification.txt
          const fs = require('fs')
          const text = fs.readFileSync(process.env.ENV_FILE, 'utf8')
          function read(name) {
            const line = text.split(/\r?\n/).find(l => l.startsWith(name + '='))
            if (!line) return null
            let v = line.slice(name.length + 1).trim()
            if ((v.startsWith('"') && v.endsWith('"')) || (v.startsWith("'") && v.endsWith("'"))) v = v.slice(1, -1)
            return v.replace(/\\n/g, '\n')
          }
          function classifyProject(name) {
            const v = read(name)
            if (v == null) return 'ABSENT'
            if (v === 'idogs-app-staging') return 'STAGING'
            if (v === 'idogs-app') return 'PRODUCTION'
            return 'OTHER'
          }
          function present(name) { return read(name) == null ? 'ABSENT' : 'PRESENT' }
          function boolClass(name) {
            const v = read(name)
            if (v == null) return 'ABSENT'
            if (v === 'true') return 'TRUE'
            if (v === 'false') return 'FALSE'
            return 'OTHER'
          }
          console.log('FIREBASE_PROJECT_ID=' + classifyProject('FIREBASE_PROJECT_ID'))
          console.log('VITE_FIREBASE_PROJECT_ID=' + classifyProject('VITE_FIREBASE_PROJECT_ID'))
          console.log('FIREBASE_CLIENT_EMAIL=' + present('FIREBASE_CLIENT_EMAIL'))
          console.log('FIREBASE_PRIVATE_KEY=' + present('FIREBASE_PRIVATE_KEY'))
          console.log('EXTRA_LITTER_CHECKOUT_ENABLED=' + boolClass('EXTRA_LITTER_CHECKOUT_ENABLED'))
          console.log('STRIPE_SECRET_KEY=' + present('STRIPE_SECRET_KEY'))
          NODE
      - name: Upload classification only
        uses: actions/upload-artifact@v4
        with:
          name: pedigree-preview-env-classification
          path: /tmp/pedigree-env-report/classification.txt
          retention-days: 1
