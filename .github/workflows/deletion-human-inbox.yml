name: Owner-selected human inbox deletion QA
on:
  push:
    branches: [release/ios-app-store-20261025]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-cloud-deletion-qa
  cancel-in-progress: false
jobs:
  session:
    if: contains(github.event.head_commit.message, '[human-email-qa]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: node --test scripts/test-deletion-webhook-session.mjs scripts/test-deletion-qa-webhook.mjs scripts/test-deletion-cloud-runtime.mjs scripts/test-deletion-cloud-http.mjs scripts/test-deletion-email-sink.mjs scripts/test-deletion-qa-http.mjs scripts/test-deletion-human-confirmation.mjs
      - name: Require owner-selected recipient before external configuration
        env:
          QA_RECIPIENT: ${{ secrets.IDOGS_DELETION_QA_RECIPIENT_EMAIL }}
        run: test -n "$QA_RECIPIENT"
      - name: Shared processor regression gate before cloud configuration
        env:
          GCLOUD_PROJECT: demo-idogs-deletion
        run: >-
          npx --yes firebase-tools@14.12.0 emulators:exec --project demo-idogs-deletion --only auth,firestore,storage
          'ACCOUNT_DELETION_MODE=prototype-emulator node --test scripts/test-deletion-processor-emulator.mjs'
      - name: Configure approved Preview only, QA real signed event, always clean session
        env:
          IDOGS_HUMAN_EMAIL_QA_APPROVAL: owner-selected-qa-inbox
          IDOGS_DELETION_QA_RECIPIENT_EMAIL: ${{ secrets.IDOGS_DELETION_QA_RECIPIENT_EMAIL }}
          IDOGS_DELETION_HTTP_QA_APPROVAL: 2026-10-26-isolated-https-fixture
          IDOGS_WEBHOOK_QA_APPROVAL: 2026-10-26-staging-preview-webhook
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          IDOGS_STAGING_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.IDOGS_STAGING_FIREBASE_SERVICE_ACCOUNT_JSON }}
          IDOGS_DELETION_STRIPE_TEST_KEY: ${{ secrets.IDOGS_DELETION_STRIPE_TEST_KEY }}
          IDOGS_DELETION_RESEND_QA_KEY: ${{ secrets.IDOGS_DELETION_RESEND_QA_KEY }}
        run: node scripts/qa/deletion-webhook-session.mjs
