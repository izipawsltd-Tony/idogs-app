name: Preview E2E authenticated (reviewer-gated)

# TRUSTED, MANUAL-ONLY authenticated E2E against ONE exact staging Preview.
# - Never automatic: workflow_dispatch only. The automatic deployment_status workflow stays secret-free.
# - Must run from `master` (guard below); the Environment `qa-staging-e2e` must additionally restrict
#   deployment branches to `master` and require an independent reviewer. All credentials live ONLY in that
#   Environment (no repository-level secrets) and are referenced only by the `e2e` job.
# - Approval is scoped to ONE reviewed SHA: the repository variable E2E_APPROVED_SHA (set by the Owner after
#   Codex's review of that exact commit and its dependency diff) must equal the dispatched SHA.
# - All verification and result handling runs from TRUSTED scripts checked out from `master` (trusted/); the
#   candidate SHA (candidate/) supplies only the application and Playwright specs under review.
# - The same verifier runs twice (verify job, and again in the gated job after the reviewer wait, right before
#   credentials are used); the immutable tuple id (sha|url|github deployment|vercel deployment) must match.
# - Synthetic QA accounts only (docs/growth-v1/QA_SYNTH_FIXTURES.md).
# Environment secrets: VERCEL_AUTOMATION_BYPASS_SECRET (staging project only), E2E_STAGING_EMAIL,
# E2E_STAGING_PASSWORD, E2E_STAGING_EMAIL_2, E2E_STAGING_PASSWORD_2.

run-name: "Authenticated E2E ${{ inputs.sha }}"

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character commit SHA of the staging Preview to test (must equal vars.E2E_APPROVED_SHA)
        required: true
        type: string
      preview_url:
        description: https://idogs-app-staging-<id>.vercel.app URL of that SHA's Preview
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: idogs-authenticated-e2e
  cancel-in-progress: false

jobs:
  verify:
    name: Verify provenance (no secrets)
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
      actions: read
      statuses: read
    outputs:
      sha: ${{ steps.v.outputs.sha }}
      url: ${{ steps.v.outputs.url }}
      tuple_id: ${{ steps.v.outputs.tuple_id }}
    steps:
      - name: Checkout trusted scripts (master)
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Verify target (trusted script)
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          PREVIEW_URL: ${{ inputs.preview_url }}
          APPROVED_SHA: ${{ vars.E2E_APPROVED_SHA }}
          REPO: ${{ github.repository }}
          PROD_BASELINE: 04f0f60eedb9e6fb07273d89c190c9d770ff3e9b
        run: bash scripts/verify-e2e-target.sh

  e2e:
    name: Authenticated E2E (Environment qa-staging-e2e)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: qa-staging-e2e
    permissions:
      contents: read
      deployments: read
      actions: read
      statuses: read
    steps:
      - name: Checkout trusted scripts (master)
        uses: actions/checkout@v4
        with:
          ref: master
          path: trusted
          persist-credentials: false
      - name: Checkout the verified candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Install dependencies and Chromium (no credentials in this step)
        working-directory: candidate
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Re-verify target after the reviewer wait (TOCTOU) with the trusted script
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.verify.outputs.sha }}
          PREVIEW_URL: ${{ needs.verify.outputs.url }}
          APPROVED_SHA: ${{ vars.E2E_APPROVED_SHA }}
          REPO: ${{ github.repository }}
          PROD_BASELINE: 04f0f60eedb9e6fb07273d89c190c9d770ff3e9b
          EXPECTED_TUPLE: ${{ needs.verify.outputs.tuple_id }}
        run: |
          set -euo pipefail
          bash scripts/verify-e2e-target.sh | tee "$RUNNER_TEMP/recheck.txt"
          now=$(grep -o '^TUPLE_ID=.*' "$RUNNER_TEMP/recheck.txt" | cut -d= -f2)
          [ "$now" = "$EXPECTED_TUPLE" ] || { echo "::error::deployment tuple changed between verification and run"; exit 1; }
      - name: Run Playwright via trusted wrapper (all raw output stays in a private scratch dir)
        working-directory: trusted
        env:
          TRUSTED_DIR: ${{ github.workspace }}/trusted
          WORKDIR: ${{ github.workspace }}/candidate
          OUT_DIR: ${{ runner.temp }}/e2e-summary
          BASE_URL: ${{ needs.verify.outputs.url }}
          E2E_CREDENTIALED: '1'
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_STAGING_EMAIL: ${{ secrets.E2E_STAGING_EMAIL }}
          E2E_STAGING_PASSWORD: ${{ secrets.E2E_STAGING_PASSWORD }}
          E2E_STAGING_EMAIL_2: ${{ secrets.E2E_STAGING_EMAIL_2 }}
          E2E_STAGING_PASSWORD_2: ${{ secrets.E2E_STAGING_PASSWORD_2 }}
        # Job fails unless the trusted summarizer reports result=pass (exit 0, parseable report, no errors,
        # no failures, all mandatory specs passed on desktop and iphone, none skipped).
        run: bash scripts/run-credentialed-e2e.sh
      - name: Publish allowlisted summary
        if: always()
        env:
          VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          [ -s "$RUNNER_TEMP/e2e-summary/summary.json" ] || echo '{"result":"blocked","reason":"no_summary"}' > "$RUNNER_TEMP/e2e-summary/summary.json" 2>/dev/null || { mkdir -p "$RUNNER_TEMP/e2e-summary"; echo '{"result":"blocked","reason":"no_summary"}' > "$RUNNER_TEMP/e2e-summary/summary.json"; }
          {
            echo "### Authenticated E2E summary for \`$VERIFIED_SHA\`"
            echo '```json'; cat "$RUNNER_TEMP/e2e-summary/summary.json"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload allowlisted summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-summary-${{ needs.verify.outputs.sha }}
          path: ${{ runner.temp }}/e2e-summary/summary.json
          retention-days: 3
          if-no-files-found: error
