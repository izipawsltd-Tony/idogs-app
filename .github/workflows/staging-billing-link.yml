name: Read-only staging billing link
on:
  push:
    branches: [fix/staging-billing-link-20261023]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'izipawsltd-Tony/idogs-app'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect one approved staging billing link without writes
        env:
          STAGING_SERVICE_ACCOUNT_JSON: ${{ secrets.IDOGS_STAGING_FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/inspect-staging-billing-link.mjs
