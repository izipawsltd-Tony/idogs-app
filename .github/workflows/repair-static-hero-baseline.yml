name: Repair static Hero JPEG

on:
  push:
    branches:
      - feature/landing-static-hero-cooper
    paths:
      - '.github/workflows/repair-static-hero-baseline.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/landing-static-hero-cooper
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Re-encode Hero as baseline JPEG
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const sharp = require('sharp')
          ;(async () => {
            const input = 'public/hero-idogs-cooper.jpg'
            const tmp = 'public/hero-idogs-cooper.baseline.jpg'
            await sharp(input)
              .jpeg({ quality: 92, progressive: false, chromaSubsampling: '4:4:4' })
              .toFile(tmp)
            const meta = await sharp(tmp).metadata()
            if (meta.width !== 720 || meta.height !== 720) {
              throw new Error(`Unexpected Hero dimensions: ${meta.width}x${meta.height}`)
            }
            require('fs').renameSync(tmp, input)
          })().catch(err => { console.error(err); process.exit(1) })
          NODE

      - name: Avoid progressive placeholder paint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/LandingPage.tsx')
          s = p.read_text()
          s = s.replace('decoding="async"', 'decoding="sync"', 1)
          if 'loading="eager"' not in s:
              s = s.replace('fetchPriority="high"\n', 'fetchPriority="high"\n                  loading="eager"\n', 1)
          p.write_text(s)
          PY

      - name: Verify and build
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'src="/hero-idogs-cooper.jpg"' src/pages/LandingPage.tsx
          grep -q 'decoding="sync"' src/pages/LandingPage.tsx
          grep -q 'loading="eager"' src/pages/LandingPage.tsx
          npm run build

      - name: Commit repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-static-hero-baseline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf(landing): render Hero sharply without progressive preview"
          git push origin HEAD:feature/landing-static-hero-cooper
