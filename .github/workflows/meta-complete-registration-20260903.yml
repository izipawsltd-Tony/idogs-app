name: Deploy Meta CompleteRegistration 2026 Preview

on:
  push:
    branches:
      - automation/meta-pixel-2026-preview-20260903
    paths:
      - .github/workflows/meta-complete-registration-20260903.yml

permissions:
  contents: read

env:
  BASE_SHA: 5c8831e89ec2b8faff776260c4472b82d2a3b994
  CANDIDATE_SHA: 20553339fa3ad92d9c7fee2d763921f4c71e4535
  PIXEL_ID: '1648101183992434'
  STAGING_PROJECT_ID: prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o
  TEAM_ID: team_oZF1Z0BUEceb9fAXdmFV1Saz
  VERCEL_SCOPE: izipawsltd-tonys-projects

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Exact scope and registration semantics gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA"..HEAD)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -qx 'src/lib/metaPixel.ts'
          printf '%s\n' "${changed[@]}" | grep -qx 'src/pages/SignupPage.tsx'
          grep -q "fbq('init', '$PIXEL_ID');" index.html
          grep -q "fbq('track', 'PageView');" index.html
          ! grep -q '2647777915638218' index.html
          python3 - <<'PY'
          from pathlib import Path
          helper = Path('src/lib/metaPixel.ts').read_text()
          signup = Path('src/pages/SignupPage.tsx').read_text()
          assert "fbq('track', 'CompleteRegistration'" in helper
          assert "content_name: accountType" in helper
          assert "if (typeof fbq !== 'function') return" in helper
          assert signup.count("trackCompleteRegistration(accountType)") == 1
          assert "import { trackCompleteRegistration } from '../lib/metaPixel'" in signup
          await_i = signup.index('await signup({')
          track_i = signup.index('trackCompleteRegistration(accountType)')
          toast_i = signup.index("toast('Account created!", track_i)
          catch_i = signup.index('} catch (err: unknown)', track_i)
          assert await_i < track_i < toast_i < catch_i
          assert signup.index("if (form.password !== form.confirmPassword)") < await_i
          assert signup.index("if (!agreedToTerms)") < await_i
          print('META_COMPLETE_REGISTRATION_SEMANTICS=PASS')
          PY
          echo META_COMPLETE_REGISTRATION_SCOPE=PASS

      - name: Install dependencies and build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          echo META_COMPLETE_REGISTRATION_BUILD=PASS

      - name: Hard-lock staging Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '%s\n' '{"projectId":"prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o","orgId":"team_oZF1Z0BUEceb9fAXdmFV1Saz","projectName":"idogs-app-staging"}' > .vercel/project.json
          node -e "const d=require('./.vercel/project.json'); if(d.projectId!==process.env.STAGING_PROJECT_ID||d.orgId!==process.env.TEAM_ID||d.projectName!=='idogs-app-staging') process.exit(1)"
          echo STAGING_PROJECT_LOCK=PASS

      - name: Deploy exact candidate to Preview only
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          npx --yes vercel@latest deploy --yes --archive=tgz --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" --no-color > /tmp/vercel.stdout 2> /tmp/vercel.stderr
          PREVIEW_URL=$(cat /tmp/vercel.stdout /tmp/vercel.stderr | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -1 || true)
          test -n "$PREVIEW_URL"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "META_COMPLETE_REGISTRATION_PREVIEW_URL=$PREVIEW_URL"
          echo META_COMPLETE_REGISTRATION_PREVIEW_DEPLOY=PASS

      - name: Terminal safety assertion
        shell: bash
        run: |
          echo STABLE_STAGING_PROMOTION=NOT_PERFORMED
          echo PRODUCTION_DEPLOY=NOT_PERFORMED
          echo META_COMPLETE_REGISTRATION_AUTOMATION=PASS
