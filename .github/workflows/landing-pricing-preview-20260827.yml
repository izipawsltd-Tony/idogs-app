name: Build landing pricing Preview

on:
  push:
    branches:
      - feature/landing-pricing-20260827
    paths:
      - .github/workflows/landing-pricing-preview-20260827.yml

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/landing-pricing-20260827
          fetch-depth: 0

      - name: Fail closed on exact approved production baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE='f09ff74eac93669ec5e40b975a31e9d5f81cbfb5'
          WF='.github/workflows/landing-pricing-preview-20260827.yml'
          mapfile -t changed < <(git diff --name-only "$BASE"..HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$WF"
          test -z "$(git status --porcelain)"

      - name: Add public Pricing navigation and section
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('src/pages/LandingPage.tsx')
          s = p.read_text()

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              s = s.replace(old, new, 1)

          replace_once(
              '''            <nav className="nav-links" aria-label="Primary">\n              <a href="#features">Features</a>\n              <a href="#for-owners">For Owners</a>\n              <a href="#for-breeders">For Breeders</a>\n            </nav>\n''',
              '''            <nav className="nav-links" aria-label="Primary">\n              <a href="#features">Features</a>\n              <a href="#for-owners">For Owners</a>\n              <a href="#for-breeders">For Breeders</a>\n              <a href="#pricing">Pricing</a>\n            </nav>\n''',
              'desktop pricing nav',
          )

          replace_once(
              '              <div className="cta-row">\n                <Link className="btn btn-primary" to="/signup">Start Free</Link>\n                <a className="btn btn-ghost" href="#howitworks">See How It Works</a>\n              </div>\n',
              '              <div className="cta-row">\n                <Link className="btn btn-primary" to="/signup">Start Free</Link>\n                <a className="btn btn-ghost" href="#howitworks">See How It Works</a>\n              </div>\n              <p className="price-note">Plans from A$5/month · No complicated pricing.</p>\n',
              'hero pricing note',
          )

          replace_once(
              '        {/* Pricing section intentionally absent — hidden until real prices/inclusions are verified (brief §2/§8) */}\n        {/* FAQ section intentionally absent — no answer verified against the real product yet (brief §13) */}\n',
              '''        <section className="block pricing-block" id="pricing">\n          <div className="wrap">\n            <p className="kicker">Simple pricing</p>\n            <h2>Everything you need, without complicated plans.</h2>\n            <p className="lead">Start free. Upgrade to iDogs Plus when you need more.</p>\n            <div className="pricing-grid">\n              <article className="pricing-card pricing-card-main">\n                <div className="pricing-card-head">\n                  <div>\n                    <p className="pricing-label">iDogs Plus</p>\n                    <p className="pricing-price"><span>A$5</span><small>/month</small></p>\n                  </div>\n                  <span className="pricing-badge">Most popular</span>\n                </div>\n                <p className="pricing-copy">Organise your dogs and breeding records in one connected workspace.</p>\n                <ul className="pricing-list">\n                  <li>Dog profiles, health records and documents</li>\n                  <li>Breeder tools for dogs, litters and puppies</li>\n                  <li>Digital Passport and QR sharing</li>\n                </ul>\n                <Link className="btn btn-primary pricing-cta" to="/signup">Start Free</Link>\n              </article>\n              <article className="pricing-card pricing-card-addon">\n                <p className="pricing-label">Optional add-on</p>\n                <h3>SMS Reminders</h3>\n                <p className="pricing-price"><span>+A$3</span><small>/month</small></p>\n                <p className="pricing-copy">Add SMS reminders to Plus when you need them.</p>\n                <div className="sms-credit"><strong>20 SMS credits</strong><span>included each month</span></div>\n              </article>\n            </div>\n            <p className="pricing-footnote">Less than the cost of a coffee each month.</p>\n          </div>\n        </section>\n\n        {/* FAQ section intentionally absent — no answer verified against the real product yet (brief §13) */}\n''',
              'pricing section',
          )

          replace_once(
              '                  <a href="#for-breeders">For Breeders</a>\n',
              '                  <a href="#for-breeders">For Breeders</a>\n                  <a href="#pricing">Pricing</a>\n',
              'footer pricing nav',
          )

          replace_once(
              '        <a href="#for-breeders" onClick={onClose}>For Breeders</a>\n',
              '        <a href="#for-breeders" onClick={onClose}>For Breeders</a>\n        <a href="#pricing" onClick={onClose}>Pricing</a>\n',
              'mobile pricing nav',
          )

          css = '''\n  .lv2-page .price-note { margin:14px 0 0; color:var(--on-forest-soft); font-size:13px; font-weight:650; }\n  .lv2-page .pricing-block { scroll-margin-top:76px; }\n  .lv2-page .pricing-grid { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr); gap:22px; margin-top:34px; align-items:stretch; }\n  .lv2-page .pricing-card { border:1px solid var(--line); border-radius:var(--radius); padding:30px; background:#fffdf8; box-shadow:0 16px 38px rgba(20,35,31,.07); }\n  .lv2-page .pricing-card-main { border-color:rgba(192,138,45,.6); }\n  .lv2-page .pricing-card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; }\n  .lv2-page .pricing-label { margin:0 0 6px; color:var(--ink-soft); font-size:13px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; }\n  .lv2-page .pricing-price { display:flex; align-items:baseline; gap:6px; margin:0 0 16px; }\n  .lv2-page .pricing-price span { font-family:'Fraunces','Georgia',serif; font-size:46px; font-weight:650; line-height:1; color:var(--forest); }\n  .lv2-page .pricing-price small { color:var(--ink-soft); font-size:14px; font-weight:650; }\n  .lv2-page .pricing-badge { flex:0 0 auto; border-radius:999px; background:rgba(192,138,45,.14); color:var(--brass-lo); padding:7px 10px; font-size:12px; font-weight:800; }\n  .lv2-page .pricing-copy { margin:0 0 18px; color:var(--ink-soft); max-width:56ch; }\n  .lv2-page .pricing-list { list-style:none; padding:0; margin:0 0 24px; display:grid; gap:10px; }\n  .lv2-page .pricing-list li { position:relative; padding-left:25px; }\n  .lv2-page .pricing-list li::before { content:'✓'; position:absolute; left:0; color:var(--brass-lo); font-weight:900; }\n  .lv2-page .pricing-cta { padding:11px 22px; }\n  .lv2-page .pricing-card-addon h3 { margin:2px 0 14px; font-size:30px; }\n  .lv2-page .sms-credit { display:flex; flex-direction:column; gap:2px; padding:16px 18px; border-radius:12px; background:var(--bone); border:1px solid var(--line); }\n  .lv2-page .sms-credit strong { color:var(--forest); font-size:18px; }\n  .lv2-page .sms-credit span { color:var(--ink-soft); font-size:13px; }\n  .lv2-page .pricing-footnote { margin:18px 0 0; text-align:center; color:var(--ink-soft); font-size:13px; }\n  @media (max-width: 760px) {\n    .lv2-page .pricing-grid { grid-template-columns:1fr; }\n    .lv2-page .pricing-card { padding:24px; }\n    .lv2-page .pricing-card-head { flex-direction:column; gap:8px; }\n    .lv2-page .pricing-price span { font-size:42px; }\n  }\n'''
          replace_once('const LV2_CSS = `\n', 'const LV2_CSS = `\n' + css, 'pricing CSS')
          p.write_text(s)
          PY

          rm .github/workflows/landing-pricing-preview-20260827.yml
          grep -q 'href="#pricing">Pricing</a>' src/pages/LandingPage.tsx
          grep -q 'Plans from A\$5/month' src/pages/LandingPage.tsx
          grep -q 'iDogs Plus' src/pages/LandingPage.tsx
          grep -q '20 SMS credits' src/pages/LandingPage.tsx

      - name: Install dependencies
        run: npm ci

      - name: Build and landing regression checks
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test "$(grep -c 'href=\"#pricing\"' src/pages/LandingPage.tsx)" -ge 3
          test "$(grep -c 'A\$5' src/pages/LandingPage.tsx)" -ge 2
          test "$(grep -c 'A\$3' src/pages/LandingPage.tsx)" -ge 1
          test "$(grep -c '20 SMS credits' src/pages/LandingPage.tsx)" -eq 1

      - name: Commit exact product change and verify tree
        id: product
        shell: bash
        env:
          BASE: f09ff74eac93669ec5e40b975a31e9d5f81cbfb5
        run: |
          set -euo pipefail
          git config user.name 'izipawsltd-Tony'
          git config user.email 'izipawsltd@gmail.com'
          git add -A
          git commit -m 'feat(landing): add simple public pricing section'
          PRODUCT_SHA="$(git rev-parse HEAD)"
          echo "sha=$PRODUCT_SHA" >> "$GITHUB_OUTPUT"
          mapfile -t net_changed < <(git diff --name-only "$BASE"..HEAD)
          test "${#net_changed[@]}" -eq 1
          test "${net_changed[0]}" = 'src/pages/LandingPage.tsx'
          test -z "$(git status --porcelain)"
          git push origin HEAD:feature/landing-pricing-20260827
          echo "Exact product SHA: $PRODUCT_SHA"

      - name: Link exact staging project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"projectId":"prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o","orgId":"team_oZF1Z0BUEceb9fAXdmFV1Saz","projectName":"idogs-app-staging"}
          JSON
          grep -q 'prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o' .vercel/project.json
          grep -q 'idogs-app-staging' .vercel/project.json

      - name: Deploy exact product SHA to Preview only
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          EXPECTED='${{ steps.product.outputs.sha }}'
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain --untracked-files=no)"
          npx --yes vercel@latest deploy --yes --archive=tgz --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects | tee /tmp/vercel-preview.log
          echo 'Preview only: no --prod and no stable alias promotion.'
