/** Neutral ruleset used by UI when profile jurisdiction is missing. It keeps
 * Dogs Australia national guidance available but applies NO state/territory
 * numeric cap and therefore cannot silently behave as South Australia. */
export const NO_JURISDICTION_RULES: StateRules = {
  stateName: 'Jurisdiction not set',
  minBreedingMonths: 12, minBreedingMonthsLarge: 18,
  minBreedingSource: 'ANKC_NATIONAL', minBreedingRule: 'Dogs Australia Regulations Part 6', minBreedingVerified: true,
  maxLifetimeLitters: 999, lifetimeLittersVetExemption: false,
  lifetimeLittersSource: 'STATE_LAW', lifetimeLittersRule: 'Set breeder state/territory to evaluate local law', lifetimeLittersVerified: false,
  maxLittersIn18Months: 999, littersIn18mSource: 'STATE_LAW', littersIn18mVerified: false,
  maxCsections: null, csectionVetRequired: null, csectionRule: 'Set breeder state/territory to evaluate local law', csectionVerified: false,
  maxAgeYears: 8, vetCertAfterAgeYears: 8, vetCertAfterAgeSource: 'ANKC_NATIONAL', vetCertAfterAgeRule: 'Dogs Australia Part 6, 8.3', vetCertAfterAgeVerified: true,
  requiresBIN: false, breederIdLabel: null, breederIdVerified: false,
  memberBodyName: 'State member body not determined', memberBodyUrl: '', memberRulesVerified: false,
  notes: 'Set the breeder profile state/territory before relying on state-law compliance results.',
  sourceName: 'Jurisdiction required', sourceUrl: '',
}

'''
          s = s[:start] + registry + s[end:]

          # Engine: jurisdiction fail-closed, never SA fallback.
          s = s.replace(
              "  const state = STATE_RULES[input.state || 'SA'] || STATE_RULES['SA']\n",
              "  const jurisdiction = resolveComplianceJurisdiction(input.state)\n  const state = jurisdiction ? STATE_RULES[jurisdiction] : NO_JURISDICTION_RULES\n  if (!jurisdiction) {\n    findings.push({ level: 'warn', source: 'STATE_LAW', consequence: 'INFO', message: 'Compliance jurisdiction not set — set breeder state/territory before relying on state-law checks', rule: 'Jurisdiction required', verified: true })\n  }\n",
              1,
          )

          # Minimum-age block: use source metadata and allow ACT's stricter verified state minimum.
          start = s.index('  // ── Dam minimum age ──')
          end = s.index('  // ── Sire minimum age', start)
          block = r'''  // ── Dam minimum age ──
  if (damAgeMo !== null) {
    if (damAgeMo < state.minBreedingMonths) {
      findings.push({
        level: 'block', source: state.minBreedingSource,
        consequence: state.minBreedingSource === 'STATE_LAW' ? 'LEGAL_OFFENCE' : 'LIMITED_REGISTER',
        message: `Dam is ${damAgeMo} months — minimum encoded for ${jurisdiction ? state.stateName : 'Dogs Australia national rules'} is ${state.minBreedingMonths} months`,
        rule: state.minBreedingRule, verified: state.minBreedingVerified,
      })
    } else if (breedRules?.minDamMonths && damAgeMo < breedRules.minDamMonths) {
      const exemption = breedRules.minDamMonthsVetExemption
      findings.push({
        level: exemption ? 'warn' : 'block',
        source: 'ANKC_NATIONAL',
        consequence: exemption ? 'VET_CERT_REQUIRED' : (breedRules.minDamConsequence || 'LIMITED_REGISTER'),
        message: exemption
          ? `Dam is ${damAgeMo} months — breed minimum is ${breedRules.minDamMonths} months. Litter → Limited Register unless a veterinary certificate (health grounds) is produced`
          : `Dam is ${damAgeMo} months — breed minimum is ${breedRules.minDamMonths} months. Litter → Limited Register, not to be upgraded`,
        rule: breedRules.minDamRule || 'ANKC Part 6', verified: true,
      })
    }
  }

'''
          s = s[:start] + block + s[end:]

          # Lifetime cap skips sentinel 999. Unverified numeric member rules can never hard-block by default.
          start = s.index('  // ── Lifetime litters')
          end = s.index('  // ── Litter frequency', start)
          block = r'''  // ── Lifetime litters (only when a universal cap is verified/encoded) ──
  const litters = dam.litterCount ?? 0
  if (state.maxLifetimeLitters !== 999 && litters >= state.maxLifetimeLitters) {
    if (state.lifetimeLittersVetExemption) {
      findings.push({
        level: 'warn', source: state.lifetimeLittersSource, consequence: 'VET_CERT_REQUIRED',
        message: `Dam has had ${litters} litters (threshold ${state.maxLifetimeLitters}) — further breeding requires the applicable written veterinary approval/determination`,
        rule: state.lifetimeLittersRule, verified: state.lifetimeLittersVerified,
      })
    } else {
      findings.push({
        level: state.lifetimeLittersVerified ? 'block' : 'warn', source: state.lifetimeLittersSource, consequence: state.lifetimeLittersVerified ? 'LEGAL_OFFENCE' : 'INFO',
        message: `Lifetime litter threshold reached (${state.maxLifetimeLitters} in ${state.stateName})${state.lifetimeLittersVerified ? '' : ' — source pending verification'}`,
        rule: state.lifetimeLittersRule, verified: state.lifetimeLittersVerified,
      })
    }
  }

'''
          s = s[:start] + block + s[end:]

          # Member-body rules are conditional; state law rules always apply.
          start = s.index('  // ── Litter frequency ──')
          end = s.index('  // ── C-sections', start)
          block = r'''  // ── Litter frequency ──
  const applyFrequencyRule = state.maxLittersIn18Months !== 999
    && (state.littersIn18mSource !== 'KENNEL_CLUB_STATE' || input.applyMemberBodyRules === true)
  if (applyFrequencyRule && (dam.last18mLitters ?? 0) >= state.maxLittersIn18Months) {
    findings.push({
      level: state.littersIn18mSource === 'STATE_LAW' && state.littersIn18mVerified ? 'block' : 'warn',
      source: state.littersIn18mSource,
      consequence: state.littersIn18mSource === 'STATE_LAW' ? 'LEGAL_OFFENCE' : 'ETHICS_BREACH',
      message: `${dam.last18mLitters} litters in the last 18 months (threshold ${state.maxLittersIn18Months})${state.littersIn18mVerified ? '' : ' — source pending verification'}`,
      rule: state.sourceName, verified: state.littersIn18mVerified,
    })
  }

'''
          s = s[:start] + block + s[end:]

          # C-sections: use jurisdiction verification metadata rather than hard-coded false.
          start = s.index('  // ── C-sections')
          end = s.index('  // ── Colour prohibitions', start)
          block = r'''  // ── C-sections ──
  const cs = dam.cSectionCount ?? 0
  if (state.maxCsections !== null && cs >= state.maxCsections) {
    findings.push({
      level: state.csectionVerified ? 'block' : 'warn', source: 'STATE_LAW', consequence: state.csectionVerified ? 'LEGAL_OFFENCE' : 'INFO',
      message: `C-section threshold reached (${state.maxCsections} in ${state.stateName})`,
      rule: state.csectionRule, verified: state.csectionVerified,
    })
  } else if (state.csectionVetRequired !== null && cs >= state.csectionVetRequired) {
    findings.push({
      level: 'warn', source: 'STATE_LAW', consequence: 'VET_CERT_REQUIRED',
      message: 'Veterinary review / written approval is required before further breeding under the selected jurisdiction rule',
      rule: state.csectionRule, verified: state.csectionVerified,
    })
  }

'''
          s = s[:start] + block + s[end:]

          s = s.replace("  if ((input.state || 'SA') === 'SA' && findings.every(f => f.level !== 'block')) {", "  if (jurisdiction === 'SA' && findings.every(f => f.level !== 'block')) {", 1)
          p.write_text(s, encoding='utf-8')

          # ---------- DogDetailPage.tsx ----------
          p = Path('src/pages/DogDetailPage.tsx')
          s = p.read_text(encoding='utf-8')
          old_import = "import { resolvePedigreeRegister, resolveBreedingEligibility, nextPedigreeRegisterUpdate, nextBreedingRightsUpdate, initialTransferPedigreeRegister, initialBreedingRightsValue, pedigreeRegisterLabel, breedingRightsLabel, type BreedingRightsValue } from '../lib/breedingCompliance'"
          new_import = "import { resolvePedigreeRegister, resolveBreedingEligibility, nextPedigreeRegisterUpdate, nextBreedingRightsUpdate, initialTransferPedigreeRegister, initialBreedingRightsValue, pedigreeRegisterLabel, breedingRightsLabel, STATE_RULES, NO_JURISDICTION_RULES, resolveComplianceJurisdiction, type AustralianJurisdiction, type BreedingRightsValue } from '../lib/breedingCompliance'"
          if old_import not in s:
              raise SystemExit('DogDetail import not found')
          s = s.replace(old_import, new_import, 1)
          s = s.replace("  const userState: string = (profile as any)?.state || 'SA'", "  const userState = resolveComplianceJurisdiction((profile as any)?.state)", 1)

          # Remove duplicate local state-rule table; shared module is canonical.
          start = s.index('// ── BREEDING COMPLIANCE RULES BY STATE')
          end = s.index('// Mating methods taxonomy', start)
          s = s[:start] + "// Breeding compliance jurisdiction rules are canonical in ../lib/breedingCompliance.\n\n" + s[end:]

          s = s.replace('  userState: string\n', '  userState: AustralianJurisdiction | null\n', 1)
          s = s.replace('  const [selectedState, setSelectedState] = useState(userState)', "  const [selectedState, setSelectedState] = useState<AustralianJurisdiction | ''>(userState || '')", 1)
          s = s.replace("  const rules = STATE_RULES[selectedState] || STATE_RULES['SA']", "  const hasJurisdiction = !!selectedState\n  const rules = selectedState ? STATE_RULES[selectedState] : NO_JURISDICTION_RULES", 1)
          s = s.replace('  const littersOk = litterCount < rules.maxLifetimeLitters', '  const littersOk = rules.maxLifetimeLitters === 999 || litterCount < rules.maxLifetimeLitters', 1)
          s = s.replace('  const overallOk = !isPuppyOrWhelp && !isUnder12 && !isOver && littersOk && last18Ok && csectionOk', '  const overallOk = hasJurisdiction && !isPuppyOrWhelp && !isUnder12 && !isOver && littersOk && last18Ok && csectionOk', 1)
          s = s.replace('  const overallMsg = isPuppyOrWhelp ?', "  const overallMsg = !hasJurisdiction ? '⚠️ Compliance jurisdiction not set — select breeder state / territory'\n    : isPuppyOrWhelp ?", 1)

          # Safer rule-table values: no fake 999 limit.
