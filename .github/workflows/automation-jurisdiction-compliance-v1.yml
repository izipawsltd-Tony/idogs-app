name: Build jurisdiction compliance v1

on:
  push:
    branches:
      - automation/jurisdiction-compliance-v1-final5

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/jurisdiction-compliance-v1-final5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build jurisdiction-aware compliance
        shell: bash
        run: |
          set -euo pipefail
          msg="$(git log -1 --pretty=%s)"
          if [ "$msg" != "automation: build jurisdiction compliance v1" ]; then
            echo "Not trigger commit; exiting."
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path

          # ---------- breedingCompliance.ts ----------
          p = Path('src/lib/breedingCompliance.ts')
          s = p.read_text(encoding='utf-8')

          # Add jurisdiction resolver beside canonical pedigree/rights types.
          needle = "export type BreedingRightsValue = 'eligible' | 'not_eligible' | 'unknown'\n"
          insert = """export type BreedingRightsValue = 'eligible' | 'not_eligible' | 'unknown'\n\nexport type AustralianJurisdiction = 'SA' | 'NSW' | 'VIC' | 'QLD' | 'WA' | 'TAS' | 'ACT' | 'NT'\n\nconst AUSTRALIAN_JURISDICTIONS = new Set<AustralianJurisdiction>(['SA', 'NSW', 'VIC', 'QLD', 'WA', 'TAS', 'ACT', 'NT'])\n\n/**\n * Fail-closed jurisdiction resolver. Missing/invalid profile state is NEVER\n * coerced to South Australia. Callers must surface that the jurisdiction\n * is not set instead of applying the wrong state's law.\n */\nexport function resolveComplianceJurisdiction(raw?: string | null): AustralianJurisdiction | null {\n  const normalized = String(raw || '').trim().toUpperCase() as AustralianJurisdiction\n  return AUSTRALIAN_JURISDICTIONS.has(normalized) ? normalized : null\n}\n"""
          if needle not in s:
              raise SystemExit('jurisdiction insertion point missing')
          s = s.replace(needle, insert, 1)

          # ComplianceInput: no SA fallback + optional member-body rules.
          old = """  /** State code, e.g. 'SA'. Falls back to 'SA'. */\n  state?: string\n  /** Proposed mating date (ISO). Defaults to today. Whelping estimated +63 days. */\n  matingDate?: string\n"""
          new = """  /** State/territory code. Missing/invalid values fail closed; there is no SA fallback. */\n  state?: string\n  /** Apply state kennel-club/member-body ethics rules only when membership is actually known. */\n  applyMemberBodyRules?: boolean\n  /** Proposed mating date (ISO). Defaults to today. Whelping estimated +63 days. */\n  matingDate?: string\n"""
          if old not in s:
              raise SystemExit('ComplianceInput block missing')
          s = s.replace(old, new, 1)

          # Replace canonical jurisdiction registry in full.
          start = s.index('export interface StateRules {')
          end = s.index('// ── Breed rules (Layer 1 — ANKC Part 6 breed-specific)')
          registry = r'''export interface StateRules {
  stateName: string
  minBreedingMonths: number
  minBreedingMonthsLarge: number
  minBreedingSource: RuleSource
  minBreedingRule: string
  minBreedingVerified: boolean
  /** 999 = no verified universal state/territory cap encoded. */
  maxLifetimeLitters: number
  lifetimeLittersVetExemption: boolean
  lifetimeLittersSource: RuleSource
  lifetimeLittersRule: string
  lifetimeLittersVerified: boolean
  /** 999 = no verified universal rule encoded. */
  maxLittersIn18Months: number
  littersIn18mSource: RuleSource
  littersIn18mVerified: boolean
  maxCsections: number | null
  csectionVetRequired: number | null
  csectionRule: string
  csectionVerified: boolean
  /** Review/vet-certificate threshold. May come from state law or Dogs Australia rules. */
  maxAgeYears: number
  vetCertAfterAgeYears: number
  vetCertAfterAgeSource: RuleSource
  vetCertAfterAgeRule: string
  vetCertAfterAgeVerified: boolean
  requiresBIN: boolean
  breederIdLabel: string | null
  breederIdVerified: boolean
  memberBodyName: string
  memberBodyUrl: string
  memberRulesVerified: boolean
  notes: string
  sourceName: string
  sourceUrl: string
}

