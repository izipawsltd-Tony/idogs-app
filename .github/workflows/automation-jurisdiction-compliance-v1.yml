name: Build jurisdiction compliance v1

on:
  push:
    branches:
      - automation/jurisdiction-compliance-v1-final5

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: automation/jurisdiction-compliance-v1-final5
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Generate jurisdiction-aware compliance
        run: python .github/scripts/jurisdiction_compliance_v1.py

      - name: Verify candidate
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run
          npm run build
          git diff --check

      - name: Commit generated change
        run: |
          git config user.name "iDogs Auto Build"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/breedingCompliance.ts src/lib/breedingCompliance.test.ts src/pages/DogDetailPage.tsx
          git commit -m "feat(compliance): make Australian jurisdiction rules fail closed"
          git push origin HEAD:automation/jurisdiction-compliance-v1-final5
