name: Pedigree exact-SHA staging E2E

on:
  push:
    branches: [automation/pedigree-staging-e2e-20260919]
    paths: ['.github/workflows/pedigree-staging-e2e-20260919.yml']

permissions:
  contents: read

jobs:
  pedigree-staging-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CANDIDATE_SHA: 815a304a546198f60df8537f4f48f1e18aff91ea
      VERIFIED_PRODUCTION_SHA: d3052ea12a9a2498ecec3e77a500315899850f39
      MAIN_PROJECT_ID: prj_UsnGhC1BWtYnmF5rKMYBR9KWkbIo
      TEAM_SLUG: izipawsltd-tonys-projects
      EXACT_PREVIEW_URL: https://idogs-8nskllpgx-izipawsltd-tonys-projects.vercel.app
      LOCAL_QA_URL: http://127.0.0.1:4173

    steps:
      - name: Checkout automation branch and preserve QA harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve harness then pin exact pedigree candidate
        shell: bash
        run: |
          set -euo pipefail
          cp .github/qa/pedigree-staging-e2e.mjs /tmp/pedigree-staging-e2e.mjs
          git checkout --detach "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "$VERIFIED_PRODUCTION_SHA" "$CANDIDATE_SHA"
          printf '\n/.pedigree-staging-e2e.mjs\n' >> .git/info/exclude
          cp /tmp/pedigree-staging-e2e.mjs ./.pedigree-staging-e2e.mjs
          echo "EXACT_SOURCE_OK $CANDIDATE_SHA"
          echo "VERIFIED_PRODUCTION_ANCESTOR $VERIFIED_PRODUCTION_SHA"

      - name: Install dependencies
        run: npm ci

      - name: Re-run deterministic quality gate
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm test
          npm run build
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          echo DETERMINISTIC_GATE_PASS

      - name: Pull main Preview environment and enforce staging Firebase boundary
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf .vercel
          mkdir -p .vercel
          printf '%s\n' '{"projectId":"prj_UsnGhC1BWtYnmF5rKMYBR9KWkbIo","orgId":"team_oZF1Z0BUEceb9fAXdmFV1Saz","projectName":"idogs-app"}' > .vercel/project.json
          npx --yes vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN" --scope="$TEAM_SLUG" >/tmp/preview-pull.log 2>&1
          ENV_FILE=.vercel/.env.preview.local
          test -f "$ENV_FILE"
          set -a
          source "$ENV_FILE"
          set +a
          test "${FIREBASE_PROJECT_ID:-}" = "idogs-app-staging"
          test "${VITE_FIREBASE_PROJECT_ID:-}" = "idogs-app-staging"
          test -n "${FIREBASE_CLIENT_EMAIL:-}"
          test -n "${FIREBASE_PRIVATE_KEY:-}"
          if [ "${EXTRA_LITTER_CHECKOUT_ENABLED:-false}" = "true" ]; then echo 'FAIL checkout enabled in Preview QA'; exit 1; fi
          echo MAIN_PREVIEW_FIREBASE_STAGING_BOUNDARY_PASS
          echo PAYMENT_PATHS_FORBIDDEN_IN_THIS_QA

      - name: Verify existing exact-SHA Vercel Preview through authenticated CLI
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest curl / --deployment "$EXACT_PREVIEW_URL" --token="$VERCEL_TOKEN" --scope="$TEAM_SLUG" > /tmp/exact-preview-home.html
          grep -q '<div id="root"></div>' /tmp/exact-preview-home.html
          npx --yes vercel@latest curl /login --deployment "$EXACT_PREVIEW_URL" --token="$VERCEL_TOKEN" --scope="$TEAM_SLUG" > /tmp/exact-preview-login.html
          grep -q '<div id="root"></div>' /tmp/exact-preview-login.html
          echo "EXACT_SHA_VERCEL_PREVIEW_REACHABLE $CANDIDATE_SHA"

      - name: Build exact candidate with the verified staging Preview environment
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .vercel/.env.preview.local
          set +a
          test "$FIREBASE_PROJECT_ID" = "idogs-app-staging"
          test "$VITE_FIREBASE_PROJECT_ID" = "idogs-app-staging"
          unset STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_TEST_SECRET_KEY
          npm run build
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          echo STAGING_FIREBASE_BUILD_PASS

      - name: Create disposable staging-only pedigree fixture
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .vercel/.env.preview.local
          set +a
          test "$FIREBASE_PROJECT_ID" = "idogs-app-staging"
          test "$VITE_FIREBASE_PROJECT_ID" = "idogs-app-staging"
          unset STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_TEST_SECRET_KEY
          export QA_RUN_KEY="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node ./.pedigree-staging-e2e.mjs setup

      - name: Pedigree live E2E against staging Firebase
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .vercel/.env.preview.local
          set +a
          test "$FIREBASE_PROJECT_ID" = "idogs-app-staging"
          test "$VITE_FIREBASE_PROJECT_ID" = "idogs-app-staging"
          unset STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_TEST_SECRET_KEY
          export QA_RUN_KEY="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export BASE_URL="$LOCAL_QA_URL"
          CHROME_PATH=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          test -n "$CHROME_PATH"
          export CHROME_PATH
          npm install --no-save --package-lock=false playwright-core@1.55.0 >/tmp/playwright-install.log 2>&1
          npx vite preview --host 127.0.0.1 --port 4173 >/tmp/vite-preview.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            curl -fsS "$LOCAL_QA_URL/login" >/tmp/local-login.html && break
            sleep 1
          done
          grep -q '<div id="root"></div>' /tmp/local-login.html
          node ./.pedigree-staging-e2e.mjs e2e
          echo "PEDIGREE_LIVE_E2E_PASS $CANDIDATE_SHA"

      - name: Cleanup disposable staging fixture
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f .vercel/.env.preview.local || { echo CLEANUP_SKIPPED_NO_ENV_FILE; exit 0; }
          test -f ./.pedigree-staging-e2e.mjs || { echo CLEANUP_SKIPPED_NO_HARNESS; exit 0; }
          set -a
          source .vercel/.env.preview.local
          set +a
          test "${FIREBASE_PROJECT_ID:-}" = "idogs-app-staging"
          test "${VITE_FIREBASE_PROJECT_ID:-}" = "idogs-app-staging"
          unset STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_TEST_SECRET_KEY
          export QA_RUN_KEY="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node ./.pedigree-staging-e2e.mjs cleanup

      - name: Final exact-SHA staging report
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          echo "EXACT_CANDIDATE_SHA $CANDIDATE_SHA"
          echo "EXACT_VERCEL_PREVIEW $EXACT_PREVIEW_URL"
          echo "FIREBASE_QA_PROJECT idogs-app-staging"
          echo "MAIN_PRODUCTION_DEPLOYMENT_UNTOUCHED"
          echo PEDIGREE_STAGING_GATE_PASS
