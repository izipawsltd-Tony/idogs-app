name: Fix landing hero image

on:
  push:
    branches:
      - feature/landing-static-hero-cooper
    paths:
      - '.github/workflows/fix-static-hero-jpg.yml'

permissions:
  contents: write

jobs:
  fix-static-hero-jpg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/landing-static-hero-cooper
          fetch-depth: 0

      - name: Switch Hero from AVIF to JPEG
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          landing = Path('src/pages/LandingPage.tsx')
          text = landing.read_text()
          text = text.replace('/hero-idogs-cooper.avif', '/hero-idogs-cooper.jpg')
          text = text.replace('height={946}', 'height={720}')
          landing.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          html = html.replace('href="/hero-idogs-cooper.avif" type="image/avif"', 'href="/hero-idogs-cooper.jpg" type="image/jpeg"')
          index.write_text(html)
          PY
          rm -f public/hero-idogs-cooper.avif

      - name: Verify Hero source path
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'src="/hero-idogs-cooper.jpg"' src/pages/LandingPage.tsx
          grep -q 'width={720}' src/pages/LandingPage.tsx
          grep -q 'height={720}' src/pages/LandingPage.tsx
          grep -q 'href="/hero-idogs-cooper.jpg" type="image/jpeg"' index.html
          test -s public/hero-idogs-cooper.jpg

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Commit repaired Hero candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-static-hero-jpg.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(landing): replace corrupted Hero AVIF with JPEG"
          git push origin HEAD:feature/landing-static-hero-cooper
