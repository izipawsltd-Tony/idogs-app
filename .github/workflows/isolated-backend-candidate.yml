name: Isolated production backend candidate
on:
  push:
    branches: [release/deletion-backend-isolated-20261022]
  pull_request:
    paths:
      - api/**
      - scripts/**
      - .github/workflows/isolated-backend-candidate.yml
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify candidate scope against its pinned baseline
        run: |
          if [ "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" = 'fix/promotion-billing-compat-20261023' ]; then
            node scripts/verify-promotion-compat-scope.mjs
          else
            node scripts/verify-isolated-backend.mjs
          fi
      - run: node scripts/check-api-syntax.mjs
      - run: npm ci
      - name: Backend contracts, billing and reminder regressions
        run: |
          node scripts/test-create-dog-core.mjs
          node scripts/test-webhook-handler.mjs
          node scripts/test-billing-legacy-reconcile.mjs
          node scripts/test-billing-p0-security.mjs
          node scripts/test-billing-payments-phase1.mjs
          node scripts/test-extra-litter-webhook.mjs
          node scripts/test-extra-litter-checkout.mjs
          node scripts/test-sms-addon-v1.mjs
          node --test scripts/test-account-deletion.mjs scripts/test-deletion-processor.mjs
      - name: Production Rules unchanged; actual server handlers and synthetic provider failures
        env:
          GCLOUD_PROJECT: demo-idogs-account-deletion
        run: npx --yes firebase-tools@14.12.0 emulators:exec --project demo-idogs-account-deletion --only auth,firestore,storage 'node --test --test-concurrency=1 scripts/test-account-deletion-emulator.mjs scripts/test-deletion-scan-fence-emulator.mjs scripts/test-deletion-server-media-emulator.mjs scripts/test-deletion-final-guards-emulator.mjs scripts/test-isolated-backend-boundary-emulator.mjs'
