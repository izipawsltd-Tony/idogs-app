name: iDogs isolated staging SMS reminder E2E
on:
  push:
    branches: [qa/staging-oidc-reminder-e2e-20261024]
    paths:
      - .github/workflows/staging-sms-reminder-oidc-e2e.yml
      - scripts/qa-staging-oidc-reminder-e2e.mjs
      - src/pages/SettingsPage.tsx
      - scripts/settings-sms-preferences.test.js
      - scripts/test-settings-role-gating.mjs
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: staging-sms-e2e-20261024
  cancel-in-progress: false
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging-qa
    steps:
      - name: Verify exact OIDC QA configuration
        env:
          PROVIDER: projects/530003937245/locations/global/workloadIdentityPools/github-sms-qa-writer/providers/github-actions
          SERVICE_ACCOUNT: idogs-staging-sms-qa-writer@idogs-app-staging.iam.gserviceaccount.com
        run: |
          test "$GITHUB_REPOSITORY" = 'izipawsltd-Tony/idogs-app'
          test "$GITHUB_REF" = 'refs/heads/qa/staging-oidc-reminder-e2e-20261024'
          test "$SERVICE_ACCOUNT" = 'idogs-staging-sms-qa-writer@idogs-app-staging.iam.gserviceaccount.com'
          test "$PROVIDER" = 'projects/530003937245/locations/global/workloadIdentityPools/github-sms-qa-writer/providers/github-actions'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build and reminder regression QA at this SHA
        run: |
          npm run build
          npx vitest run scripts/sms-scheduler-handler-e2e.test.js scripts/sms-firestore-quota-e2e.test.js scripts/sms-reminder-scheduler-gates.test.js scripts/clicksend-sms.test.js scripts/settings-sms-preferences.test.js
          node scripts/test-settings-role-gating.mjs
      - name: Obtain short-lived staging OIDC token (no private key)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/530003937245/locations/global/workloadIdentityPools/github-sms-qa-writer/providers/github-actions
          service_account: idogs-staging-sms-qa-writer@idogs-app-staging.iam.gserviceaccount.com
          project_id: idogs-app-staging
          create_credentials_file: true
          export_environment_variables: true
      - name: Real staging Firestore QA E2E; provider is mocked
        env:
          GOOGLE_CLOUD_PROJECT: idogs-app-staging
        run: node scripts/qa-staging-oidc-reminder-e2e.mjs
      - name: Preserve exact-SHA staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-sms-e2e-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-artifacts/staging-sms-e2e.json
          if-no-files-found: warn
