name: Preview staging GST 20260829

on:
  push:
    branches:
      - fix/staging-checkout-gst-20260829
    paths:
      - .github/workflows/preview-staging-gst-20260829.yml

permissions:
  contents: read

jobs:
  preview-gst:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact GST product SHA
        uses: actions/checkout@v4
        with:
          ref: 7f60c1a025fe9028b58c1022b6a318f9da83bf5c
          fetch-depth: 0

      - name: Fail closed on exact source and GST scope
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='7f60c1a025fe9028b58c1022b6a318f9da83bf5c'
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
          grep -q "txr_1U9b6XGHgBd6ZgJEwaS4bfLx" api/_lib/checkout-handler.js
          grep -q "default_tax_rates" api/_lib/checkout-handler.js

      - name: Install dependencies
        run: npm ci

      - name: Targeted GST checkout regression
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createCheckoutHandler, CHECKOUT_PRICE_IDS } from './api/_lib/checkout-handler.js'

          function res() {
            const r = { statusCode: 0, body: null }
            r.status = code => { r.statusCode = code; return r }
            r.json = body => { r.body = body; return r }
            return r
          }

          async function checkoutFor(projectId, plan) {
            const original = process.env.FIREBASE_PROJECT_ID
            process.env.FIREBASE_PROJECT_ID = projectId
            let captured
            const handler = createCheckoutHandler({
              getAppUrl: () => projectId === 'idogs-app-staging' ? 'https://idogs-app-staging.vercel.app' : 'https://idogs.com.au',
              verifyIdToken: async () => ({ uid: 'qa-user', email: 'qa@example.com' }),
              createSession: async params => { captured = params; return { url: 'https://checkout.stripe.test' } },
            })
            const response = res()
            await handler({ method: 'POST', headers: { authorization: 'Bearer test' }, body: { plan } }, response)
            if (original === undefined) delete process.env.FIREBASE_PROJECT_ID
            else process.env.FIREBASE_PROJECT_ID = original
            if (response.statusCode !== 200) throw new Error(`Checkout failed for ${projectId}/${plan}`)
            return captured
          }

          const stagingMonthly = await checkoutFor('idogs-app-staging', 'plus_monthly')
          if (stagingMonthly.line_items[0].price !== 'price_1U9YwuGHgBd6ZgJEX1Bdjz5x') throw new Error('Wrong staging monthly price')
          if (stagingMonthly.subscription_data.default_tax_rates?.[0] !== 'txr_1U9b6XGHgBd6ZgJEwaS4bfLx') throw new Error('Missing staging GST tax rate')

          const stagingAnnual = await checkoutFor('idogs-app-staging', 'plus_annual')
          if (stagingAnnual.line_items[0].price !== 'price_1U9ZPRGHgBd6ZgJEzFCtnfEK') throw new Error('Wrong staging annual price')
          if (stagingAnnual.subscription_data.default_tax_rates?.[0] !== 'txr_1U9b6XGHgBd6ZgJEwaS4bfLx') throw new Error('Missing annual GST tax rate')

          const production = await checkoutFor('idogs-app', 'plus_monthly')
          if (production.line_items[0].price !== 'price_1TxMJ9GHgBd6ZgJEcwyahH58') throw new Error('Wrong production monthly price')
          if ('default_tax_rates' in production.subscription_data) throw new Error('Test GST tax rate leaked to production')

          process.env.FIREBASE_PROJECT_ID = 'idogs-app-staging'
          if (CHECKOUT_PRICE_IDS.plus_monthly !== 'price_1U9YwuGHgBd6ZgJEX1Bdjz5x') throw new Error('Staging monthly resolver mismatch')
          if (CHECKOUT_PRICE_IDS.plus_annual !== 'price_1U9ZPRGHgBd6ZgJEzFCtnfEK') throw new Error('Staging annual resolver mismatch')
          console.log('PASS: staging GST checkout routing')
          NODE

      - name: Build and focused regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-billing-payments-phase1.mjs
          node scripts/test-billing-navigation.mjs
          node scripts/test-sms-addon-v1.mjs
          node scripts/test-webhook-handler.mjs
          npm run build

      - name: Link iDogs staging project only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"projectId":"prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o","orgId":"team_oZF1Z0BUEceb9fAXdmFV1Saz","projectName":"idogs-app-staging"}
          JSON

      - name: Pull staging settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects

      - name: Re-verify exact source before Preview deploy
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='7f60c1a025fe9028b58c1022b6a318f9da83bf5c'
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git diff --cached --name-only)"
          mapfile -t changed < <(git diff --name-only)
          if (( ${#changed[@]} == 1 )) && [[ "${changed[0]}" == "package-lock.json" ]]; then
            git restore --source=HEAD -- package-lock.json
          elif (( ${#changed[@]} != 0 )); then
            printf 'Unexpected tracked drift before Preview deploy:\n%s\n' "${changed[@]}"
            exit 1
          fi
          test -z "$(git status --porcelain)"

      - name: Deploy exact source to Preview only
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --yes --archive=tgz --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects
