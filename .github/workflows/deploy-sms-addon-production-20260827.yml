name: Deploy approved SMS Add-on release to production

on:
  push:
    branches:
      - ops/deploy-sms-addon-production-20260827
    paths:
      - .github/workflows/deploy-sms-addon-production-20260827.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact approved production SHA
        uses: actions/checkout@v4
        with:
          ref: f09ff74eac93669ec5e40b975a31e9d5f81cbfb5
          fetch-depth: 0

      - name: Fail closed on exact source
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='f09ff74eac93669ec5e40b975a31e9d5f81cbfb5'
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
          echo "Deploying exact approved SHA $EXPECTED"

      - name: Install dependencies
        run: npm ci

      - name: Run production release regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-billing-p0-security.mjs
          node scripts/test-billing-payments-phase1.mjs
          node scripts/test-billing-navigation.mjs
          node scripts/test-sms-addon-v1.mjs
          node scripts/test-webhook-handler.mjs
          npm run build

      - name: Verify Vercel token is available
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"

      - name: Link exact production project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"projectId":"prj_UsnGhC1BWtYnmF5rKMYBR9KWkbIo","orgId":"team_oZF1Z0BUEceb9fAXdmFV1Saz","projectName":"idogs-app"}
          JSON

      - name: Verify live SMS price env exists on exact production project
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          OUT="$(npx --yes vercel@latest env ls production --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects 2>&1)"
          printf '%s\n' "$OUT" | grep -q 'STRIPE_SMS_ADDON_PRICE_ID'

      - name: Pull production project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects

      - name: Build exact production release
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects

      - name: Re-verify exact source and restore known lockfile side effect
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='f09ff74eac93669ec5e40b975a31e9d5f81cbfb5'
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git diff --cached --name-only)"

          mapfile -t changed < <(git diff --name-only)
          if (( ${#changed[@]} == 1 )) && [[ "${changed[0]}" == "package-lock.json" ]]; then
            echo 'Vercel local build modified only package-lock.json; restoring exact committed lockfile.'
            git restore --source=HEAD -- package-lock.json
          elif (( ${#changed[@]} != 0 )); then
            printf 'Unexpected tracked drift after build:\n'
            printf '%s\n' "${changed[@]}"
            exit 1
          fi

          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$EXPECTED"

      - name: Deploy exact source to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prod --yes --archive=tgz --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects
