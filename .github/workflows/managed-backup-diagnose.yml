name: Read-only approved managed QA cleanup diagnosis
on:
  push:
    branches: [release/ios-app-store-20261025]
    paths: ['scripts/qa/managed-backup-diagnose.mjs', '.github/workflows/managed-backup-diagnose.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: managed-backup-manifest
          run-id: 40655659645
          github-token: ${{ github.token }}
      - name: Read only exact approved QA resource metadata and operations
        env:
          IDOGS_MANAGED_BACKUP_APPROVAL: 2026-10-28-two-databases-one-backup
          IDOGS_STAGING_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.IDOGS_STAGING_FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/qa/managed-backup-diagnose.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-backup-diagnosis
          path: managed-backup-diagnosis.json
          if-no-files-found: ignore
          retention-days: 14
