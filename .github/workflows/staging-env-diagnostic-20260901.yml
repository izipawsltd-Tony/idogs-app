name: Stable Staging Env Diagnostic 20260901

on:
  push:
    branches:
      - automation/staging-env-diagnostic-20260901

jobs:
  classify-staging-env:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact integration candidate
        uses: actions/checkout@v4
        with:
          ref: 0d862888c17dafc3311ae2d8127f199fb6fe9945
          fetch-depth: 1

      - name: Link stable staging project only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0d862888c17dafc3311ae2d8127f199fb6fe9945"
          mkdir -p .vercel
          printf '%s\n' '{"projectId":"prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o","orgId":"team_oZF1Z0BUEceb9fAXdmFV1Saz","projectName":"idogs-app-staging"}' > .vercel/project.json
          echo PROJECT_CLASS=stable-staging

      - name: Pull env read-only and classify escaped patterns
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects >/tmp/staging-pull.log 2>&1
          ENV_FILE=.vercel/.env.production.local
          test -f "$ENV_FILE"
          echo VERCEL_PULL_CLASS=success
          echo ENV_FILE_CLASS=present

          line_for() { grep -E "^$1=" "$ENV_FILE" | tail -1 || true; }

          firebase_line=$(line_for FIREBASE_PROJECT_ID)
          if [ -z "$firebase_line" ]; then
            echo FIREBASE_PROJECT_ID_CLASS=missing
          elif printf '%s' "$firebase_line" | grep -Fq 'idogs-app-staging'; then
            echo FIREBASE_PROJECT_ID_CLASS=staging
          elif printf '%s' "$firebase_line" | grep -Eq 'idogs-app([^a-zA-Z0-9_-]|$)'; then
            echo FIREBASE_PROJECT_ID_CLASS=production
          else
            echo FIREBASE_PROJECT_ID_CLASS=other
          fi

          extra_line=$(line_for EXTRA_LITTER_CHECKOUT_ENABLED)
          if [ -z "$extra_line" ]; then
            echo EXTRA_LITTER_CHECKOUT_ENABLED_CLASS=missing
          elif printf '%s' "$extra_line" | grep -Eiq '=(["'"']?)(true)(\\n)?\1$'; then
            echo EXTRA_LITTER_CHECKOUT_ENABLED_CLASS=true
          elif printf '%s' "$extra_line" | grep -Eiq '=(["'"']?)(false)(\\n)?\1$'; then
            echo EXTRA_LITTER_CHECKOUT_ENABLED_CLASS=false
          else
            echo EXTRA_LITTER_CHECKOUT_ENABLED_CLASS=other
          fi

          stripe_line=$(line_for STRIPE_SECRET_KEY)
          if [ -z "$stripe_line" ]; then
            echo STRIPE_SECRET_KEY_CLASS=missing
          elif printf '%s' "$stripe_line" | grep -Fq 'sk_test_'; then
            echo STRIPE_SECRET_KEY_CLASS=test
          elif printf '%s' "$stripe_line" | grep -Fq 'sk_live_'; then
            echo STRIPE_SECRET_KEY_CLASS=live
          else
            echo STRIPE_SECRET_KEY_CLASS=other
          fi

          app_line=$(line_for APP_URL)
          if [ -z "$app_line" ]; then
            echo APP_URL_CLASS=missing
          elif printf '%s' "$app_line" | grep -Fq 'idogs-app-staging.vercel.app'; then
            echo APP_URL_CLASS=stable-staging
          elif printf '%s' "$app_line" | grep -Fq 'idogs.com.au'; then
            echo APP_URL_CLASS=production
          else
            echo APP_URL_CLASS=other
          fi

          echo DIAGNOSTIC_READ_ONLY=PASS
