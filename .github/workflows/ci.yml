name: iDogs CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idogs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: |
          npm test
          node --test scripts/test-legacy-history-recovery.mjs
          node scripts/test-webhook-handler.mjs
          node scripts/test-sms-addon-v1.mjs
          node scripts/test-showcase-media-pipeline.mjs
          node scripts/test-showcase-v2.mjs
          node scripts/test-showcase-private-dog-access.mjs
          node scripts/test-showcase-public-page.mjs
          node scripts/test-litter-showcase-public.mjs

      - name: Production build
        run: npm run build

  rules-emulator:
    name: Firestore Rules emulator (dog-scoped record ownership)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Run Firestore Rules emulator test
        env:
          GCLOUD_PROJECT: demo-idogs-rules-test
        run: >-
          npx --yes firebase-tools@14.12.0 emulators:exec
          --project demo-idogs-rules-test --only firestore
          'node scripts/test-documents-rules-emulator.mjs'

  email-password-link-emulator:
    name: Email/password link Firebase Emulator E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Run isolated Firebase Auth and Firestore E2E
        env:
          GCLOUD_PROJECT: demo-idogs-email-link
        run: >-
          npx --yes firebase-tools@14.12.0 emulators:exec
          --project demo-idogs-email-link --only auth,firestore
          'node scripts/test-email-password-link-emulator.mjs'

  # ── Agent automation (claude/* PRs only) ────────────────────────────────
  release-control:
    name: release-control
    needs: [verify, rules-emulator, email-password-link-emulator]
    if: always() && github.event_name == 'pull_request' && startsWith(github.head_ref, 'claude/')
    permissions:
      contents: read
      issues: write
      pull-requests: read
      checks: read
      statuses: read
      actions: read
      deployments: read
    uses: ./.github/workflows/release-control.yml
    with:
      event: CI finished on PR

  auto-fix:
    name: auto-fix
    needs: [verify, rules-emulator, email-password-link-emulator]
    if: >-
      failure() && github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'claude/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'agent:claude') &&
      !contains(github.event.pull_request.labels.*.name, 'agent:hold')
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    uses: ./.github/workflows/claude-autofix.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      branch: ${{ github.head_ref }}
      failing_run_id: ${{ github.run_id }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
