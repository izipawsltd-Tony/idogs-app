name: iDogs CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idogs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: |
          npm test
          node --test scripts/control-center-*.test.mjs
          node --test scripts/test-legacy-history-recovery.mjs
          node scripts/test-webhook-handler.mjs
          node scripts/test-sms-addon-v1.mjs
          node scripts/test-showcase-media-pipeline.mjs
          node scripts/test-showcase-v2.mjs
          node scripts/test-showcase-private-dog-access.mjs
          node scripts/test-showcase-public-page.mjs
          node scripts/test-litter-showcase-public.mjs

      - name: Production build
        run: npm run build

      - name: Mobile performance budget (public entry bundle)
        run: node scripts/perf/bundle-budget.mjs

  documents-live-rules-emulator:
    name: Documents actions + hardened Firestore rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Run Firestore emulator test
        env:
          GCLOUD_PROJECT: demo-idogs-live-rules
        run: >-
          npx --yes firebase-tools@14.12.0 emulators:exec
          --project demo-idogs-live-rules --only firestore
          'node scripts/test-documents-actions-live-rules-emulator.mjs'
      - name: Hardened rules — ownership keys immutable, least privilege
        env:
          GCLOUD_PROJECT: demo-idogs-rules-test
        run: >-
          npx --yes firebase-tools@14.12.0 emulators:exec
          --project demo-idogs-rules-test --only firestore
          'node scripts/test-documents-rules-emulator.mjs'

  email-password-link-emulator:
    name: Email/password sign-in for SMS accounts (Auth+Firestore emulator E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Run isolated Firebase Auth and Firestore E2E
        env:
          GCLOUD_PROJECT: demo-idogs-email-link
        run: >-
          npx --yes firebase-tools@14.12.0 emulators:exec
          --project demo-idogs-email-link --only auth,firestore
          'node scripts/test-email-password-link-emulator.mjs'

  sms-email-journey:
    name: Journey E2E — SMS signup → verify email → add dog → set password → email login (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_FIREBASE_EMULATOR: '1'
      VITE_FIREBASE_API_KEY: emulator-only-key
      VITE_FIREBASE_AUTH_DOMAIN: localhost
      VITE_FIREBASE_PROJECT_ID: demo-idogs-journey
      VITE_FIREBASE_STORAGE_BUCKET: demo-idogs-journey.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '1'
      VITE_FIREBASE_APP_ID: '1:1:web:1'
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build (emulator-only flag, never used by Preview/Production)
        run: npx vite build
      - name: Run journey against Auth + Firestore emulators and real api handlers
        env:
          GCLOUD_PROJECT: demo-idogs-journey
        run: >-
          npx --yes firebase-tools@14.12.0 emulators:exec
          --project demo-idogs-journey --only auth,firestore
          'npx playwright test -c playwright.journey.config.ts'
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-report
          path: playwright-report-journey
          retention-days: 14

  marketing-consent-browser:
    name: Consent UI real-browser check (mobile CTAs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Dummy public-config values: the marketing pages under test make no
      # Firebase calls; nothing here reaches a real project.
      VITE_FIREBASE_API_KEY: ci-placeholder-api-key
      VITE_FIREBASE_AUTH_DOMAIN: localhost
      VITE_FIREBASE_PROJECT_ID: idogs-app
      VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder
      VITE_FIREBASE_MESSAGING_SENDER_ID: '1'
      VITE_FIREBASE_APP_ID: '1:1:web:1'
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build
        run: npx vite build
      - name: Real-browser consent / CTA + synthetic signup funnel checks (320–430px, landscape, Android)
        run: npm run test:e2e:local
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consent-browser-report
          path: playwright-report-local
          retention-days: 14
