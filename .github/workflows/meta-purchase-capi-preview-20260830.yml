name: Deploy Meta Purchase CAPI Preview

on:
  push:
    branches:
      - automation/meta-purchase-capi-preview-20260830
    paths:
      - .github/workflows/meta-purchase-capi-preview-20260830.yml

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact product SHA
        uses: actions/checkout@v4
        with:
          ref: 56d64a3766bd927a0c8349e2032f84ba93f00365
          fetch-depth: 0

      - name: Fail closed on exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '56d64a3766bd927a0c8349e2032f84ba93f00365'
          test -z "$(git status --porcelain)"
          test "$(git diff --name-only 00d3fbf1eb446ec4276e6c3c261508b21e4e2192..HEAD | sort)" = $'api/_lib/meta-capi.js\napi/stripe-webhook.js'
          grep -q "Purchase" api/_lib/meta-capi.js
          grep -q "createMetaInvoiceProcessor" api/stripe-webhook.js

      - name: Install dependencies and build
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Link exact staging project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"projectId":"prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o","orgId":"team_oZF1Z0BUEceb9fAXdmFV1Saz","projectName":"idogs-app-staging"}
          JSON
          grep -q 'prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o' .vercel/project.json
          grep -q 'idogs-app-staging' .vercel/project.json

      - name: Deploy exact product SHA to Preview only
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test "$(git rev-parse HEAD)" = '56d64a3766bd927a0c8349e2032f84ba93f00365'
          test -z "$(git status --porcelain --untracked-files=no)"
          npx --yes vercel@latest deploy --yes --archive=tgz --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects
          echo 'Preview only: no --prod and no stable alias promotion.'
