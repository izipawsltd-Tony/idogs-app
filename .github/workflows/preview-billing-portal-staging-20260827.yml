name: Promote SMS remove fix to stable staging

on:
  push:
    branches:
      - fix/billing-portal-staging-20260827
    paths:
      - .github/workflows/preview-billing-portal-staging-20260827.yml

permissions:
  contents: read

jobs:
  stable-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact approved fix SHA
        uses: actions/checkout@v4
        with:
          ref: 5d7298ac375d3993be06a5e326ec87939fa8234e
          fetch-depth: 0

      - name: Fail closed on exact source
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='5d7298ac375d3993be06a5e326ec87939fa8234e'
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"

      - name: Install dependencies
        run: npm ci

      - name: Run billing and SMS regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-billing-p0-security.mjs
          node scripts/test-billing-payments-phase1.mjs
          node scripts/test-billing-navigation.mjs
          node scripts/test-sms-addon-v1.mjs
          node scripts/test-webhook-handler.mjs
          npm run build

      - name: Link exact staging project only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"projectId":"prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o","orgId":"team_oZF1Z0BUEceb9fAXdmFV1Saz","projectName":"idogs-app-staging"}
          JSON

      - name: Pull stable staging settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects

      - name: Re-verify exact source before deploy
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='5d7298ac375d3993be06a5e326ec87939fa8234e'
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git diff --cached --name-only)"
          mapfile -t changed < <(git diff --name-only)
          if (( ${#changed[@]} == 1 )) && [[ "${changed[0]}" == "package-lock.json" ]]; then
            git restore --source=HEAD -- package-lock.json
          elif (( ${#changed[@]} != 0 )); then
            printf 'Unexpected tracked drift before stable staging deploy:\n%s\n' "${changed[@]}"
            exit 1
          fi
          test -z "$(git status --porcelain)"

      - name: Deploy exact source to stable staging
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prod --yes --archive=tgz --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects
