name: SMS Add-on V1 CI

on:
  push:
    branches: ['feature/sms-addon-v1']
  pull_request:
    branches: [master]
    paths:
      - 'api/**'
      - 'src/**'
      - 'firestore.rules'
      - 'scripts/test-sms-addon-v1.mjs'
      - 'docs/SMS_Addon_Product_Spec_V1.md'
      - '.github/workflows/sms-addon-v1-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node scripts/test-sms-addon-v1.mjs
      - run: npm run build
