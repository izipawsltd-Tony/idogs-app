name: Litter feature Preview gate

on:
  push:
    branches:
      - feat/litter-quota-extra-credit-20260901

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/litter-quota-extra-credit-20260901
          fetch-depth: 0

      - name: Patch candidate UI and stale structural tests
        shell: python
        run: |
          from pathlib import Path

          def ensure_replaced(path, old, new):
              p = Path(path)
              text = p.read_text()
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 1 and new_count == 0:
                  p.write_text(text.replace(old, new, 1))
                  return
              if old_count == 0 and new_count == 1:
                  return
              raise SystemExit(f'{path}: expected one old or one new match; old={old_count}, new={new_count}: {old[:80]}')

          ensure_replaced(
              'src/pages/BillingPage.tsx',
              "  '1 litter per 12 months',\n",
              "  '2 litters per rolling 12 months',\n  'Extra litters A$39 each',\n",
          )

          ensure_replaced(
              'src/pages/LandingPage.tsx',
              'Plans from A$5/month · No complicated pricing.',
              'Plans from A$7/month · No complicated pricing.',
          )
          ensure_replaced(
              'src/pages/LandingPage.tsx',
              '                  <li>Breeder tools for dogs, litters and puppies</li>\n',
              '                  <li>Breeder tools for dogs, litters and puppies</li>\n                  <li>2 litters per rolling 12 months included</li>\n                  <li>Extra litters A$39 each</li>\n',
          )

          ensure_replaced(
              'src/pages/LittersPage.tsx',
              "import { useAuth } from '../hooks/useAuth'\n",
              "import { useAuth } from '../hooks/useAuth'\nimport ExtraLitterButton from '../components/ExtraLitterButton'\n",
          )
          ensure_replaced(
              'src/pages/LittersPage.tsx',
              '        <button className="btn btn-primary" onClick={() => setShowCreate(!showCreate)}>+ New litter</button>\n',
              '        <div style={{ display: \'flex\', alignItems: \'center\', gap: 10 }}>\n          <ExtraLitterButton toast={toast} />\n          <button className="btn btn-primary" onClick={() => setShowCreate(!showCreate)}>+ New litter</button>\n        </div>\n',
          )

          ensure_replaced(
              'src/types/index.ts',
              'export interface Litter {\n  id: string\n  tenantId: string\n',
              'export interface Litter {\n  id: string\n  tenantId: string\n  breederProfileId?: string\n',
          )

          ensure_replaced(
              'scripts/test-pricing-integration-checks.mjs',
              "check('create-litter.js enforces the rolling-window check against the immutable ledger, not the live litters collection', createLitterSource.includes('hasLitterWithinRollingWindow(tx, db, uid, whelpingDate)'))",
              "check('create-litter.js enforces Breeder Profile rolling-window quota via the shared 2-litter/credit decision and permanent ledger', createLitterSource.includes('decideLitterQuotaTx(tx, db, {') && createLitterSource.includes('writeLitterQuotaLedgerEntry(tx, db, {'))",
          )
          ensure_replaced(
              'scripts/test-pricing-integration-checks.mjs',
              "check('update-litter.js re-runs the SAME rolling-window check on first-time activation via update (not just at create), self-excluded (Codex H7)', updateLitterSource.includes('hasLitterWithinRollingWindow(tx, db, uid, safePatch.actualBirthDate, litterId)'))",
              "check('update-litter.js re-runs the SAME Breeder Profile quota decision on first-time activation via update, self-excluded', updateLitterSource.includes('decideLitterQuotaTx(tx, db, {') && updateLitterSource.includes('excludeLitterId: litterId') && updateLitterSource.includes('writeLitterQuotaLedgerEntry(tx, db, {'))",
          )

      - name: Install dependencies
        run: npm ci

      - name: Syntax checks
        run: |
          node --check api/_lib/breeder-profile.js
          node --check api/_lib/litter-quota.js
          node --check api/_lib/extra-litter-checkout-handler.js
          node --check api/_lib/extra-litter-webhook.js
          node --check api/create-litter.js
          node --check api/update-litter.js
          node --check api/create-extra-litter-checkout.js
          node --check api/litter-quota-summary.js
          node --check api/stripe-webhook.js

      - name: Feature regressions
        run: |
          node scripts/test-breeder-profile-identity.mjs
          node scripts/test-litter-quota.mjs
          node scripts/test-extra-litter-checkout.mjs
          node scripts/test-extra-litter-webhook.mjs
          node scripts/test-litter-pricing-policy.mjs

      - name: Existing litter regressions
        run: |
          node scripts/test-litter-dob-policy.mjs
          echo "Skipping test-litter-delete-cleanup.mjs: emulator-only integration suite; no emulator is started in this gate."
          echo "Skipping test-h7-litter-delete-ledger-backfill.mjs: emulator-only integration suite; no emulator is started in this gate."
          node scripts/test-litter-create-client-dto.mjs
          node scripts/test-internal-entitlement.mjs

      - name: Existing billing and pricing regressions
        run: |
          node scripts/test-webhook-handler.mjs
          node scripts/test-billing-payments-phase1.mjs
          node scripts/test-pricing-integration-checks.mjs
          node scripts/test-landing-pricing-ui.mjs
          node scripts/test-sidebar-billing-sync.mjs

      - name: Build
        run: npm run build

      - name: Commit candidate only after all gates pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/BillingPage.tsx src/pages/LandingPage.tsx src/pages/LittersPage.tsx src/types/index.ts scripts/test-pricing-integration-checks.mjs
          if git diff --cached --quiet; then
            echo "No candidate changes to commit"
          else
            git commit -m "feat(litters): expose two-litter pricing and extra litter CTA"
            git push origin HEAD:feat/litter-quota-extra-credit-20260901
          fi
