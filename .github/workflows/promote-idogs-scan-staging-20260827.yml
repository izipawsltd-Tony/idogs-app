name: Promote iDogs Scan to stable staging

on:
  push:
    branches:
      - ops/promote-idogs-scan-staging-20260827

jobs:
  promote-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact approved product SHA
        uses: actions/checkout@v4
        with:
          ref: e7085c35bc41e99ccbf24db640d7214fb04a78c9
          fetch-depth: 0

      - name: Fail closed on exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e7085c35bc41e99ccbf24db640d7214fb04a78c9"
          test -z "$(git status --porcelain)"
          grep -Fq 'iDogs SCAN LIVES HERE' src/pages/LandingPage.tsx
          if grep -Fq 'AI Scan lives here' src/pages/LandingPage.tsx; then
            echo 'Old AI Scan label still present'
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Link exact staging project
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx vercel link --yes --token "$VERCEL_TOKEN" --scope izipawsltd-tonys-projects --project idogs-app-staging
          node -e 'const p=require("./.vercel/project.json"); if(p.projectId!=="prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o"||p.orgId!=="team_oZF1Z0BUEceb9fAXdmFV1Saz"||p.projectName!=="idogs-app-staging") process.exit(1); console.log(p)'

      - name: Promote exact source to stable staging
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx vercel deploy --prod --yes --token "$VERCEL_TOKEN" --scope izipawsltd-tonys-projects
