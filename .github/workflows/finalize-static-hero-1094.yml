name: Diagnose staged Hero 1094

on:
  push:
    branches:
      - feature/landing-static-hero-cooper
    paths:
      - '.github/workflows/finalize-static-hero-1094.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/landing-static-hero-cooper
      - name: Inspect staged base64
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import string, base64, hashlib
          p=Path('public/hero-idogs-cooper-1094.jpg')
          raw=p.read_bytes()
          print('file_bytes', len(raw))
          print('head', repr(raw[:40]))
          print('tail', repr(raw[-40:]))
          allowed=set(b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=\r\n\t ')
          bad=[(i,b) for i,b in enumerate(raw) if b not in allowed]
          print('bad_count',len(bad))
          print('first_bad',bad[:30])
          for i,b in bad[:10]: print('context',i,repr(raw[max(0,i-30):i+31]))
          compact=b''.join(raw.split())
          try:
            dec=base64.b64decode(compact, validate=False)
            print('decoded_bytes',len(dec))
            print('decoded_sha256',hashlib.sha256(dec).hexdigest())
            print('jpeg_head_tail',repr(dec[:4]),repr(dec[-4:]))
          except Exception as e:
            print('decode_error',repr(e))
          PY
