name: One-time staging billing reset direct Firebase

on:
  push:
    branches:
      - ops/sms-billing-reset-preview-20260826

permissions:
  contents: read

jobs:
  reset-staging-billing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_PROJECT_ID: idogs-app-staging
      TARGET_EMAIL: idogsbreeder@gmail.com
    steps:
      - name: Verify staging-only gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FIREBASE_PROJECT_ID" = "idogs-app-staging"
          test "$TARGET_EMAIL" = "idogsbreeder@gmail.com"
          test -n "${FIREBASE_TOKEN:-}"
          echo "PASS staging-only Firebase reset gate"

      - name: Install one-time Firebase tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/idogs-reset
          cd /tmp/idogs-reset
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund firebase-admin@latest firebase-tools@14.15.2

      - name: Verify Firebase token can access staging project
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/idogs-reset
          ./node_modules/.bin/firebase projects:list --token "$FIREBASE_TOKEN" --json > /tmp/projects.json
          node - <<'NODE'
          const fs=require('fs')
          const x=JSON.parse(fs.readFileSync('/tmp/projects.json','utf8'))
          const rows=Array.isArray(x.result)?x.result:(Array.isArray(x)?x:[])
          if(!rows.some(p => p.projectId === 'idogs-app-staging')) throw new Error('STOP: staging project not accessible')
          console.log('PASS Firebase token has idogs-app-staging access')
          NODE

      - name: Reset only stale billing fields and verify
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/idogs-reset
          node - <<'NODE'
          const admin = require('firebase-admin')
          const { FieldValue } = require('firebase-admin/firestore')
          const path = require('path')
          const toolsRoot = path.dirname(require.resolve('firebase-tools/package.json'))
          const api = require(path.join(toolsRoot, 'lib', 'api.js'))

          const projectId = process.env.FIREBASE_PROJECT_ID
          const targetEmail = process.env.TARGET_EMAIL
          if(projectId !== 'idogs-app-staging' || targetEmail !== 'idogsbreeder@gmail.com') throw new Error('STOP staging-only guard')

          const credential = admin.credential.refreshToken({
            type: 'authorized_user',
            client_id: api.clientId,
            client_secret: api.clientSecret,
            refresh_token: process.env.FIREBASE_TOKEN,
          })
          admin.initializeApp({ credential, projectId })

          ;(async () => {
            const authUser = await admin.auth().getUserByEmail(targetEmail)
            const db = admin.firestore()
            const ref = db.collection('users').doc(authUser.uid)
            const snap = await ref.get()
            if(!snap.exists) throw new Error('STOP: target Firestore profile not found')
            const before = snap.data() || {}

            const staleKeys = ['stripeCustomerId','stripeSubscriptionId','smsStripeSubscriptionId','smsStripePriceId']
            const alreadyReset = before.plan === 'free' && before.subscriptionStatus === 'inactive' && !staleKeys.some(k => Object.prototype.hasOwnProperty.call(before,k))

            if(!alreadyReset) {
              const deleteFields = [
                'stripeCustomerId','stripeSubscriptionId','trialEndsAt','planActivatedAt','pastDueSince','billingInterval',
                'scanPeriodAnchorDay','plusScansUsed','plusScansPeriodStart','lastKnownSubscriptionId',
                'subscriptionEventTimestamps','plusScansSubscriptionId','smsAddonStatus','smsStripeSubscriptionId',
                'smsStripePriceId','smsPeriodStart','smsPeriodEnd','smsCreditsLimit','smsCreditsUsed','smsLastBillingEventAt'
              ]
              const update = {
                plan: 'free',
                subscriptionStatus: 'inactive',
                billingResetAt: new Date().toISOString(),
                billingResetReason: 'staging_qa_wrong_stripe_sandbox_mapping',
              }
              for(const field of deleteFields) update[field] = FieldValue.delete()
              await ref.update(update)
            }

            const after = (await ref.get()).data() || {}
            const stale = staleKeys.filter(k => Object.prototype.hasOwnProperty.call(after,k))
            if(after.plan !== 'free') throw new Error('VERIFY plan is not free')
            if(after.subscriptionStatus !== 'inactive') throw new Error('VERIFY subscriptionStatus is not inactive')
            if(stale.length) throw new Error('VERIFY stale billing IDs remain')
            if(before.email && after.email !== before.email) throw new Error('VERIFY unrelated email field changed')

            console.log('PASS staging billing reset verified', JSON.stringify({
              target: targetEmail,
              projectId,
              alreadyReset,
              plan: after.plan,
              subscriptionStatus: after.subscriptionStatus,
              staleBillingIdsPresent: false,
            }))
          })().catch(err => { console.error(err?.message || err); process.exit(1) })
          NODE
