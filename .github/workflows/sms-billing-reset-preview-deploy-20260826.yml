name: One-time staging billing reset direct Firebase

on:
  push:
    branches:
      - ops/sms-billing-reset-preview-20260826

permissions:
  contents: read

jobs:
  reset-staging-billing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_PROJECT_ID: idogs-app-staging
      TARGET_EMAIL: idogsbreeder@gmail.com
    steps:
      - name: Verify staging-only gate
        shell: bash
        run: |
          set -euo pipefail
          test "$FIREBASE_PROJECT_ID" = "idogs-app-staging"
          test "$TARGET_EMAIL" = "idogsbreeder@gmail.com"
          test -n "${FIREBASE_TOKEN:-}"
          echo "PASS staging-only Firebase reset gate"

      - name: Install one-time Firebase tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/idogs-reset
          cd /tmp/idogs-reset
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund firebase-tools@14.15.2

      - name: Verify Firebase token can access staging project
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/idogs-reset
          ./node_modules/.bin/firebase projects:list --token "$FIREBASE_TOKEN" --json > /tmp/projects.json
          node - <<'NODE'
          const fs=require('fs')
          const x=JSON.parse(fs.readFileSync('/tmp/projects.json','utf8'))
          const rows=Array.isArray(x.result)?x.result:(Array.isArray(x)?x:[])
          if(!rows.some(p => p.projectId === 'idogs-app-staging')) throw new Error('STOP: staging project not accessible')
          console.log('PASS Firebase token has idogs-app-staging access')
          NODE

      - name: Reset only stale billing fields and verify
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/idogs-reset
          node - <<'NODE'
          const path = require('path')
          const toolsRoot = path.dirname(require.resolve('firebase-tools/package.json'))
          const api = require(path.join(toolsRoot, 'lib', 'api.js'))

          const projectId = process.env.FIREBASE_PROJECT_ID
          const targetEmail = process.env.TARGET_EMAIL
          const refreshToken = process.env.FIREBASE_TOKEN
          if(projectId !== 'idogs-app-staging' || targetEmail !== 'idogsbreeder@gmail.com') throw new Error('STOP staging-only guard')
          if(!refreshToken) throw new Error('STOP: FIREBASE_TOKEN missing')
          if(typeof api.clientId !== 'function' || typeof api.clientSecret !== 'function') throw new Error('STOP: unexpected firebase-tools API credential exports')

          const deleteFields = [
            'stripeCustomerId','stripeSubscriptionId','trialEndsAt','planActivatedAt','pastDueSince','billingInterval',
            'scanPeriodAnchorDay','plusScansUsed','plusScansPeriodStart','lastKnownSubscriptionId',
            'subscriptionEventTimestamps','plusScansSubscriptionId','smsAddonStatus','smsStripeSubscriptionId',
            'smsStripePriceId','smsPeriodStart','smsPeriodEnd','smsCreditsLimit','smsCreditsUsed','smsLastBillingEventAt'
          ]
          const intendedFields = new Set(['plan','subscriptionStatus', ...deleteFields])
          const staleKeys = ['stripeCustomerId','stripeSubscriptionId','smsStripeSubscriptionId','smsStripePriceId']

          const stable = (value) => {
            if(Array.isArray(value)) return value.map(stable)
            if(value && typeof value === 'object') return Object.fromEntries(Object.keys(value).sort().map(k => [k, stable(value[k])]))
            return value
          }
          const stripIntended = (fields) => Object.fromEntries(Object.entries(fields || {}).filter(([k]) => !intendedFields.has(k)))

          async function jsonFetch(url, options={}) {
            const res = await fetch(url, options)
            const text = await res.text()
            let body = null
            try { body = text ? JSON.parse(text) : null } catch { body = text }
            if(!res.ok) throw new Error(`HTTP ${res.status} ${url}: ${typeof body === 'string' ? body : JSON.stringify(body)}`)
            return body
          }

          ;(async () => {
            const tokenBody = await jsonFetch('https://oauth2.googleapis.com/token', {
              method: 'POST',
              headers: {'content-type':'application/x-www-form-urlencoded'},
              body: new URLSearchParams({
                client_id: api.clientId(),
                client_secret: api.clientSecret(),
                refresh_token: refreshToken,
                grant_type: 'refresh_token',
              }),
            })
            const accessToken = tokenBody?.access_token
            if(!accessToken) throw new Error('STOP: OAuth access token missing')
            const authHeaders = {authorization:`Bearer ${accessToken}`, 'content-type':'application/json'}

            const lookupUrl = `https://identitytoolkit.googleapis.com/v1/projects/${projectId}/accounts:lookup`
            const lookup = await jsonFetch(lookupUrl, {
              method:'POST',
              headers:authHeaders,
              body:JSON.stringify({email:[targetEmail]}),
            })
            const users = Array.isArray(lookup?.users) ? lookup.users : []
            if(users.length !== 1) throw new Error(`STOP: expected exactly one Auth user for ${targetEmail}, found ${users.length}`)
            const authUser = users[0]
            if(authUser.email !== targetEmail || !authUser.localId) throw new Error('STOP: Auth user email/UID mismatch')
            const uid = authUser.localId

            const base = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents`
            const docUrl = `${base}/users/${encodeURIComponent(uid)}`
            const beforeDoc = await jsonFetch(docUrl, {method:'GET', headers:authHeaders})
            if(beforeDoc.name !== `projects/${projectId}/databases/(default)/documents/users/${uid}`) throw new Error('STOP: resolved Firestore document mismatch')
            const before = beforeDoc.fields || {}

            const alreadyReset = before.plan?.stringValue === 'free' && before.subscriptionStatus?.stringValue === 'inactive' && !staleKeys.some(k => Object.prototype.hasOwnProperty.call(before,k))

            if(!alreadyReset) {
              const mask = ['plan','subscriptionStatus', ...deleteFields]
                .map(field => `updateMask.fieldPaths=${encodeURIComponent(field)}`).join('&')
              const patchUrl = `${docUrl}?${mask}`
              await jsonFetch(patchUrl, {
                method:'PATCH',
                headers:authHeaders,
                body:JSON.stringify({fields:{plan:{stringValue:'free'}, subscriptionStatus:{stringValue:'inactive'}}}),
              })
            }

            const afterDoc = await jsonFetch(docUrl, {method:'GET', headers:authHeaders})
            const after = afterDoc.fields || {}
            if(after.plan?.stringValue !== 'free') throw new Error('VERIFY plan is not free')
            if(after.subscriptionStatus?.stringValue !== 'inactive') throw new Error('VERIFY subscriptionStatus is not inactive')
            const stale = staleKeys.filter(k => Object.prototype.hasOwnProperty.call(after,k))
            if(stale.length) throw new Error(`VERIFY stale billing IDs remain: ${stale.join(',')}`)
            const deletedStillPresent = deleteFields.filter(k => Object.prototype.hasOwnProperty.call(after,k))
            if(deletedStillPresent.length) throw new Error(`VERIFY billing reset fields remain: ${deletedStillPresent.join(',')}`)

            const beforeUnrelated = JSON.stringify(stable(stripIntended(before)))
            const afterUnrelated = JSON.stringify(stable(stripIntended(after)))
            if(beforeUnrelated !== afterUnrelated) throw new Error('VERIFY unrelated user/dogs/profile fields changed')

            console.log('PASS staging billing reset verified', JSON.stringify({
              target: targetEmail,
              uid,
              projectId,
              document: beforeDoc.name,
              alreadyReset,
              plan: after.plan.stringValue,
              subscriptionStatus: after.subscriptionStatus.stringValue,
              stripeCustomerIdPresent: Object.prototype.hasOwnProperty.call(after,'stripeCustomerId'),
              stripeSubscriptionIdPresent: Object.prototype.hasOwnProperty.call(after,'stripeSubscriptionId'),
              smsStripeSubscriptionIdPresent: Object.prototype.hasOwnProperty.call(after,'smsStripeSubscriptionId'),
              smsStripePriceIdPresent: Object.prototype.hasOwnProperty.call(after,'smsStripePriceId'),
              unrelatedFieldsUnchanged: true,
            }))
          })().catch(err => { console.error(err?.stack || err?.message || err); process.exit(1) })
          NODE
