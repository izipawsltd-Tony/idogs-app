name: One-time staging billing reset execute

on:
  push:
    branches:
      - ops/sms-billing-reset-preview-20260826

permissions:
  contents: read

jobs:
  reset-staging-billing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXACT_SHA: 5f9e06e1194ed57085346322c247c3c9b5c46c22
      DEPLOYMENT_ID: dpl_3tGpFkn9mPAqPSMAwDU9s2YVP1zP
      DEPLOYMENT_URL: https://idogs-app-staging-r19ik11o8-izipawsltd-tonys-projects.vercel.app
      VERCEL_ORG_ID: team_oZF1Z0BUEceb9fAXdmFV1Saz
      VERCEL_PROJECT_ID: prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Verify READY exact-SHA staging Preview
        shell: bash
        run: |
          set -euo pipefail
          http=$(curl --silent --show-error --output /tmp/deployment.json --write-out '%{http_code}' "https://api.vercel.com/v13/deployments/${DEPLOYMENT_ID}?teamId=${VERCEL_ORG_ID}" --header "Authorization: Bearer ${VERCEL_TOKEN}")
          test "$http" = "200"
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/deployment.json','utf8'));
          const sha=x?.meta?.githubCommitSha||x?.meta?.approvedExactSha||x?.gitSource?.sha||'';
          const projectId=x?.projectId||x?.project?.id||'';
          const state=x?.readyState||x?.status||'';
          if(projectId && projectId!==process.env.VERCEL_PROJECT_ID) throw new Error('wrong project');
          if(sha!==process.env.EXACT_SHA) throw new Error('wrong sha');
          if(x?.target) throw new Error('not preview');
          if(state!=='READY') throw new Error('not ready');
          console.log('PASS exact-SHA READY staging Preview');
          NODE

      - name: Reset and verify staging billing mapping
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s","projectName":"idogs-app-staging"}\n' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          npx --yes vercel@latest curl /api/_ops-reset-staging-billing \
            --deployment "$DEPLOYMENT_URL" \
            --token "$VERCEL_TOKEN" \
            --scope izipawsltd-tonys-projects \
            -H 'x-reset-confirm: staging-idogsbreeder-reset-20260826' \
            --silent --show-error --fail-with-body > /tmp/reset.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/reset.json','utf8'));
          if(x.ok!==true||x.plan!=='free'||x.subscriptionStatus!=='inactive'||x.staleBillingIdsPresent!==false) throw new Error('reset verification failed');
          console.log('PASS billing reset verified', JSON.stringify(x));
          NODE
