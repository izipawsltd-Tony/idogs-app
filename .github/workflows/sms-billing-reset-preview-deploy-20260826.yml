name: One-time staging billing reset preview deploy

on:
  push:
    branches:
      - ops/sms-billing-reset-preview-20260826

permissions:
  contents: read

jobs:
  deploy-reset-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXACT_SHA: 500d20772b61c3b38badf91f32af0ed31fb9c07b
      VERCEL_ORG_ID: team_oZF1Z0BUEceb9fAXdmFV1Saz
      VERCEL_PROJECT_ID: prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o
      GITHUB_REPO_ID: 1270695712
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Verify staging preview gate
        shell: bash
        run: |
          set -euo pipefail
          test "$VERCEL_PROJECT_ID" = "prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o"
          test "$VERCEL_ORG_ID" = "team_oZF1Z0BUEceb9fAXdmFV1Saz"
          test "$EXACT_SHA" = "500d20772b61c3b38badf91f32af0ed31fb9c07b"
          test -n "${VERCEL_TOKEN:-}"
          echo "PASS staging preview gate"

      - name: Create exact-SHA reset preview deployment
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs"); const b={name:"idogs-app-staging",gitSource:{type:"github",ref:"ops/sms-billing-reset-preview-20260826",repoId:Number(process.env.GITHUB_REPO_ID),sha:process.env.EXACT_SHA},gitMetadata:{remoteUrl:"https://github.com/izipawsltd-Tony/idogs-app.git",commitRef:"ops/sms-billing-reset-preview-20260826",commitSha:process.env.EXACT_SHA,dirty:false,ci:true,ciType:"github-actions",ciGitProviderUsername:"izipawsltd-Tony",ciGitRepoVisibility:"public",rootDirectory:""},meta:{approvedExactSha:process.env.EXACT_SHA,sourceBranch:"ops/sms-billing-reset-preview-20260826",validationWorkflow:"one-time-staging-billing-reset-preview"}}; fs.writeFileSync("/tmp/deploy.json",JSON.stringify(b))'
          http=$(curl --silent --show-error --output /tmp/deploy-response.json --write-out '%{http_code}' \
            --request POST \
            "https://api.vercel.com/v13/deployments?teamId=${VERCEL_ORG_ID}" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/deploy.json)
          if [ "$http" -lt 200 ] || [ "$http" -ge 300 ]; then echo "STOP deployment create HTTP $http"; cat /tmp/deploy-response.json; exit 4; fi
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/deploy-response.json","utf8")); if(!x.id||!x.url) process.exit(5); fs.appendFileSync(process.env.GITHUB_OUTPUT,`deployment_id=${x.id}\nurl=https://${x.url}\n`)'

      - name: Wait for READY exact-SHA reset preview
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            http=$(curl --silent --show-error --output /tmp/deployment.json --write-out '%{http_code}' \
              "https://api.vercel.com/v13/deployments/${DEPLOYMENT_ID}?teamId=${VERCEL_ORG_ID}" \
              --header "Authorization: Bearer ${VERCEL_TOKEN}")
            test "$http" = "200"
            state=$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/deployment.json","utf8")); const sha=x?.meta?.githubCommitSha||x?.meta?.approvedExactSha||x?.gitSource?.sha||""; const projectId=x?.projectId||x?.project?.id||""; if(projectId&&projectId!==process.env.VERCEL_PROJECT_ID) process.exit(6); if(sha&&sha!==process.env.EXACT_SHA) process.exit(7); if(x?.target) process.exit(8); process.stdout.write(x.readyState||x.status||"")')
            case "$state" in
              READY) echo "PASS READY exact-SHA reset preview"; node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/deployment.json","utf8")); console.log(`DEPLOYMENT_URL=https://${x.url}`)'; exit 0;;
              ERROR|CANCELED|BLOCKED) echo "STOP deployment state=$state"; exit 9;;
            esac
            sleep 5
          done
          echo 'STOP timeout waiting for READY'; exit 10
