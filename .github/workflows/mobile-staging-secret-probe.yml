name: iDogs Staging Admin Secret Probe

on:
  push:
    branches:
      - feat/mobile-app-foundation
    paths:
      - '.github/workflows/mobile-staging-secret-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Presence-only staging Admin probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      S1: ${{ secrets.IDOGS_STAGING_FIREBASE_SERVICE_ACCOUNT_JSON }}
      S2: ${{ secrets.FIREBASE_STAGING_SERVICE_ACCOUNT_JSON }}
      S3: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT_JSON }}
      S4: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
      S5: ${{ secrets.IDOGS_FIREBASE_STAGING_SERVICE_ACCOUNT_JSON }}
      T1_PROJECT: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
      T1_EMAIL: ${{ secrets.STAGING_FIREBASE_CLIENT_EMAIL }}
      T1_KEY: ${{ secrets.STAGING_FIREBASE_PRIVATE_KEY }}
      T1_BUCKET: ${{ secrets.STAGING_FIREBASE_STORAGE_BUCKET }}
      T2_PROJECT: ${{ secrets.FIREBASE_STAGING_PROJECT_ID }}
      T2_EMAIL: ${{ secrets.FIREBASE_STAGING_CLIENT_EMAIL }}
      T2_KEY: ${{ secrets.FIREBASE_STAGING_PRIVATE_KEY }}
      T2_BUCKET: ${{ secrets.FIREBASE_STAGING_STORAGE_BUCKET }}
      T3_PROJECT: ${{ secrets.IDOGS_STAGING_FIREBASE_PROJECT_ID }}
      T3_EMAIL: ${{ secrets.IDOGS_STAGING_FIREBASE_CLIENT_EMAIL }}
      T3_KEY: ${{ secrets.IDOGS_STAGING_FIREBASE_PRIVATE_KEY }}
      T3_BUCKET: ${{ secrets.IDOGS_STAGING_FIREBASE_STORAGE_BUCKET }}
    steps:
      - name: Classify secret presence without printing values
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const expected = 'idogs-app-staging'
          let safeFound = false

          function classifyJson(label, raw) {
            if (!raw) {
              console.log(`${label}: MISSING`)
              return
            }
            let parsed
            try { parsed = JSON.parse(raw) } catch {
              console.log(`${label}: PRESENT_INVALID_JSON`)
              return
            }
            const project = parsed.project_id || parsed.projectId || ''
            const email = parsed.client_email || parsed.clientEmail || ''
            const key = parsed.private_key || parsed.privateKey || ''
            const complete = Boolean(project && email && key)
            const staging = project === expected
            console.log(`${label}: PRESENT_${complete ? 'COMPLETE' : 'INCOMPLETE'}_${staging ? 'STAGING' : 'NON_STAGING'}`)
            if (complete && staging) safeFound = true
          }

          function classifyTuple(label, project, email, key, bucket) {
            const any = Boolean(project || email || key || bucket)
            if (!any) {
              console.log(`${label}: MISSING`)
              return
            }
            const complete = Boolean(project && email && key && bucket)
            const staging = project === expected && bucket.includes(expected)
            console.log(`${label}: PRESENT_${complete ? 'COMPLETE' : 'INCOMPLETE'}_${staging ? 'STAGING' : 'NON_STAGING'}`)
            if (complete && staging) safeFound = true
          }

          for (const n of ['S1','S2','S3','S4','S5']) classifyJson(n, process.env[n] || '')
          classifyTuple('T1', process.env.T1_PROJECT || '', process.env.T1_EMAIL || '', process.env.T1_KEY || '', process.env.T1_BUCKET || '')
          classifyTuple('T2', process.env.T2_PROJECT || '', process.env.T2_EMAIL || '', process.env.T2_KEY || '', process.env.T2_BUCKET || '')
          classifyTuple('T3', process.env.T3_PROJECT || '', process.env.T3_EMAIL || '', process.env.T3_KEY || '', process.env.T3_BUCKET || '')

          console.log(`SAFE_STAGING_ADMIN_SECRET: ${safeFound ? 'FOUND' : 'NOT_FOUND'}`)
          NODE
