name: Litter production preflight 20260901

on:
  push:
    branches:
      - automation/litter-remaining-preview-20260901

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact clean production candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/litter-quota-extra-credit-20260901
          git checkout --detach 9439efcf09b79cce587ec8ed19d30f5d4b87524b
          test "$(git rev-parse HEAD)" = "9439efcf09b79cce587ec8ed19d30f5d4b87524b"
          test -z "$(git status --porcelain)"
          test ! -e .github/workflows/litter-feature-preview-gate.yml
          test ! -e api/qa-repair-plus-entitlement.js
          test ! -e api/qa-auth-context.js
          ! grep -R "QA source:" src api
          ! grep -R "LITTER_QUOTA_QA" src api
          grep -q "included litters remaining" scripts/test-litter-pricing-policy.mjs
          grep -q "Based on your breeder profile’s rolling 12-month litter history" src/components/ExtraLitterButton.tsx
          ! grep -q "litter allowances used" src/components/ExtraLitterButton.tsx
          grep -q "process.env.EXTRA_LITTER_CHECKOUT_ENABLED === 'true'" api/_lib/extra-litter-checkout-handler.js
          echo CANDIDATE_BOUNDARY_OK

      - name: Install dependencies
        run: npm ci

      - name: Run full regression and build gate
        shell: bash
        run: |
          set -euo pipefail
          node --check api/_lib/breeder-profile.js
          node --check api/_lib/litter-quota.js
          node --check api/_lib/extra-litter-checkout-handler.js
          node --check api/_lib/extra-litter-webhook.js
          node --check api/create-litter.js
          node --check api/update-litter.js
          node --check api/create-extra-litter-checkout.js
          node --check api/litter-quota-summary.js
          node --check api/stripe-webhook.js
          node scripts/test-breeder-profile-identity.mjs
          node scripts/test-litter-quota.mjs
          node scripts/test-extra-litter-checkout.mjs
          node scripts/test-extra-litter-webhook.mjs
          node scripts/test-litter-pricing-policy.mjs
          node scripts/test-litter-dob-policy.mjs
          node scripts/test-litter-create-client-dto.mjs
          node scripts/test-internal-entitlement.mjs
          node scripts/test-webhook-handler.mjs
          node scripts/test-billing-payments-phase1.mjs
          node scripts/test-pricing-integration-checks.mjs
          node scripts/test-landing-pricing-ui.mjs
          node scripts/test-sidebar-billing-sync.mjs
          npm run build

      - name: Reverify exact candidate after tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9439efcf09b79cce587ec8ed19d30f5d4b87524b"
          test -z "$(git status --porcelain)"
          echo REGRESSION_BUILD_OK

      - name: Link exact Vercel production project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"projectId":"prj_UsnGhC1BWtYnmF5rKMYBR9KWkbIo","orgId":"team_oZF1Z0BUEceb9fAXdmFV1Saz","projectName":"idogs-app"}
          JSON

      - name: Read production environment and assert finance gate OFF
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects >/tmp/vercel-prod-pull.log 2>&1
          ENV_FILE=.vercel/.env.production.local
          test -f "$ENV_FILE"
          if grep -Eq '^EXTRA_LITTER_CHECKOUT_ENABLED=("?true"?)$' "$ENV_FILE"; then
            echo 'FAIL: production Extra Litter checkout is already enabled'
            exit 1
          fi
          if grep -Eq '^EXTRA_LITTER_CHECKOUT_ENABLED=' "$ENV_FILE"; then
            echo PROD_EXTRA_LITTER_GATE_PRESENT_BUT_OFF
          else
            echo PROD_EXTRA_LITTER_GATE_ABSENT_FAIL_CLOSED
          fi
          echo PRODUCTION_ENV_READ_ONLY_OK

      - name: Final preflight boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9439efcf09b79cce587ec8ed19d30f5d4b87524b"
          test -z "$(git status --porcelain)"
          echo PREFLIGHT_PASS
          echo NO_PRODUCTION_DEPLOY_PERFORMED
          echo NO_ENV_CHANGE_PERFORMED
          echo NO_STRIPE_WRITE_PERFORMED
