name: SMS Add-on Live-Baseline Validation

on:
  pull_request_target:
    branches: ['baseline/live-42bd-sms-validation']
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: SMS Add-on tests
        id: sms_tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: node scripts/test-sms-addon-v1.mjs

      - name: TypeScript + Vite build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Report validation result
        uses: actions/github-script@v7
        with:
          script: |
            const install = '${{ steps.install.outcome }}';
            const sms = '${{ steps.sms_tests.outcome }}';
            const build = '${{ steps.build.outcome }}';
            const pass = install === 'success' && sms === 'success' && build === 'success';
            const body = [
              '### SMS Add-on V1 validation',
              '',
              '- Head SHA: ${{ github.event.pull_request.head.sha }}',
              '- npm ci: **' + install.toUpperCase() + '**',
              '- SMS tests: **' + sms.toUpperCase() + '**',
              '- npm build: **' + build.toUpperCase() + '**',
              '',
              pass ? '**VALIDATION PASS**' : '**VALIDATION FAILED - do not deploy Preview yet.**'
            ].join('\\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
            if (!pass) core.setFailed('Validation failed');
