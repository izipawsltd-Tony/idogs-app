name: Production deploy 20260901

on:
  push:
    branches:
      - automation/prod-deploy-20260901

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact approved runtime
        uses: actions/checkout@v4
        with:
          ref: 70a357c0bf0223dbacf9f0c724124d53c9d978ad
          fetch-depth: 1

      - name: Verify exact clean approved SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "70a357c0bf0223dbacf9f0c724124d53c9d978ad"
          test -z "$(git status --porcelain)"
          test ! -e api/qa-repair-plus-entitlement.js
          test ! -e api/qa-auth-context.js
          echo 'EXACT_APPROVED_SHA_OK'

      - name: Run critical billing regressions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/test-billing-p0-security.mjs
          node scripts/test-billing-payments-phase1.mjs
          node scripts/test-stripe-mode-routing.mjs
          node scripts/test-sidebar-billing-sync.mjs
          node scripts/test-webhook-handler.mjs
          npm run build

      - name: Link exact Vercel production project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"projectId":"prj_UsnGhC1BWtYnmF5rKMYBR9KWkbIo","orgId":"team_oZF1Z0BUEceb9fAXdmFV1Saz","projectName":"idogs-app"}
          JSON

      - name: Audit Production SMS key exists
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest env ls production --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects > /tmp/prod-env.txt 2>&1
          grep -q 'STRIPE_SMS_ADDON_PRICE_ID' /tmp/prod-env.txt
          echo 'PROD_SMS_ENV_PRESENT'

      - name: Pull Production settings
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects

      - name: Reverify exact clean runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "70a357c0bf0223dbacf9f0c724124d53c9d978ad"
          mapfile -t changed < <(git diff --name-only)
          if (( ${#changed[@]} == 1 )) && [[ "${changed[0]}" == "package-lock.json" ]]; then
            git restore --source=HEAD -- package-lock.json
          elif (( ${#changed[@]} != 0 )); then
            printf 'Unexpected tracked drift:\n%s\n' "${changed[@]}"
            exit 1
          fi
          test -z "$(git status --porcelain)"
          echo 'CLEAN_RUNTIME_REVERIFIED'

      - name: Deploy exact SHA to Production
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          PROD_URL=$(npx --yes vercel@latest deploy --prod --yes --archive=tgz --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects 2>&1 | tee /tmp/vercel-prod.log | grep -Eo 'https://[^ ]+\.vercel\.app' | tail -1)
          test -n "$PROD_URL"
          echo "PROD_URL=$PROD_URL" >> "$GITHUB_ENV"
          echo "PRODUCTION_READY $PROD_URL"

      - name: Verify approved Production target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "70a357c0bf0223dbacf9f0c724124d53c9d978ad"
          test -n "$PROD_URL"
          echo 'EXACT_SHA_DEPLOYED 70a357c0bf0223dbacf9f0c724124d53c9d978ad'
          echo 'PROJECT idogs-app'
          echo 'TARGET production'
