name: QA auth context Preview 20260831

on:
  push:
    branches:
      - fix/pricing-regression-20260830

permissions:
  contents: read

jobs:
  read-only-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact QA SHA
        uses: actions/checkout@v4
        with:
          ref: c53508fec17bca5c53fa0cb870f434ccd70f83a9
          fetch-depth: 0

      - name: Fail closed on exact source and pricing/GST target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c53508fec17bca5c53fa0cb870f434ccd70f83a9"
          test -z "$(git status --porcelain)"
          grep -Fq "PLUS_MONTHLY_PRICE_AUD = 7" src/lib/pricingCopy.ts
          grep -Fq "PLUS_ANNUAL_PRICE_AUD = 70" src/lib/pricingCopy.ts
          grep -Fq "txr_1U9iaFGHgBd6ZgJE5FsztFar" api/_lib/checkout-handler.js
          grep -Fq "default_tax_rates" api/_lib/checkout-handler.js
          test -f api/qa-auth-context.js

      - name: Link exact Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"projectId":"prj_UsnGhC1BWtYnmF5rKMYBR9KWkbIo","orgId":"team_oZF1Z0BUEceb9fAXdmFV1Saz","projectName":"idogs-app"}
          JSON

      - name: Read temporary Preview diagnostic
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest curl /api/qa-auth-context \
            --deployment idogs-k55761xd6-izipawsltd-tonys-projects.vercel.app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
