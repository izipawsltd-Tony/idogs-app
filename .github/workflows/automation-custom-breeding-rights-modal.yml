name: Build custom breeding rights confirmation modal

on:
  push:
    branches:
      - fix/pedigree-transfer-breeding-eligibility

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message == 'automation: replace breeding rights browser confirm'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/pedigree-transfer-breeding-eligibility
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply custom modal
        run: python .github/scripts/custom_breeding_rights_modal.py

      - name: Verify
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run
          npm run build
          git diff --check
          if grep -Fq 'window.confirm("Confirm breeding rights?' src/pages/DogDetailPage.tsx; then
            echo 'Native breeding-rights window.confirm still present'
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name "iDogs Auto Build"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/DogDetailPage.tsx
          git commit -m "ui(pedigree): use iDogs breeding rights confirmation modal"
          git push origin HEAD:fix/pedigree-transfer-breeding-eligibility
