name: iDogs App Store Readiness (read-only)

on:
  push:
    branches: [fix/android-v20-qa-blockers, release/ios-app-store-20261025]
    paths:
      # Refresh the GET-only inventory when a new internal candidate is recorded.
      - docs/release/ios-candidate-*.md
      - scripts/qa/app-store-readiness.mjs
      - .github/workflows/mobile-ios-store-readiness.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read metadata without changing App Store Connect
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: node scripts/qa/app-store-readiness.mjs
      - name: Save allowlisted readiness summary
        uses: actions/upload-artifact@v4
        with:
          name: idogs-app-store-readiness-${{ github.sha }}
          path: app-store-readiness.json
          retention-days: 7
          if-no-files-found: error
