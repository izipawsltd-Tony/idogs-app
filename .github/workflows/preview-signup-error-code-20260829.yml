name: Preview signup Firebase error code 20260829

on:
  push:
    branches:
      - fix/signup-firebase-error-code-20260829
    paths:
      - .github/workflows/preview-signup-error-code-20260829.yml

permissions:
  contents: read

jobs:
  preview-signup-error:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact product SHA
        uses: actions/checkout@v4
        with:
          ref: 7b1ddf970c3625bb4276bbb4ce20af3ef6c0d374
          fetch-depth: 0

      - name: Fail closed on exact source and scope
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='7b1ddf970c3625bb4276bbb4ce20af3ef6c0d374'
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
          grep -q "Firebase error:" src/pages/SignupPage.tsx
          grep -q "Firebase error:" src/pages/VerifyEmailPage.tsx
          grep -q "auth/email-already-in-use" src/pages/SignupPage.tsx
          grep -q "txr_1U9b6XGHgBd6ZgJEwaS4bfLx" api/_lib/checkout-handler.js
          grep -q "stagingPreviewOrigin" api/_lib/checkout-handler.js

      - name: Install dependencies
        run: npm ci

      - name: Test Preview checkout APP_URL fallback
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createCheckoutHandler } from './api/_lib/checkout-handler.js'

          function responseRecorder() {
            return {
              statusCode: 0,
              body: null,
              status(code) { this.statusCode = code; return this },
              json(body) { this.body = body; return this },
            }
          }

          const saved = {
            FIREBASE_PROJECT_ID: process.env.FIREBASE_PROJECT_ID,
            VERCEL_ENV: process.env.VERCEL_ENV,
            VERCEL_URL: process.env.VERCEL_URL,
          }

          try {
            process.env.FIREBASE_PROJECT_ID = 'idogs-app-staging'
            process.env.VERCEL_ENV = 'preview'
            process.env.VERCEL_URL = 'idogs-app-staging-abc123-izipawsltd-tonys-projects.vercel.app'

            let sessionArgs
            const handler = createCheckoutHandler({
              getAppUrl: () => null,
              verifyIdToken: async () => ({ uid: 'qa-user', email: 'qa@example.com' }),
              createSession: async args => { sessionArgs = args; return { url: 'https://checkout.stripe.com/test' } },
            })
            const res = responseRecorder()
            await handler({
              method: 'POST',
              headers: { authorization: 'Bearer qa-token' },
              body: { plan: 'plus_monthly', userId: 'qa-user', userEmail: 'qa@example.com' },
            }, res)

            if (res.statusCode !== 200) throw new Error(`Expected Preview 200, got ${res.statusCode}`)
            const expectedOrigin = 'https://idogs-app-staging-abc123-izipawsltd-tonys-projects.vercel.app'
            if (sessionArgs?.success_url !== `${expectedOrigin}/app/billing?success=1`) throw new Error('Preview success_url fallback failed')
            if (sessionArgs?.cancel_url !== `${expectedOrigin}/app/billing?cancelled=1`) throw new Error('Preview cancel_url fallback failed')

            process.env.FIREBASE_PROJECT_ID = 'idogs-app'
            process.env.VERCEL_ENV = 'production'
            process.env.VERCEL_URL = 'idogs-app.vercel.app'
            let prodSessionCalled = false
            const prodHandler = createCheckoutHandler({
              getAppUrl: () => null,
              verifyIdToken: async () => ({ uid: 'qa-user', email: 'qa@example.com' }),
              createSession: async () => { prodSessionCalled = true; return { url: 'unexpected' } },
            })
            const prodRes = responseRecorder()
            await prodHandler({ method: 'POST', headers: {}, body: {} }, prodRes)
            if (prodRes.statusCode !== 500) throw new Error(`Production fail-closed regression: ${prodRes.statusCode}`)
            if (prodSessionCalled) throw new Error('Production checkout must not run without APP_URL')
          } finally {
            for (const [key, value] of Object.entries(saved)) {
              if (value === undefined) delete process.env[key]
              else process.env[key] = value
            }
          }
          NODE

      - name: Build
        run: npm run build

      - name: Link iDogs staging project only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"projectId":"prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o","orgId":"team_oZF1Z0BUEceb9fAXdmFV1Saz","projectName":"idogs-app-staging"}
          JSON

      - name: Pull staging settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects

      - name: Re-verify exact source before Preview deploy
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='7b1ddf970c3625bb4276bbb4ce20af3ef6c0d374'
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git diff --cached --name-only)"
          mapfile -t changed < <(git diff --name-only)
          if (( ${#changed[@]} == 1 )) && [[ "${changed[0]}" == "package-lock.json" ]]; then
            git restore --source=HEAD -- package-lock.json
          elif (( ${#changed[@]} != 0 )); then
            printf 'Unexpected tracked drift before Preview deploy:\n%s\n' "${changed[@]}"
            exit 1
          fi
          test -z "$(git status --porcelain)"

      - name: Deploy exact source to Preview only
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --yes --archive=tgz --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects
