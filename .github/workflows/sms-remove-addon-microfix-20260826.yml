name: Apply SMS remove add-on micro-fix

on:
  push:
    branches:
      - ops/sms-remove-addon-microfix-20260826

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout ops branch
        uses: actions/checkout@v4
        with:
          ref: ops/sms-remove-addon-microfix-20260826
          fetch-depth: 0

      - name: Preserve patch script and checkout exact feature branch
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/ops-apply-sms-remove-addon-microfix.py /tmp/apply.py
          git checkout feature/sms-addon-v1
          EXPECTED=e4dfdf9a196871f0801775ee7ead28fa4e302bb1
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$(git rev-parse origin/feature/sms-addon-v1)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
          echo "PASS exact feature SHA and clean worktree"

      - name: Apply approved micro-fix
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/apply.py
          git add -N api/remove-sms-addon.js
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "api/_lib/sms-checkout-handler.js api/remove-sms-addon.js scripts/test-sms-addon-v1.mjs src/pages/BillingPage.tsx "
          git diff --check
          echo "PASS patch scope"

      - name: Install dependencies
        run: npm ci

      - name: Targeted regression tests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-sms-addon-v1.mjs
          node scripts/test-webhook-handler.mjs

      - name: Build
        run: npm run build

      - name: Commit and push feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "izipawsltd-Tony"
          git config user.email "izipawsltd@gmail.com"
          git add api/_lib/sms-checkout-handler.js api/remove-sms-addon.js src/pages/BillingPage.tsx scripts/test-sms-addon-v1.mjs
          git commit -m "fix(sms): add safe add-on removal"
          NEW_SHA=$(git rev-parse HEAD)
          git push origin HEAD:feature/sms-addon-v1
          test "$(git ls-remote origin refs/heads/feature/sms-addon-v1 | awk '{print $1}')" = "$NEW_SHA"
          echo "PASS feature push $NEW_SHA"
