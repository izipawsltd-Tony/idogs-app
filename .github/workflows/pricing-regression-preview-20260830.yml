name: SMS Preview env audit 20260901

on:
  push:
    branches:
      - automation/pricing-regression-preview-20260830

permissions:
  contents: read

jobs:
  audit-sms-preview-env:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact runtime
        uses: actions/checkout@v4
        with:
          ref: 70a357c0bf0223dbacf9f0c724124d53c9d978ad
          fetch-depth: 1

      - name: Verify exact clean SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "70a357c0bf0223dbacf9f0c724124d53c9d978ad"
          test -z "$(git status --porcelain)"

      - name: Link exact Vercel project
        shell: bash
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"projectId":"prj_UsnGhC1BWtYnmF5rKMYBR9KWkbIo","orgId":"team_oZF1Z0BUEceb9fAXdmFV1Saz","projectName":"idogs-app"}
          JSON

      - name: Audit Preview SMS key only
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest env ls preview --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects > /tmp/env-list.txt 2>&1
          if grep -q 'STRIPE_SMS_ADDON_PRICE_ID' /tmp/env-list.txt; then
            echo 'SMS_PREVIEW_ENV_PRESENT'
          else
            echo 'SMS_PREVIEW_ENV_MISSING'
          fi
