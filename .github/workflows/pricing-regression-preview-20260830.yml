name: Guarded Plus entitlement repair 20260831

on:
  push:
    branches:
      - automation/pricing-regression-preview-20260830

permissions:
  contents: read

jobs:
  repair-once:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair runtime SHA
        uses: actions/checkout@v4
        with:
          ref: d5718e24914b3f7cbe1144612bdd43e099e43b1a
          fetch-depth: 0

      - name: Fail closed on exact endpoint guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d5718e24914b3f7cbe1144612bdd43e099e43b1a"
          grep -Fq "VERCEL_ENV !== 'preview'" api/qa-repair-plus-entitlement.js
          grep -Fq "FIREBASE_PROJECT_ID !== 'idogs-app'" api/qa-repair-plus-entitlement.js
          grep -Fq "idogspetowner@gmail.com" api/qa-repair-plus-entitlement.js
          grep -Fq "sub_1UAN6VGHgBd6ZgJEe08VQQ9h" api/qa-repair-plus-entitlement.js
          grep -Fq "uidMatchesMetadata" api/qa-repair-plus-entitlement.js
          grep -Fq "customerEmailMatches" api/qa-repair-plus-entitlement.js
          grep -Fq "activeVerifiedPlus" api/qa-repair-plus-entitlement.js

      - name: Link exact Vercel project
        shell: bash
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"projectId":"prj_UsnGhC1BWtYnmF5rKMYBR9KWkbIo","orgId":"team_oZF1Z0BUEceb9fAXdmFV1Saz","projectName":"idogs-app"}
          JSON

      - name: GET profile before repair
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest curl /api/qa-repair-plus-entitlement --deployment idogs-iqc30ep4z-izipawsltd-tonys-projects.vercel.app -- --silent --show-error > /tmp/before.json
          cat /tmp/before.json
          jq -e '.guards.uidMatchesMetadata == true and .guards.customerEmailMatches == true and .guards.activeVerifiedPlus == true and .guards.subscriptionIdMatches == true' /tmp/before.json >/dev/null
          jq -e '.subscriptionId == "sub_1UAN6VGHgBd6ZgJEe08VQQ9h"' /tmp/before.json >/dev/null

      - name: POST one-shot repair
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest curl /api/qa-repair-plus-entitlement --deployment idogs-iqc30ep4z-izipawsltd-tonys-projects.vercel.app -- --silent --show-error --request POST > /tmp/repair.json
          cat /tmp/repair.json
          jq -e '.repaired == true' /tmp/repair.json >/dev/null
          jq -e '.after.plan == "plus"' /tmp/repair.json >/dev/null
          jq -e '.after.subscriptionStatus == "active"' /tmp/repair.json >/dev/null
          jq -e '.after.stripeSubscriptionId == "sub_1UAN6VGHgBd6ZgJEe08VQQ9h"' /tmp/repair.json >/dev/null
          jq -e '.after.billingInterval == "monthly"' /tmp/repair.json >/dev/null

      - name: GET verify after repair
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest curl /api/qa-repair-plus-entitlement --deployment idogs-iqc30ep4z-izipawsltd-tonys-projects.vercel.app -- --silent --show-error > /tmp/after.json
          cat /tmp/after.json
          jq -e '.after.plan == "plus"' /tmp/after.json >/dev/null
          jq -e '.after.subscriptionStatus == "active"' /tmp/after.json >/dev/null
          jq -e '.after.stripeSubscriptionId == "sub_1UAN6VGHgBd6ZgJEe08VQQ9h"' /tmp/after.json >/dev/null
          echo "ONE_SHOT_REPAIR_PASS"
