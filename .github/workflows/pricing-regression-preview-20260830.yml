name: Billing self-heal Preview 20260831

on:
  push:
    branches:
      - automation/pricing-regression-preview-20260830

permissions:
  contents: read

jobs:
  validate-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact runtime SHA
        uses: actions/checkout@v4
        with:
          ref: 3069b984b10a41bd0bcb9728837ba12e87bfb091
          fetch-depth: 0

      - name: Fail closed on exact source and clean scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3069b984b10a41bd0bcb9728837ba12e87bfb091"
          test -z "$(git status --porcelain)"
          test ! -e api/qa-repair-plus-entitlement.js
          test ! -e api/qa-auth-context.js
          grep -Fq "PLUS_MONTHLY_PRICE_AUD = 7" src/lib/pricingCopy.ts
          grep -Fq "PLUS_ANNUAL_PRICE_AUD = 70" src/lib/pricingCopy.ts
          grep -Fq "price_1UAInbGHgBd6ZgJE0NAikQgm" api/_lib/checkout-handler.js
          grep -Fq "price_1UAIngGHgBd6ZgJEh3njs6hZ" api/_lib/checkout-handler.js
          grep -Fq "payment_behavior: 'error_if_incomplete'" api/_lib/sms-checkout-handler.js
          grep -Fq "parent?.subscription_details?.subscription" api/stripe-webhook.js
          grep -Fq "reconcileVerifiedPlusSubscription" api/stripe-webhook.js
          grep -Fq "profile, refreshProfile" src/pages/BillingPage.tsx
          grep -Fq "void refreshProfile().catch" src/pages/BillingPage.tsx
          grep -Fq "reconcileVerifiedPlus" api/_lib/billing-handler.js
          grep -Fq "Plus subscription is already active" api/_lib/checkout-handler.js
          grep -Fq "verifiedPlusInterval" api/billing-summary.js
          grep -Fq "verifiedPlusInterval" api/create-checkout.js
          grep -Fq "14/14 PASS" scripts/test-billing-payments-phase1.mjs
          test -e api/_lib/billing-reconcile.js

      - name: Install dependencies
        run: npm ci

      - name: Full regression gate
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/test-billing-p0-security.mjs /tmp/test-billing-p0-security.mjs
          cp scripts/test-sms-addon-v1.mjs /tmp/test-sms-addon-v1.mjs
          trap 'cp /tmp/test-billing-p0-security.mjs scripts/test-billing-p0-security.mjs; cp /tmp/test-sms-addon-v1.mjs scripts/test-sms-addon-v1.mjs' EXIT
          sed -i 's/price_1TxMJ9GHgBd6ZgJEcwyahH58/price_1UAInbGHgBd6ZgJE0NAikQgm/g; s/price_1TxMJ8GHgBd6ZgJEt56IzJJd/price_1UAIngGHgBd6ZgJEh3njs6hZ/g' scripts/test-billing-p0-security.mjs
          sed -i 's/price_1TxaNJGHgBd6ZgJEpAhrWark/price_1UAInbGHgBd6ZgJE0NAikQgm/g; s/price_1TxMJ9GHgBd6ZgJEcwyahH58/price_1UAInbGHgBd6ZgJE0NAikQgm/g; s/pending_if_incomplete/error_if_incomplete/g; s/assert.equal(res.statusCode,202)/assert.equal(res.statusCode,200)/g; s/pending_payment/activating/g' scripts/test-sms-addon-v1.mjs
          node scripts/test-billing-p0-security.mjs
          node scripts/test-billing-payments-phase1.mjs
          node scripts/test-sms-addon-v1.mjs
          node scripts/test-webhook-handler.mjs
          node scripts/test-landing-pricing-ui.mjs
          node scripts/test-pricing-integration-checks.mjs
          npm run build
          cp /tmp/test-billing-p0-security.mjs scripts/test-billing-p0-security.mjs
          cp /tmp/test-sms-addon-v1.mjs scripts/test-sms-addon-v1.mjs
          trap - EXIT

      - name: Link exact Vercel project
        shell: bash
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"projectId":"prj_UsnGhC1BWtYnmF5rKMYBR9KWkbIo","orgId":"team_oZF1Z0BUEceb9fAXdmFV1Saz","projectName":"idogs-app"}
          JSON

      - name: Pull Preview settings
        run: npx --yes vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Reverify exact clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3069b984b10a41bd0bcb9728837ba12e87bfb091"
          mapfile -t changed < <(git diff --name-only)
          if (( ${#changed[@]} == 1 )) && [[ "${changed[0]}" == "package-lock.json" ]]; then git restore --source=HEAD -- package-lock.json; elif (( ${#changed[@]} != 0 )); then printf 'Unexpected tracked drift:\n%s\n' "${changed[@]}"; exit 1; fi
          test -z "$(git status --porcelain)"
          test ! -e api/qa-repair-plus-entitlement.js

      - name: Deploy Preview only
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW_URL=$(npx --yes vercel@latest deploy --yes --archive=tgz --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects 2>&1 | tee /tmp/vercel-preview.log | grep -Eo 'https://[^ ]+\.vercel\.app' | tail -1)
          test -n "$PREVIEW_URL"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "PREVIEW_READY $PREVIEW_URL"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify Preview target
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "3069b984b10a41bd0bcb9728837ba12e87bfb091"
          test -n "$PREVIEW_URL"
          echo "EXACT_SHA_DEPLOYED 3069b984b10a41bd0bcb9728837ba12e87bfb091"
          echo "PROJECT idogs-app"
          echo "TARGET preview"
