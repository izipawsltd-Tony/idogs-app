name: Cancel mismatched pricing production deployment 20260831

on:
  push:
    branches:
      - automation/pricing-regression-preview-20260830

permissions:
  contents: read

jobs:
  cancel-mismatched-production:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel exact Vercel deployment before READY
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_ID="dpl_9c73nkX8svdEoywY2dzaShm9p711"
          TEAM_ID="team_oZF1Z0BUEceb9fAXdmFV1Saz"
          curl --fail-with-body --silent --show-error \
            --request DELETE \
            "https://api.vercel.com/v13/deployments/${DEPLOYMENT_ID}?teamId=${TEAM_ID}" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}"
          echo "CANCELLED_DEPLOYMENT ${DEPLOYMENT_ID}"
          echo "REASON live Stripe prices are A$5/month and A$49/year, not approved A$7/A$70"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
