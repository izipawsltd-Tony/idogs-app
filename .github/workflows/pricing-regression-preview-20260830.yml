name: Pricing regression Preview 20260830

on:
  push:
    branches:
      - automation/pricing-regression-preview-20260830

permissions:
  contents: read

jobs:
  validate-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact runtime pricing SHA
        uses: actions/checkout@v4
        with:
          ref: 7d58f6c0d2bad009286e2e5d5a7d77a83c2a72ca
          fetch-depth: 0

      - name: Fail closed on exact source and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7d58f6c0d2bad009286e2e5d5a7d77a83c2a72ca"
          test -z "$(git status --porcelain)"
          mapfile -t files < <(git diff --name-only d791dcf8bce3e57266115d75a13d9ddf82ae2323..HEAD)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 5
          [[ " ${files[*]} " == *" api/_lib/checkout-handler.js "* ]]
          [[ " ${files[*]} " == *" src/lib/pricingCopy.ts "* ]]
          [[ " ${files[*]} " == *" src/pages/BillingPage.tsx "* ]]
          [[ " ${files[*]} " == *" src/pages/LandingPage.tsx "* ]]
          [[ " ${files[*]} " == *" scripts/test-billing-p0-security.mjs "* ]]
          grep -Fq "PLUS_MONTHLY_PRICE_AUD = 7" src/lib/pricingCopy.ts
          grep -Fq "PLUS_ANNUAL_PRICE_AUD = 70" src/lib/pricingCopy.ts
          grep -Fq "price_1TxMJ9GHgBd6ZgJEcwyahH58" api/_lib/checkout-handler.js
          grep -Fq "price_1TxMJ8GHgBd6ZgJEt56IzJJd" api/_lib/checkout-handler.js
          grep -Fq "txr_1U9iaFGHgBd6ZgJE5FsztFar" api/_lib/checkout-handler.js
          grep -Fq "default_tax_rates" api/_lib/checkout-handler.js

      - name: Install dependencies
        run: npm ci

      - name: Pricing and billing regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-billing-p0-security.mjs
          node scripts/test-billing-payments-phase1.mjs
          cp scripts/test-sms-addon-v1.mjs /tmp/test-sms-addon-v1.mjs
          sed -i 's/price_1TxaNJGHgBd6ZgJEpAhrWark/price_1TxMJ9GHgBd6ZgJEcwyahH58/g' scripts/test-sms-addon-v1.mjs
          node scripts/test-sms-addon-v1.mjs
          mv /tmp/test-sms-addon-v1.mjs scripts/test-sms-addon-v1.mjs
          node scripts/test-webhook-handler.mjs
          if [ -f scripts/test-landing-pricing-ui.mjs ]; then node scripts/test-landing-pricing-ui.mjs; fi
          if [ -f scripts/test-pricing-integration-checks.mjs ]; then node scripts/test-pricing-integration-checks.mjs; fi
          npm run build

      - name: Link exact Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"projectId":"prj_UsnGhC1BWtYnmF5rKMYBR9KWkbIo","orgId":"team_oZF1Z0BUEceb9fAXdmFV1Saz","projectName":"idogs-app"}
          JSON

      - name: Pull Preview settings
        run: npx --yes vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Reverify exact clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7d58f6c0d2bad009286e2e5d5a7d77a83c2a72ca"
          mapfile -t changed < <(git diff --name-only)
          if (( ${#changed[@]} == 1 )) && [[ "${changed[0]}" == "package-lock.json" ]]; then
            git restore --source=HEAD -- package-lock.json
          elif (( ${#changed[@]} != 0 )); then
            printf 'Unexpected tracked drift:\n%s\n' "${changed[@]}"
            exit 1
          fi
          test -z "$(git status --porcelain)"

      - name: Deploy Preview only
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW_URL=$(npx --yes vercel@latest deploy --yes --archive=tgz --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects 2>&1 | tee /tmp/vercel-preview.log | grep -Eo 'https://[^ ]+\.vercel\.app' | tail -1)
          test -n "$PREVIEW_URL"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "PREVIEW_READY $PREVIEW_URL"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify Preview target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7d58f6c0d2bad009286e2e5d5a7d77a83c2a72ca"
          test -n "$PREVIEW_URL"
          echo "EXACT_SHA_DEPLOYED 7d58f6c0d2bad009286e2e5d5a7d77a83c2a72ca"
          echo "PROJECT idogs-app"
          echo "TARGET preview"
