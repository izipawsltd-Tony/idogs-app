name: iDogs Android Debug APK

on:
  push:
    branches:
      - feat/mobile-app-foundation
    paths:
      - '.github/workflows/mobile-android-debug-apk.yml'
      - 'src/mobile.css'
      - 'src/pages/LandingPage.tsx'
      - 'src/main.tsx'
      - 'index.html'
      - 'mobile/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idogs-android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build staging Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IDOGS_MOBILE_APP_ID: au.com.idogs.app.staging
      IDOGS_MOBILE_APP_NAME: iDogs QA
      IDOGS_QA_SIGNING_CERT_SHA256: dd96113d2bb7d9a20de6a09c89d3b6200ec0cfd0a2681dd13e9000372ece0932

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # QA-only signing identity. Production release signing is separate.
      # The certificate fingerprint is pinned above. A missing/changed cache
      # must fail closed rather than silently creating a new Android identity.
      - name: Restore persistent QA signing key
        id: qa-signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: idogs-android-qa-debug-keystore-v1

      - name: Verify pinned QA signing key
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.qa-signing-cache.outputs.cache-hit }}" != "true" ]; then
            echo 'FAIL CLOSED: pinned iDogs QA signing key cache is missing'
            exit 1
          fi
          test -s "$HOME/.android/debug.keystore"
          KEYSTORE_SHA=$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            | awk -F': ' '/SHA256:/{print $2; exit}' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')
          test -n "$KEYSTORE_SHA"
          echo "Pinned QA certificate SHA-256: $IDOGS_QA_SIGNING_CERT_SHA256"
          echo "Restored QA certificate SHA-256: $KEYSTORE_SHA"
          if [ "$KEYSTORE_SHA" != "$IDOGS_QA_SIGNING_CERT_SHA256" ]; then
            echo 'FAIL CLOSED: restored QA signing key fingerprint changed'
            exit 1
          fi
          echo "QA_KEYSTORE_CERT_SHA256=$KEYSTORE_SHA" >> "$GITHUB_ENV"

      - name: Install web dependencies
        run: npm ci

      - name: Pull Preview env and fail closed unless Firebase is staging
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo 'VERCEL_TOKEN missing'; exit 1; }
          rm -rf .vercel
          mkdir -p .vercel
          printf '%s\n' '{"projectId":"prj_UsnGhC1BWtYnmF5rKMYBR9KWkbIo","orgId":"team_oZF1Z0BUEceb9fAXdmFV1Saz","projectName":"idogs-app"}' > .vercel/project.json
          npx --yes vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects >/tmp/vercel-pull.log 2>&1
          test -f .vercel/.env.preview.local
          ENV_FILE=.vercel/.env.preview.local GITHUB_ENV_FILE="$GITHUB_ENV" node <<'NODE'
          const fs = require('fs')
          const text = fs.readFileSync(process.env.ENV_FILE, 'utf8')
          function read(name) {
            const line = text.split(/\r?\n/).find(l => l.startsWith(name + '='))
            if (!line) return null
            let v = line.slice(name.length + 1).trim()
            if ((v.startsWith('"') && v.endsWith('"')) || (v.startsWith("'") && v.endsWith("'"))) v = v.slice(1, -1)
            return v.replace(/\\n/g, '\n')
          }
          const required = [
            'VITE_FIREBASE_API_KEY',
            'VITE_FIREBASE_AUTH_DOMAIN',
            'VITE_FIREBASE_PROJECT_ID',
            'VITE_FIREBASE_STORAGE_BUCKET',
            'VITE_FIREBASE_MESSAGING_SENDER_ID',
            'VITE_FIREBASE_APP_ID',
          ]
          const values = Object.fromEntries(required.map(k => [k, read(k)]))
          for (const [k, v] of Object.entries(values)) {
            if (!v) throw new Error(`${k} missing from Preview env`)
          }
          if (values.VITE_FIREBASE_PROJECT_ID !== 'idogs-app-staging') {
            throw new Error('FAIL CLOSED: Preview Firebase is not idogs-app-staging')
          }
          for (const [k, v] of Object.entries(values)) {
            fs.appendFileSync(process.env.GITHUB_ENV_FILE, `${k}=${v}\n`)
          }
          fs.appendFileSync(process.env.GITHUB_ENV_FILE, 'VITE_EXTRA_LITTER_CHECKOUT_ENABLED=false\n')
          console.log('Preview Firebase classification: STAGING')
          NODE

      - name: Build web bundle with staging Firebase only
        run: npm run build

      - name: Install Capacitor mobile dependencies
        run: npm --prefix mobile install --no-audit --no-fund

      - name: Prepare approved iDogs branding
        run: npm --prefix mobile run branding

      - name: Generate Android native project
        run: npm --prefix mobile run add:android

      - name: Sync web bundle into Android
        run: npm --prefix mobile run sync:android

      - name: Generate Android launcher and splash assets
        run: npm --prefix mobile run assets:android

      - name: Build debug APK
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      # Do not trust Gradle's ephemeral/default debug signer. Re-align and
      # re-sign the final QA APK explicitly with the pinned iDogs QA key.
      - name: Deterministically sign QA APK
        shell: bash
        run: |
          set -euo pipefail
          RAW_APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          ALIGNED_APK=mobile/android/app/build/outputs/apk/debug/app-debug-qa-aligned.apk
          SIGNED_APK=mobile/android/app/build/outputs/apk/debug/app-debug-qa-signed.apk
          test -s "$RAW_APK"
          test -s "$HOME/.android/debug.keystore"

          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"

          "$ZIPALIGN" -f -p 4 "$RAW_APK" "$ALIGNED_APK"
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
          test -s "$SIGNED_APK"
          echo "IDOGS_APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"
          echo "IDOGS_SIGNED_APK=$SIGNED_APK" >> "$GITHUB_ENV"

      - name: Verify QA signer identity and APK integrity
        shell: bash
        run: |
          set -euo pipefail
          APK="$IDOGS_SIGNED_APK"
          test -s "$APK"
          test -n "${QA_KEYSTORE_CERT_SHA256:-}"
          grep -q "au.com.idogs.app.staging" mobile/android/app/build.gradle || grep -q "au.com.idogs.app.staging" mobile/android/app/build.gradle.kts
          unzip -t "$APK" >/dev/null

          mkdir -p mobile/apk-output
          "$IDOGS_APKSIGNER" verify --verbose --print-certs "$APK" | tee mobile/apk-output/SIGNING_REPORT.txt
          APK_CERT_SHA=$(
            "$IDOGS_APKSIGNER" verify --print-certs "$APK" \
              | sed -n 's/^.*certificate SHA-256 digest: //p' \
              | head -1 \
              | tr -d ':' \
              | tr '[:upper:]' '[:lower:]'
          )
          test -n "$APK_CERT_SHA"
          echo "Pinned certificate SHA-256: $IDOGS_QA_SIGNING_CERT_SHA256"
          echo "Keystore certificate SHA-256: $QA_KEYSTORE_CERT_SHA256"
          echo "APK signer certificate SHA-256: $APK_CERT_SHA"
          if [ "$APK_CERT_SHA" != "$IDOGS_QA_SIGNING_CERT_SHA256" ] || [ "$APK_CERT_SHA" != "$QA_KEYSTORE_CERT_SHA256" ]; then
            echo 'FAIL CLOSED: APK signer identity does not match pinned QA certificate'
            exit 1
          fi

          OUT_APK="mobile/apk-output/iDogs-QA-staging-debug-${GITHUB_SHA}.apk"
          cp "$APK" "$OUT_APK"
          cat > mobile/apk-output/BUILD_INFO.txt <<EOF
          iDogs Android QA APK
          Git SHA: ${GITHUB_SHA}
          App ID: au.com.idogs.app.staging
          App name: iDogs QA
          Firebase: idogs-app-staging
          Build type: debug QA
          Signing certificate SHA-256: ${APK_CERT_SHA}
          Signing gate: APK signer == pinned QA certificate == QA keystore PASS
          Payments: disabled for this QA build
          EOF
          sha256sum "$OUT_APK" | tee mobile/apk-output/SHA256SUMS.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: idogs-android-debug-apk-${{ github.sha }}
          path: mobile/apk-output/
          if-no-files-found: error
          retention-days: 14
