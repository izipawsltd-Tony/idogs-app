name: Build three-layer breeding rights

on:
  push:
    branches:
      - fix/pedigree-transfer-breeding-eligibility

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: fix/pedigree-transfer-breeding-eligibility
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply verify and commit when explicitly triggered
        shell: bash
        run: |
          set -euo pipefail
          message="$(git log -1 --pretty=%s)"
          if [ "$message" != "automation: run three-layer breeding rights" ]; then
            echo "Not an automation trigger commit; nothing to do."
            exit 0
          fi

          # Repair four over-broad replacement anchors discovered by the first
          # autonomous run. Earlier replacements already consume some of those
          # strings, so make the remaining sire-specific replacements exact.
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/automation-three-layer-breeding-rights.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("    (' — not eligible for breeding`', ' — breeding rights do not permit breeding`'),\n", "    ('Limited Register — not eligible for breeding', 'Limited Register — breeding rights do not permit breeding'),\n")
          s = s.replace("    (' — breeding eligibility unknown`', ' — breeding rights not confirmed`'),\n", "    ('registration not recorded — breeding eligibility unknown', 'registration not recorded — breeding rights not confirmed'),\n")
          s = s.replace("    (' — breeding eligibility not confirmed`', ' — breeding rights not confirmed`'),\n", "")
          s = s.replace("    (' is marked not eligible for breeding`', ' has breeding rights marked not permitted`'),\n", "    ('is marked not eligible for breeding', 'has breeding rights marked not permitted'),\n")
          p.write_text(s, encoding='utf-8')
          PY

          python scripts/automation-three-layer-breeding-rights.py
          npm ci
          npx tsc --noEmit
          npm test
          npm run build
          git diff --check

          git config user.name "iDogs Auto Build"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/breedingCompliance.ts src/lib/breedingCompliance.test.ts src/pages/DogDetailPage.tsx src/pages/LittersPage.tsx api/export-report.js
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat(pedigree): separate registration rights and compliance"
          git push origin HEAD:fix/pedigree-transfer-breeding-eligibility
