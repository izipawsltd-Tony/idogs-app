name: Build three-layer breeding rights

on:
  push:
    branches:
      - fix/pedigree-transfer-breeding-eligibility

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: fix/pedigree-transfer-breeding-eligibility
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: QA repair, verify and commit when explicitly triggered
        shell: bash
        run: |
          set -euo pipefail
          message="$(git log -1 --pretty=%s)"
          if [ "$message" != "automation: fix transfer rights display state" ]; then
            echo "Not a QA repair trigger commit; nothing to do."
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/DogDetailPage.tsx')
          s = p.read_text(encoding='utf-8')
          old = "{initialBreedingRights === 'eligible' ? '🟢 Confirmed — breeding permitted' : initialBreedingRights === 'not_eligible' ? '🔴 Not permitted' : '⚪ Not confirmed'}"
          new = "{breedingRights === 'eligible' ? '🟢 Confirmed — breeding permitted' : breedingRights === 'not_eligible' ? '🔴 Not permitted' : '⚪ Not confirmed'}"
          if old not in s:
            raise SystemExit('Expected transfer rights display anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          npm ci
          npx tsc --noEmit
          npm test
          npm run build
          git diff --check

          git config user.name "iDogs Auto Build"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/DogDetailPage.tsx
          git commit -m "fix(pedigree): keep transfer rights display in sync"
          git push origin HEAD:fix/pedigree-transfer-breeding-eligibility
