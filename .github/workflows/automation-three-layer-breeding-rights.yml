name: Build three-layer breeding rights

on:
  push:
    branches:
      - fix/pedigree-transfer-breeding-eligibility
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: three-layer-breeding-rights-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-commit:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'automation: build three-layer breeding rights'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: fix/pedigree-transfer-breeding-eligibility
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply three-layer patch
        run: python scripts/automation-three-layer-breeding-rights.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Diff safety check
        run: git diff --check

      - name: Commit verified source changes
        shell: bash
        run: |
          git config user.name "iDogs Auto Build"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/breedingCompliance.ts src/lib/breedingCompliance.test.ts src/pages/DogDetailPage.tsx src/pages/LittersPage.tsx api/export-report.js
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat(pedigree): separate registration rights and compliance"
          git push origin HEAD:fix/pedigree-transfer-breeding-eligibility
