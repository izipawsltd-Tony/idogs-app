name: Production preflight 20260901

on:
  push:
    branches:
      - automation/prod-preflight-20260901

permissions:
  contents: read

jobs:
  prod-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: 70a357c0bf0223dbacf9f0c724124d53c9d978ad
          fetch-depth: 1

      - name: Verify exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "70a357c0bf0223dbacf9f0c724124d53c9d978ad"
          test -z "$(git status --porcelain)"
          test ! -e api/qa-repair-plus-entitlement.js
          test ! -e api/qa-auth-context.js

      - name: Link exact Vercel production project
        shell: bash
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"projectId":"prj_UsnGhC1BWtYnmF5rKMYBR9KWkbIo","orgId":"team_oZF1Z0BUEceb9fAXdmFV1Saz","projectName":"idogs-app"}
          JSON

      - name: Audit Production SMS key only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest env ls production --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects > /tmp/env-list.txt 2>&1
          if grep -q 'STRIPE_SMS_ADDON_PRICE_ID' /tmp/env-list.txt; then
            echo 'SMS_PRODUCTION_ENV_PRESENT'
          else
            echo 'SMS_PRODUCTION_ENV_MISSING'
            exit 2
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
