        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$INTEGRATION_SHA"
          git push origin HEAD:integration/litter-extra-staging-20260901
          echo INTEGRATION_PUSH_OK

      - name: Link exact stable staging project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"projectId":"prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o","orgId":"team_oZF1Z0BUEceb9fAXdmFV1Saz","projectName":"idogs-app-staging"}
          JSON
          grep -q 'prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o' .vercel/project.json
          echo STAGING_PROJECT_LINK_OK

      - name: Pull staging env and enforce financial boundary
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects >/tmp/staging-pull.log 2>&1
          ENV_FILE=.vercel/.env.production.local
          test -f "$ENV_FILE"
          grep -Eq '^FIREBASE_PROJECT_ID="?idogs-app-staging"?$' "$ENV_FILE"
          if grep -Eq '^EXTRA_LITTER_CHECKOUT_ENABLED="?true"?$' "$ENV_FILE"; then
            echo 'FAIL: Extra Litter payment enabled on stable staging'
            exit 1
          fi
          if grep -q '^STRIPE_SECRET_KEY=' "$ENV_FILE"; then
            grep -Eq '^STRIPE_SECRET_KEY="?sk_test_' "$ENV_FILE"
          fi
          echo STAGING_FINANCE_BOUNDARY_OK

      - name: Reverify exact source before stable staging deploy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$INTEGRATION_SHA"
          test -z "$(git status --porcelain)"
          test ! -e .github/workflows/litter-extra-staging-promote-v2-20260901.yml
          echo EXACT_INTEGRATION_SOURCE_OK

      - name: Deploy stable staging only
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          STAGING_URL=$(npx --yes vercel@latest deploy --prod --yes --archive=tgz --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects 2>&1 | tee /tmp/staging-deploy.log | grep -Eo 'https://[^ ]+\.vercel\.app' | tail -1)
          test -n "$STAGING_URL"
          echo "STAGING_URL=$STAGING_URL" >> "$GITHUB_ENV"
          echo "STABLE_STAGING_DEPLOYED $STAGING_URL"

      - name: Smoke stable staging and confirm boundaries
        shell: bash
        run: |
          set -euo pipefail
          CODE=000
          for i in {1..36}; do
            CODE=$(curl -sS -o /tmp/home.out -w '%{http_code}' https://idogs-app-staging.vercel.app || true)
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          test "$CODE" = "200"
          API_CODE=$(curl -sS -o /tmp/quota.out -w '%{http_code}' https://idogs-app-staging.vercel.app/api/litter-quota-summary || true)
          test "$API_CODE" = "401"
          test "$(git rev-parse HEAD)" = "$INTEGRATION_SHA"
          echo "STABLE_STAGING_SHA $INTEGRATION_SHA"
          echo 'PROJECT idogs-app-staging'
          echo 'ALIAS https://idogs-app-staging.vercel.app'
          echo 'EXTRA_LITTER_PAYMENT off'
          echo 'IDOGS_PRODUCTION untouched'
