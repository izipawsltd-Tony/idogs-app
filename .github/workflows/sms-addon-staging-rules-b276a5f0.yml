name: SMS Add-on staging env audit

on:
  push:
    branches:
      - ops/sms-addon-staging-config-b276a5f0

permissions:
  contents: read

jobs:
  audit-staging-env:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: team_oZF1Z0BUEceb9fAXdmFV1Saz
      VERCEL_PROJECT_ID: prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Verify staging project gate
        shell: bash
        run: |
          set -euo pipefail
          test "$VERCEL_PROJECT_ID" = "prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o"
          test "$VERCEL_ORG_ID" = "team_oZF1Z0BUEceb9fAXdmFV1Saz"
          test -n "${VERCEL_TOKEN:-}"
          echo "PASS staging project gate"

      - name: Audit Stripe env keys and targets without decrypting values
        shell: bash
        run: |
          set -euo pipefail
          http=$(curl --silent --show-error --output /tmp/envs.json --write-out '%{http_code}' \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}")
          test "$http" = "200"
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/envs.json','utf8'));
          const envs=Array.isArray(x.envs)?x.envs:[];
          for (const key of ['STRIPE_SECRET_KEY','STRIPE_SMS_ADDON_PRICE_ID']) {
            const rows=envs.filter(e=>e.key===key);
            if (!rows.length) {
              console.log(`${key}: MISSING`);
              continue;
            }
            for (const e of rows) {
              const target=Array.isArray(e.target)?e.target.join(','):String(e.target||'');
              console.log(`${key}: PRESENT target=[${target}] type=${e.type||''} gitBranch=${e.gitBranch||''}`);
            }
          }
          NODE
