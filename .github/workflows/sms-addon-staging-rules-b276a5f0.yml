name: SMS Add-on staging config and Preview

on:
  push:
    branches:
      - ops/sms-addon-staging-config-b276a5f0

permissions:
  contents: read

jobs:
  configure-and-deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXACT_SHA: 50829161edd00a771c1676195190f702eb6504b6
      VERCEL_ORG_ID: team_oZF1Z0BUEceb9fAXdmFV1Saz
      VERCEL_PROJECT_ID: prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o
      GITHUB_REPO_ID: '1270695712'
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SMS_PRICE_ID: price_1U8HCWGHgBd6ZgJEH0qNamDH
    steps:
      - name: Verify staging-only gate
        shell: bash
        run: |
          set -euo pipefail
          test "$VERCEL_PROJECT_ID" = "prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o"
          test "$VERCEL_ORG_ID" = "team_oZF1Z0BUEceb9fAXdmFV1Saz"
          test -n "${VERCEL_TOKEN:-}"
          test "$SMS_PRICE_ID" = "price_1U8HCWGHgBd6ZgJEH0qNamDH"
          echo "PASS staging-only gate"

      - name: Upsert iDogs staging SMS Price env
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs"); fs.writeFileSync("/tmp/env.json",JSON.stringify({key:"STRIPE_SMS_ADDON_PRICE_ID",value:process.env.SMS_PRICE_ID,type:"plain",target:["preview","production"],comment:"iDogs SMS Add-on V1 staging/test Price"}))'
          http=$(curl --silent --show-error --output /tmp/env-response.json --write-out '%{http_code}' \
            --request POST \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?upsert=true&teamId=${VERCEL_ORG_ID}" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/env.json)
          if [ "$http" -lt 200 ] || [ "$http" -ge 300 ]; then echo "STOP env upsert HTTP $http"; cat /tmp/env-response.json; exit 4; fi
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/env-response.json","utf8")); const s=JSON.stringify(x); if(!s.includes("STRIPE_SMS_ADDON_PRICE_ID")) process.exit(5); console.log("PASS staging SMS Price env updated")'

      - name: Create exact-SHA Preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs"); const b={name:"idogs-app-staging",gitSource:{type:"github",ref:"feature/sms-addon-v1",repoId:Number(process.env.GITHUB_REPO_ID),sha:process.env.EXACT_SHA},gitMetadata:{remoteUrl:"https://github.com/izipawsltd-Tony/idogs-app.git",commitRef:"feature/sms-addon-v1",commitSha:process.env.EXACT_SHA,dirty:false,ci:true,ciType:"github-actions",ciGitProviderUsername:"izipawsltd-Tony",ciGitRepoVisibility:"public",rootDirectory:""},meta:{approvedExactSha:process.env.EXACT_SHA,sourceBranch:"feature/sms-addon-v1",validationWorkflow:"sms-addon-staging-config-preview",smsPriceIdConfigured:"true"}}; fs.writeFileSync("/tmp/deploy.json",JSON.stringify(b))'
          http=$(curl --silent --show-error --output /tmp/deploy-response.json --write-out '%{http_code}' \
            --request POST \
            "https://api.vercel.com/v13/deployments?teamId=${VERCEL_ORG_ID}" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/deploy.json)
          if [ "$http" -lt 200 ] || [ "$http" -ge 300 ]; then echo "STOP deployment create HTTP $http"; cat /tmp/deploy-response.json; exit 6; fi
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/deploy-response.json","utf8")); if(!x.id||!x.url) process.exit(7); fs.appendFileSync(process.env.GITHUB_OUTPUT,`deployment_id=${x.id}\nurl=https://${x.url}\n`)'

      - name: Wait for READY exact-SHA Preview
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            http=$(curl --silent --show-error --output /tmp/deployment.json --write-out '%{http_code}' \
              "https://api.vercel.com/v13/deployments/${DEPLOYMENT_ID}?teamId=${VERCEL_ORG_ID}" \
              --header "Authorization: Bearer ${VERCEL_TOKEN}")
            test "$http" = "200"
            state=$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/deployment.json","utf8")); const sha=x?.meta?.githubCommitSha||x?.meta?.approvedExactSha||x?.gitSource?.sha||""; const projectId=x?.projectId||x?.project?.id||""; if(projectId&&projectId!==process.env.VERCEL_PROJECT_ID) process.exit(8); if(sha&&sha!==process.env.EXACT_SHA) process.exit(9); if(x?.target==="production") process.exit(10); process.stdout.write(x.readyState||x.status||"")')
            case "$state" in
              READY) echo "PASS READY exact-SHA staging Preview"; exit 0;;
              ERROR|CANCELED|BLOCKED) echo "STOP deployment state=$state"; exit 11;;
            esac
            sleep 5
          done
          echo 'STOP timeout waiting for READY'; exit 12
