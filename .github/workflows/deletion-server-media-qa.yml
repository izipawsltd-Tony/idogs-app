name: Deletion server and media fence verification
on:
  push:
    branches: [fix/deletion-server-media-fence-20261021]
  pull_request:
    paths:
      - api/**
      - scripts/test-deletion-server-media-emulator.mjs
      - .github/workflows/deletion-server-media-qa.yml
permissions:
  contents: read
jobs:
  server-media-fence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: node scripts/test-create-dog-core.mjs
      - name: Actual handlers, Auth tokens, Firestore transactions and Storage failures; synthetic project only
        env:
          GCLOUD_PROJECT: demo-idogs-account-deletion
        run: npx --yes firebase-tools@14.12.0 emulators:exec --project demo-idogs-account-deletion --only auth,firestore,storage 'node --test scripts/test-account-deletion-emulator.mjs scripts/test-deletion-ledger-emulator.mjs scripts/test-deletion-renewal-emulator.mjs scripts/test-deletion-fence-rules-emulator.mjs scripts/test-deletion-scan-fence-emulator.mjs scripts/test-deletion-server-media-emulator.mjs'
