name: Deploy Meta Pixel staging Preview

on:
  push:
    branches:
      - automation/meta-pixel-preview-20260829
    paths:
      - .github/workflows/meta-pixel-preview-20260829.yml

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact product SHA
        uses: actions/checkout@v4
        with:
          ref: a31a6cd6f0cecee3ca6f25cc72e283a2a38d5003
          fetch-depth: 0

      - name: Fail closed on exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'a31a6cd6f0cecee3ca6f25cc72e283a2a38d5003'
          test -z "$(git status --porcelain)"
          test "$(git diff --name-only 631c44e8f68d7ec0aba49ac1290489333f781e07..HEAD)" = 'index.html'
          grep -q "fbq('init', '2647777915638218');" index.html
          grep -q "fbq('track', 'PageView');" index.html
          grep -q 'https://connect.facebook.net/en_US/fbevents.js' index.html

      - name: Install dependencies and build
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Link exact staging project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"projectId":"prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o","orgId":"team_oZF1Z0BUEceb9fAXdmFV1Saz","projectName":"idogs-app-staging"}
          JSON
          grep -q 'prj_UGKaWkdtHrXpLovxDyoP4Tm8wN5o' .vercel/project.json
          grep -q 'idogs-app-staging' .vercel/project.json

      - name: Deploy exact product SHA to Preview only
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test "$(git rev-parse HEAD)" = 'a31a6cd6f0cecee3ca6f25cc72e283a2a38d5003'
          test -z "$(git status --porcelain --untracked-files=no)"
          npx --yes vercel@latest deploy --yes --archive=tgz --token="$VERCEL_TOKEN" --scope=izipawsltd-tonys-projects
          echo 'Preview only: no --prod and no stable alias promotion.'
